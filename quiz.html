<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 
        initial-scale=1.0, maximum-scale=1.0, 
        user-scalable=no">
  <title>Rewind Paradise — Pause Déjeuner</title>
  <style>

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Courier New', monospace;
      color: #f0f0ff;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background 2s;
      background: url('posters/quiz-fond.png') center/cover fixed;
    }

    body.psycho {
      animation: psychoBg 8s ease infinite;
    }

    @keyframes psychoBg {
      0%   { filter: brightness(1); }
      50%  { filter: brightness(0.92); }
      100% { filter: brightness(1); }
    }

    /* SCANLINES */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.1) 3px, rgba(0,0,0,0.1) 4px
      );
      pointer-events: none;
      z-index: 1;
    }

    /* PSYCHO OVERLAY */
    .psycho-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      z-index: 2;
    }

    .psycho-overlay.visible { display: block; }

    /* TOP BAR */
    .top-bar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(5,5,8,0.75);
      border-bottom: 1px solid #0d0d1a;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .top-title {
      font-size: 10px;
      color: #ff8855;
      letter-spacing: 3px;
      text-shadow: 0 0 8px #ff885540;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .top-info {
      font-size: 9px;
      color: #333355;
      letter-spacing: 1px;
    }

    .mute-btn {
      font-size: 16px;
      cursor: pointer;
      opacity: 0.5;
    }

    /* MAIN */
    .main {
      padding: 0 0 100px;
      position: relative;
      z-index: 5;
    }

    /* RITUEL */
    .rituel-zone {
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rideau-label {
      font-size: 8px;
      color: #333355;
      letter-spacing: 3px;
      text-align: center;
      padding: 8px;
      border: 1px solid #0d0d1a;
      border-radius: 4px;
    }

    /* JOINT ANIMATION */
    .joint-scene {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px;
      background: #050510;
      border: 1px solid #1e1e3a;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      min-height: 120px;
    }

    .joint-scene.allume {
      border-color: #44aa4440;
      background: #030a03;
    }

    .joint-svg {
      width: 80px;
      height: 24px;
      margin-top: 8px;
    }

    .joint-status {
      font-size: 9px;
      color: #333355;
      letter-spacing: 2px;
    }

    .joint-status.allume { color: #44aa44; }

    /* PARTICULES */
    .particule {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      pointer-events: none;
      animation: particuleMonte linear forwards;
    }

    @keyframes particuleMonte {
      0%   { opacity: 1; transform: translateY(0) translateX(0) scale(1); }
      50%  { opacity: 0.6; transform: translateY(-30px) translateX(var(--dx)) scale(0.8); }
      100% { opacity: 0; transform: translateY(-60px) translateX(var(--dx2)) scale(0.3); }
    }

    /* BULLES BD */
    /* Bulles rituel — masquées, remplacées par les grands avatars */
    .bulles-rituel { display: none !important; }
    .bulle-pause   { display: none !important; }

    /* SÉPARATEUR QUIZ */
    .quiz-sep {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px 0;
    }

    .quiz-sep-line      { flex: 1; height: 1px; background: #1e1e3a; }
    .quiz-sep-label     { font-size: 8px; color: #ff8855; letter-spacing: 3px; flex-shrink: 0; }

    /* QUIZ */
    .quiz-zone {
      padding: 12px 14px;
      display: none;
    }

    .quiz-zone.visible { display: block; }

    .quiz-score-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .quiz-score-label { font-size: 9px; color: #444466; letter-spacing: 2px; }
    .quiz-score-val   { font-size: 14px; color: #00ffc8; font-weight: bold; letter-spacing: 2px; }

    .quiz-progress {
      width: 100%;
      height: 3px;
      background: #0a0a18;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .quiz-progress-fill {
      height: 100%;
      background: #00ffc8;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    .question-card {
      background: #080818;
      border: 1px solid #1e1e3a;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .question-numero {
      font-size: 8px;
      color: #333355;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .question-texte {
      font-size: 13px;
      color: #e0e0f0;
      line-height: 1.6;
      margin-bottom: 12px;
      letter-spacing: 0.3px;
    }

    .question-categorie {
      font-size: 8px;
      color: #ff885540;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .reponses { display: flex; flex-direction: column; gap: 7px; }

    .reponse-btn {
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-radius: 6px;
      padding: 11px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: background 0.1s;
    }

    .reponse-btn:active { background: #0f0f22; }

    .reponse-btn.correct {
      border-color: #00ffc8;
      background: #051510;
      animation: correctPulse 0.4s ease;
    }

    .reponse-btn.incorrect {
      border-color: #ff4466;
      background: #150510;
      opacity: 0.7;
    }

    .reponse-btn.disabled { pointer-events: none; }

    @keyframes correctPulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .reponse-lettre {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #1e1e3a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      color: #6060aa;
      flex-shrink: 0;
      font-weight: bold;
    }

    .reponse-btn.correct  .reponse-lettre { background: #00ffc8; color: #030306; }
    .reponse-btn.incorrect .reponse-lettre { background: #ff4466; color: #030306; }

    .reponse-texte { font-size: 11px; color: #c0c0dd; line-height: 1.4; }

    /* FEEDBACK */
    .feedback-zone {
      padding: 10px 14px;
      display: none;
    }

    .feedback-zone.visible { display: block; }

    .feedback-card {
      background: #080818;
      border: 1px solid #2e2e50;
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .feedback-resultat {
      font-size: 12px;
      letter-spacing: 1px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .feedback-resultat.ok  { color: #00ffc8; }
    .feedback-resultat.ko  { color: #ff4466; }

    .feedback-explication {
      font-size: 10px;
      color: #7070aa;
      font-style: italic;
      line-height: 1.6;
      margin-bottom: 10px;
    }

    /* Indice Corey */
    .corey-indice {
      display: flex;
      justify-content: flex-end;
      margin-bottom: 8px;
    }

    .corey-indice-texte {
      max-width: 85%;
      background: #1a0f05;
      border: 1px solid #ff885530;
      border-radius: 14px 4px 14px 14px;
      padding: 7px 11px;
      font-size: 10px;
      color: #cc9966;
      font-style: italic;
      line-height: 1.4;
    }

    .btn-suivant {
      width: 100%;
      background: #071a10;
      border: 2px solid #00ffc8;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      font-size: 11px;
      color: #00ffc8;
      letter-spacing: 3px;
      font-family: 'Courier New', monospace;
      font-weight: bold;
    }

    .btn-suivant:active { background: #0d2418; }

    /* RÉSULTAT FINAL */
    .resultat-final {
      display: none;
      padding: 16px 14px;
    }

    .resultat-final.visible { display: block; }

    .resultat-card {
      background: #080818;
      border: 1px solid #2e2e50;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      text-align: center;
    }

    .resultat-titre {
      font-size: 10px;
      color: #ff8855;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .resultat-score {
      font-size: 48px;
      font-weight: bold;
      color: #00ffc8;
      text-shadow: 0 0 20px #00ffc8;
      margin-bottom: 4px;
    }

    .resultat-total {
      font-size: 12px;
      color: #444466;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .resultat-corey {
      font-size: 12px;
      color: #cc9966;
      font-style: italic;
      line-height: 1.6;
      border-top: 1px solid #1e1e3a;
      padding-top: 12px;
    }

    .btn-retour {
      width: 100%;
      background: #100508;
      border: 1px solid #ff8855;
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      font-size: 11px;
      color: #ff8855;
      letter-spacing: 3px;
      font-family: 'Courier New', monospace;
    }

    .btn-retour:active { background: #180a05; }

    /* BOTTOM BAR */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: rgba(3,3,6,0.80);
      border-top: 1px solid #0d0d1a;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      z-index: 100;
    }

    .gauge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .gauge-icon { font-size: 14px; }

    .gauge-bar-container {
      width: 100%; height: 4px;
      background: #0f0f20;
      border-radius: 2px;
      overflow: hidden;
    }

    .gauge-bar { height: 100%; border-radius: 2px; }
    .gauge-bar.money  { background: #00ffc8; }
    .gauge-bar.legal  { background: #ff8855; }
    .gauge-bar.expo   { background: #ff4466; }
    .gauge-bar.energy { background: #ffdd44; }

    .gauge-value { font-size: 8px; color: #6060aa; letter-spacing: 1px; }

    .fade-out { animation: fadeOut 0.5s forwards; }

    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

  </style>
</head>
<body>

  <div class="psycho-overlay" id="psycho-overlay">
    <canvas id="psycho-canvas" style="width:100%;height:100%;opacity:0.15;"></canvas>
  </div>

  <div class="top-bar">
    <div class="top-title">⏸ PAUSE DÉJEUNER</div>
    <div class="top-right">
      <div class="top-info" id="top-info">Jour 1 — S1</div>
      <div class="mute-btn" id="mute-btn" onclick="toggleMute()">🔊</div>
    </div>
  </div>

  <div class="main">

    <!-- RITUEL -->
    <div class="rituel-zone" id="rituel-zone">

      <div class="rideau-label">▓ RIDEAU FERMÉ — 13H00 ▓</div>

      <!-- JOINT -->
      <div class="joint-scene" id="joint-scene">
        <svg class="joint-svg" viewBox="0 0 120 24" id="joint-svg">
          <!-- Corps du joint -->
          <rect x="10" y="9" width="85" height="6" rx="3" fill="#e8d5a0"/>
          <!-- Filtre -->
          <rect x="95" y="8" width="18" height="8" rx="2" fill="#c4a882"/>
          <!-- Torsade -->
          <line x1="10" y1="12" x2="0" y2="8" stroke="#d4c090" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Braise — s'allume après -->
          <circle id="braise" cx="7" cy="12" r="3" fill="#333" opacity="0"/>
        </svg>
        <div class="joint-status" id="joint-status">Corey sort le Sicilian Gold.</div>
      </div>

      <!-- BULLES BD RITUEL -->
      <div class="bulles-rituel" id="bulles-rituel"></div>

    </div>

    <!-- SÉPARATEUR -->
    <div class="quiz-sep" id="quiz-sep" style="display:none;">
      <div class="quiz-sep-line"></div>
      <div class="quiz-sep-label">📼 QUIZ CINÉMA</div>
      <div class="quiz-sep-line"></div>
    </div>

    <!-- FRED + COREY PENDANT LE QUIZ — grands avatars -->
    <div id="fred-corey-quiz" style="display:flex;flex-direction:column;gap:0;background:rgba(6,6,15,0.6);padding:0;">

      <!-- FRED haut — bulle à droite -->
      <div style="display:flex;align-items:center;gap:10px;padding:10px 12px 6px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;">
          <img id="fred-quiz-avatar" src="posters/fred.png" alt="Fred"
               style="width:155px;height:155px;border-radius:50%;border:3px solid #00b4ff80;object-fit:cover;background:#080818;box-shadow:0 0 20px #00b4ff40;"
               onerror="this.style.opacity='0'">
          <div style="font-size:9px;color:#00b4ff;letter-spacing:3px;font-weight:bold;text-shadow:0 0 8px #00b4ff60;">FRED</div>
        </div>
        <div id="bulle-fred-quiz" style="
          flex:1;padding:10px 14px;
          background:rgba(16,16,46,0.92);
          border:1px solid #00b4ff50;
          border-radius:4px 14px 14px 14px;
          font-size:13px;font-style:italic;
          color:#ffffff;line-height:1.5;
          min-height:48px;display:flex;align-items:center;
        ">&nbsp;</div>
      </div>

      <!-- COREY bas — bulle à gauche -->
      <div style="display:flex;align-items:center;flex-direction:row-reverse;gap:10px;padding:6px 12px 10px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;">
          <img id="corey-quiz-avatar" src="posters/corey.png" alt="Corey"
               style="width:155px;height:155px;border-radius:50%;border:3px solid #ff2d7880;object-fit:cover;background:#080818;box-shadow:0 0 20px #ff2d7840;"
               onerror="this.style.opacity='0'">
          <div style="font-size:9px;color:#ff4488;letter-spacing:3px;font-weight:bold;text-shadow:0 0 8px #ff2d7860;">COREY</div>
        </div>
        <div id="corey-quiz-texte" style="
          flex:1;padding:10px 14px;
          background:rgba(26,16,5,0.92);
          border:1px solid #ff2d7850;
          border-radius:14px 4px 14px 14px;
          font-size:13px;font-style:italic;
          color:#ffdd99;line-height:1.5;
          min-height:48px;display:flex;align-items:center;
        ">Sicilian Gold. Pose ça.</div>
      </div>

    </div>

    <!-- QUIZ -->
    <div class="quiz-zone" id="quiz-zone">
      <div class="quiz-score-bar">
        <span class="quiz-score-label">SCORE</span>
        <span class="quiz-score-val" id="quiz-score-val">0 / 0</span>
      </div>
      <div class="quiz-progress">
        <div class="quiz-progress-fill" id="quiz-progress-fill" style="width:0%"></div>
      </div>
      <div class="question-card" id="question-card">
        <div class="question-numero" id="question-numero">QUESTION 1</div>
        <div class="question-categorie" id="question-categorie"></div>
        <div class="question-texte" id="question-texte">Chargement...</div>
        <div class="reponses" id="reponses"></div>
      </div>
    </div>

    <!-- FEEDBACK -->
    <div class="feedback-zone" id="feedback-zone">
      <div class="feedback-card">
        <div class="feedback-resultat" id="feedback-resultat"></div>
        <div class="feedback-explication" id="feedback-explication"></div>
        <div class="corey-indice" id="corey-indice" style="display:none;">
          <div class="corey-indice-texte" id="corey-indice-texte"></div>
        </div>
      </div>
      <div class="btn-suivant" onclick="questionSuivante()">▶ SUIVANT</div>
    </div>

    <!-- RÉSULTAT FINAL -->
    <div class="resultat-final" id="resultat-final">
      <div class="resultat-card">
        <div class="resultat-titre">▓ RÉSULTAT ▓</div>
        <div class="resultat-score" id="resultat-score">0</div>
        <div class="resultat-total" id="resultat-total">/ 10</div>
        <div class="resultat-corey" id="resultat-corey"></div>
      </div>
      <!-- DIALOGUE FINAL — Fred et Corey bien HS -->
      <div id="dialogue-hs" style="display:none;margin-top:16px;">

        <!-- Fred haut -->
        <div style="display:flex;align-items:center;gap:10px;padding:0 0 6px;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;">
            <img id="hs-fred-avatar" src="posters/fred-tete.png" alt="Fred"
                 style="width:130px;height:130px;border-radius:50%;border:3px solid #00b4ff80;object-fit:cover;background:#080818;box-shadow:0 0 16px #00b4ff30;"
                 onerror="this.style.opacity='0'">
            <div style="font-size:9px;color:#00b4ff;letter-spacing:3px;font-weight:bold;">FRED</div>
          </div>
          <div id="hs-bulle-fred" style="
            flex:1;padding:9px 13px;
            background:rgba(8,8,30,0.95);
            border:1px solid #00b4ff50;
            border-radius:4px 12px 12px 12px;
            font-size:13px;font-style:italic;
            color:#ffffff;line-height:1.5;
            min-height:44px;display:flex;align-items:center;
          ">&nbsp;</div>
        </div>

        <!-- Corey bas -->
        <div style="display:flex;align-items:center;flex-direction:row-reverse;gap:10px;padding:6px 0 12px;">
          <div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;">
            <img id="hs-corey-avatar" src="posters/corey-tete.png" alt="Corey"
                 style="width:130px;height:130px;border-radius:50%;border:3px solid #ff2d7880;object-fit:cover;background:#080818;box-shadow:0 0 16px #ff2d7830;"
                 onerror="this.style.opacity='0'">
            <div style="font-size:9px;color:#ff4488;letter-spacing:3px;font-weight:bold;">COREY</div>
          </div>
          <div id="hs-bulle-corey" style="
            flex:1;padding:9px 13px;
            background:rgba(20,12,3,0.95);
            border:1px solid #ff2d7850;
            border-radius:12px 4px 12px 12px;
            font-size:13px;font-style:italic;
            color:#ffdd99;line-height:1.5;
            min-height:44px;display:flex;align-items:center;
          ">&nbsp;</div>
        </div>

      </div>

      <div class="btn-retour" id="btn-retour" onclick="retournerAuJeu()" style="display:none;">▶ REPRENDRE LE TRAVAIL</div>
    </div>

  </div>

  <div class="bottom-bar">
    <div class="gauge-item">
      <span class="gauge-icon">💰</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar money" id="bar-money" style="width:40%"></div>
      </div>
      <span class="gauge-value" id="val-money">—</span>
    </div>
    <div class="gauge-item">
      <span class="gauge-icon">🎬</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar legal" id="bar-legal" style="width:0%"></div>
      </div>
      <span class="gauge-value" id="val-legal">—</span>
    </div>
    <div class="gauge-item">
      <span class="gauge-icon">👁</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar expo" id="bar-expo" style="width:0%"></div>
      </div>
      <span class="gauge-value" id="val-expo">—</span>
    </div>
    <div class="gauge-item">
      <span class="gauge-icon">⚡</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar energy" id="bar-energy" style="width:100%"></div>
      </div>
      <span class="gauge-value" id="val-energy">—</span>
    </div>
  </div>

  <audio id="bg-music" loop>
    <source src="music/quiz.mp3" type="audio/mpeg">
  </audio>

  <script src="data/quiz.js"></script>

  <script>

    // ===================================================
    // ÉTAT
    // ===================================================

    let gameState       = {};
    let questions       = [];
    let questionIndex   = 0;
    let score           = 0;
    let reponduCette    = false;
    let rituelTermine   = false;
    let music           = null;
    let isMuted         = false;

    // ===================================================
    // MUSIQUE
    // ===================================================

    function initMusic() {
      music   = document.getElementById('bg-music');
      isMuted = localStorage.getItem('rewind_muted') === 'true';
      music.volume = 0.25;
      music.muted  = isMuted;
      document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
      const p = music.play();
      if (p !== undefined) {
        p.catch(() => {
          document.addEventListener('touchstart',
            () => music.play(), { once: true });
        });
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      if (music) music.muted = isMuted;
      localStorage.setItem('rewind_muted', isMuted);
      document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
    }

    function fadeOutMusic(callback) {
      if (!music || isMuted) { if (callback) callback(); return; }
      let vol = music.volume;
      const fade = setInterval(() => {

    function getCoreyScore(s, total) {
      const ratio = s / total;
      if (ratio === 1)        return COREY_SCORES.parfait[Math.floor(Math.random()*3)];
      if (ratio >= 0.8)       return COREY_SCORES.excellent[Math.floor(Math.random()*3)];
      if (ratio >= 0.5)       return COREY_SCORES.moyen[Math.floor(Math.random()*3)];
      if (ratio >= 0.3)       return COREY_SCORES.faible[Math.floor(Math.random()*3)];
      return COREY_SCORES.nul[Math.floor(Math.random()*3)];
    }

    // ===================================================

    // ===================================================

    function lancerRituel() {
      const scene  = document.getElementById('joint-scene');
      const status = document.getElementById('joint-status');
      const zone   = document.getElementById('bulles-rituel');
      const braise = document.getElementById('braise');

      // Phase 1 — Corey sort le joint
      setTimeout(() => {
        status.textContent = 'Corey sort le Sicilian Gold.';
      }, 500);

      // Phase 2 — Il l'allume
      setTimeout(() => {
        status.textContent = 'Il l\'allume.';
        scene.classList.add('allume');
        status.classList.add('allume');

        // Braise qui s'allume
        braise.setAttribute('fill', '#ff6600');
        braise.setAttribute('opacity', '1');
        braise.style.animation = 'none';

        // Éclat orange
        braise.setAttribute('fill', '#ff4400');
        setTimeout(() => { braise.setAttribute('fill', '#ff8800'); }, 200);
        setTimeout(() => { braise.setAttribute('fill', '#ff6600'); }, 400);

        // Particules de fumée
        lancerParticules(scene, 12);

      }, 1800);

      // Phase 3 — Effet psychédélique
      setTimeout(() => {
        status.textContent = 'Silence. La fumée monte.';
        document.body.classList.add('psycho');
        document.getElementById('psycho-overlay').classList.add('visible');
        lancerPsychoCanvas();
      }, 3500);

      // Phase 4 — Premier dialogue
      setTimeout(() => {
        // Choisir un dialogue au hasard
        const dialogueIndex = Math.floor(Math.random() * DIALOGUES_PAUSE.length);
        const dialogue = DIALOGUES_PAUSE[dialogueIndex];
        afficherDialoguePause(dialogue, zone, () => {
          // Jour 1 — expliquer les règles
          if ((gameState.jour||1) === 1 && !gameState.quiz_explique) {
            gameState.quiz_explique = true;
            const reglesDlg = [
              {perso:'corey', texte:"Je pose trois questions."},
              {perso:'fred',  texte:"Je sais."},
              {perso:'corey', texte:"Le perdant rembobine les VHS."},
              {perso:'fred',  texte:"T'as inventé ça."},
              {perso:'corey', texte:"C'est une tradition."},
              {perso:'fred',  texte:"C'est pas une tradition."},
              {perso:'corey', texte:"Ça le devient. Les questions sont en bas."},
              {perso:'fred',  texte:"Je sais lire."},
            ];
            afficherDialoguePause(reglesDlg, zone, () => {
              setTimeout(lancerQuiz, 1500);
            });
          } else {
            // Rappel court depuis semaine 2
            if (Math.random() < 0.3) {
              const rappelDlg = [
                {perso:'corey', texte:"Le perdant rembobine."},
                {perso:'fred',  texte:"Je sais."},
                {perso:'corey', texte:"Les questions sont en bas."},
              ];
              afficherDialoguePause(rappelDlg, zone, () => {
                setTimeout(lancerQuiz, 1000);
              });
            } else {
              setTimeout(lancerQuiz, 1500);
            }
          }
        });
      }, 5000);
    }

    function lancerParticules(container, nb) {
      for (let i = 0; i < nb; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.className = 'particule';
          const colors = ['#44aa44','#88cc44','#cc9944','#aaaaff','#ffaa44'];
          const color  = colors[Math.floor(Math.random() * colors.length)];
          const dx     = (Math.random() - 0.5) * 40;
          const dx2    = (Math.random() - 0.5) * 60;
          const size   = Math.random() * 4 + 2;
          const left   = 30 + Math.random() * 40;
          p.style.cssText = `
            background: ${color};
            left: ${left}%;
            bottom: 30%;
            width: ${size}px;
            height: ${size}px;
            --dx: ${dx}px;
            --dx2: ${dx2}px;
            animation-duration: ${1.5 + Math.random()}s;
            animation-delay: ${Math.random() * 0.5}s;
          `;
          container.appendChild(p);
          setTimeout(() => p.remove(), 3000);
        }, i * 150);
      }
    }

    function lancerPsychoCanvas() {
      const canvas  = document.getElementById('psycho-canvas');
      const ctx     = canvas.getContext('2d');
      canvas.width  = window.innerWidth;
      canvas.height = window.innerHeight;

      let t = 0;
      function draw() {
        if (!document.body.classList.contains('psycho')) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Cercles psychédéliques
        for (let i = 0; i < 5; i++) {
          const x = canvas.width/2 + Math.sin(t + i) * 80;
          const y = canvas.height/2 + Math.cos(t * 0.7 + i) * 60;
          const r = 30 + Math.sin(t * 2 + i) * 20;
          const hue = (t * 30 + i * 60) % 360;
          ctx.beginPath();
          ctx.arc(x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = `hsla(${hue}, 70%, 50%, 0.1)`;
          ctx.fill();
        }

        t += 0.03;
        requestAnimationFrame(draw);
      }
      draw();

      // Arrêter après le rituel
      setTimeout(() => {
        document.body.classList.remove('psycho');
        document.getElementById('psycho-overlay').classList.remove('visible');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }, 18000);
    }

    // Avatars Corey selon humeur
    const COREY_QUIZ_AVATARS = {
      neutre:'posters/corey.png', joie:'posters/corey-heureux.png',
      pensif:'posters/corey-pensif.png', illumine:'posters/corey-illumine.png',
      high:'posters/corey-high.png', conspirationiste:'posters/corey-conspirationiste.png',
      depite:'posters/corey-depite.png', contrarie:'posters/corey-contrarie.png',
      tete:'posters/corey-tete.png', peur:'posters/corey-peur.png',
      ecarquille:'posters/corey-ecarquille.png', colere1:'posters/corey-colere1.png',
    };
    const FRED_QUIZ_AVATARS = {
      neutre:'posters/fred.png', doute:'posters/fred_doute.png',
      fier:'posters/fred_fier.png', attentif:'posters/fred-attentif.png',
      amuse:'posters/fred-amuse.png', pas_content:'posters/fred-pas-content.png',
      tete:'posters/fred-tete.png', non:'posters/fred-non.png',
      tranquille:'posters/fred-tranquille.png', soupir:'posters/fred-soupir.png',
    };

    // Avatars qui varient selon les thèmes du dialogue
    const COREY_DIALOGUE_MOODS = ['pensif','illumine','conspirationiste','neutre','ecarquille','contrarie'];
    const FRED_DIALOGUE_MOODS  = ['attentif','doute','tranquille','neutre','non','amuse'];

    function setQuizAvatar(perso, humeur) {
      if (perso === 'corey') {
        const src = COREY_QUIZ_AVATARS[humeur] || COREY_QUIZ_AVATARS.neutre;
        const el = document.getElementById('corey-quiz-avatar');
        if (el) el.src = src;
      } else if (perso === 'fred') {
        const src = FRED_QUIZ_AVATARS[humeur] || FRED_QUIZ_AVATARS.neutre;
        const el = document.getElementById('fred-quiz-avatar');
        if (el) el.src = src;
      }
    }

    function afficherDialoguePause(dialogue, zone, callback) {
      zone.innerHTML = '';
      let index = 0;
      let coreyMoodIdx = 0;
      let fredMoodIdx  = 0;

      function next() {
        if (index >= dialogue.length) {
          if (callback) callback();
          return;
        }

        const rep = dialogue[index];

        // Bulle dans la zone texte
        const div = document.createElement('div');
        div.className = `bulle-pause ${rep.perso}`;
        div.innerHTML = `<div class="bulle-pause-texte">${rep.texte}</div>`;
        zone.appendChild(div);
        div.scrollIntoView({ behavior:'smooth', block:'nearest' });
        const toutes = zone.querySelectorAll('.bulle-pause');
        if (toutes.length > 4) toutes[0].remove();

        // Mettre à jour les grandes bulles avatars
        if (rep.perso === 'corey') {
          const el = document.getElementById('corey-quiz-texte');
          if (el) { el.textContent = rep.texte; }
          // Changer avatar Corey selon humeur
          const mood = rep.humeur || COREY_DIALOGUE_MOODS[coreyMoodIdx % COREY_DIALOGUE_MOODS.length];
          setQuizAvatar('corey', mood);
          coreyMoodIdx++;
        } else if (rep.perso === 'fred') {
          const el = document.getElementById('bulle-fred-quiz');
          if (el) { el.textContent = rep.texte; }
          const mood = rep.humeur || FRED_DIALOGUE_MOODS[fredMoodIdx % FRED_DIALOGUE_MOODS.length];
          setQuizAvatar('fred', mood);
          fredMoodIdx++;
        }

        index++;
        const delai = Math.min(rep.texte.length * 50 + 600, 3200);
        setTimeout(next, delai);
      }

      next();
    }

    // ===================================================
    // QUIZ
    // ===================================================

    function lancerQuiz() {
      // 3 questions via QUIZ.getQuestions
      const qs = (typeof QUIZ !== 'undefined' && QUIZ.getQuestions)
        ? QUIZ.getQuestions(gameState)
        : [];
      // Convertir format QUIZ → format local
      questions = qs.map(q => ({
        q:      q.question,
        rep:    q.choix,
        bonne:  q.bonneIndex,
        cat:    q.categorie
      }));
      // Fallback si QUIZ pas dispo
      if (!questions.length) {
        questions = [
          { q:"Dans Ghost, quel est le prénom du personnage de Patrick Swayze ?", rep:["Sam","Jack","Tom","Ray"], bonne:0, cat:"CATALOGUE" },
          { q:"Qui a réalisé Psychose ?", rep:["Hitchcock","Kubrick","De Palma","Lynch"], bonne:0, cat:"CINÉMA" },
          { q:"Que signifie VHS ?", rep:["Video Home System","Video High Speed","Visual Home Standard","Video Hi-Fi"], bonne:0, cat:"VHS" }
        ];
      }
      questionIndex = 0;
      score         = 0;

      // Réplique "pas en état" — dans les bulles avatars
      const repliques = [
        [{perso:'fred',  texte:"Je suis pas sur d'etre en etat.", humeur:'doute'},
         {perso:'corey', texte:"C'est le principe.", humeur:'illumine'}],
        [{perso:'corey', texte:"Oh la.", humeur:'ecarquille'},
         {perso:'fred',  texte:"On joue quand meme.", humeur:'non'},
         {perso:'corey', texte:"On joue quand meme.", humeur:'pensif'}],
        [{perso:'fred',  texte:"T'es sur que c'est une bonne idee ?", humeur:'doute'},
         {perso:'corey', texte:"Non. Allez.", humeur:'contrarie'}],
        [{perso:'corey', texte:"Je vois trois questions.", humeur:'ecarquille'},
         {perso:'fred',  texte:"Y'en a trois.", humeur:'tranquille'},
         {perso:'corey', texte:"Bien.", humeur:'pensif'}],
        [{perso:'fred',  texte:"Je me sens... leger.", humeur:'amuse'},
         {perso:'corey', texte:"C'est normal.", humeur:'high'}],
      ];
      const rep = repliques[Math.floor(Math.random()*repliques.length)];
      const zone = document.getElementById('bulles-rituel');
      let i = 0;
      function afficherRep() {
        if (i >= rep.length) {
          document.getElementById('quiz-sep').style.display = 'flex';
          document.getElementById('quiz-zone').classList.add('visible');
          afficherQuestion();
          return;
        }
        const r = rep[i];
        // Mettre à jour bulle avatar
        if (r.perso === 'corey') {
          const el = document.getElementById('corey-quiz-texte');
          if (el) el.textContent = r.texte;
          setQuizAvatar('corey', r.humeur || 'neutre');
        } else {
          const el = document.getElementById('bulle-fred-quiz');
          if (el) el.textContent = r.texte;
          setQuizAvatar('fred', r.humeur || 'neutre');
        }
        // Bulle rituel aussi
        const div = document.createElement('div');
        div.className = 'bulle-pause ' + r.perso;
        div.innerHTML = '<div class="bulle-pause-texte">' + r.texte + '</div>';
        zone.appendChild(div);
        const toutes = zone.querySelectorAll('.bulle-pause');
        if (toutes.length > 3) toutes[0].remove();
        i++;
        setTimeout(afficherRep, Math.min(r.texte.length * 40 + 500, 1800));
      }
      afficherRep();
    }

    function afficherQuestion() {
      if (questionIndex >= questions.length) {
        afficherResultat();
        return;
      }

      const q = questions[questionIndex];
      reponduCette = false;

      document.getElementById('question-numero').textContent =
        `QUESTION ${questionIndex + 1} / ${questions.length}`;
      
      // Corey annonce la catégorie
      const coreyTextes = {
        CATALOGUE: ["Catalogue.", "On a le film sur l'etagere.", "C'est chez nous."],
        CINEMA:    ["Culture generale.", "Kubrick savait ca.", "Hitchcock aussi."],
        VHS:       ["On vit avec ca.", "Fonds de commerce.", "Pas d'excuse."],
        REWIND:    ["C'est notre vie.", "Tu vis dedans.", "Celle-la c'est pour toi."],
        COREY:     ["Question speciale.", "Celle-la vient de moi.", "Tu peux pas deviner."]
      };
      const catKey = (q.cat || 'CINEMA').replace(/[ÉÈÊ]/g,'E').replace(/[é]/g,'e').replace(/[À]/g,'A');
      const pool = coreyTextes[catKey] || coreyTextes.CINEMA;
      const texte = pool[Math.floor(Math.random()*pool.length)];
      const coTexte = document.getElementById('corey-quiz-texte');
      if (coTexte) coTexte.textContent = texte;
      // Avatar Corey selon catégorie
      const catAvatars = {
        CATALOGUE:'pensif', CINEMA:'illumine', VHS:'contrarie',
        REWIND:'conspirationiste', COREY:'ecarquille'
      };
      setQuizAvatar('corey', catAvatars[catKey] || 'neutre');
      setQuizAvatar('fred', ['attentif','doute','tranquille'][Math.floor(Math.random()*3)]);
      document.getElementById('question-categorie').textContent =
        q.cat ? `▸ ${q.cat}` : '';
      document.getElementById('question-texte').textContent = q.q;

      // Progress bar
      const pct = (questionIndex / questions.length) * 100;
      document.getElementById('quiz-progress-fill').style.width = pct + '%';

      // Score
      document.getElementById('quiz-score-val').textContent =
        `${score} / ${questionIndex}`;

      // Réponses — mélanger
      const lettres = ['A','B','C','D'];
      const indices = [0,1,2,3].sort(() => Math.random() - 0.5);
      const reponsesEl = document.getElementById('reponses');

      reponsesEl.innerHTML = indices.map((idx, pos) => `
        <div class="reponse-btn" onclick="repondre(${idx})" data-idx="${idx}">
          <div class="reponse-lettre">${lettres[pos]}</div>
          <div class="reponse-texte">${q.rep[idx]}</div>
        </div>
      `).join('');

      // Cacher feedback
      document.getElementById('feedback-zone').classList.remove('visible');

      // Indice Corey aléatoire (20% de chance)
      if (Math.random() < 0.2 && questionIndex > 0) {
        setTimeout(() => {
          const indices_corey = [
            "La réponse c'est pas la plus évidente.",
            "Réfléchis à qui a réalisé ça.",
            "C'est une question sur le tournage, pas le film.",
            "Kubrick. La réponse est souvent Kubrick.",
            "Pense à la date. Années 70 ou 80 ?",
            "C'est une question de logique. Pas de mémoire.",
            "J'aurais mis ma main à couper. Mais je te dis rien.",
            "..."
          ];
          const zone = document.getElementById('bulles-rituel');
          const div  = document.createElement('div');
          div.className = 'bulle-pause corey';
          div.innerHTML = `<div class="bulle-pause-texte">${indices_corey[Math.floor(Math.random()*indices_corey.length)]}</div>`;
          zone.appendChild(div);
          const toutes = zone.querySelectorAll('.bulle-pause');
          if (toutes.length > 3) toutes[0].remove();
        }, 3000);
      }
    }

    function repondre(idx) {
      if (reponduCette) return;
      reponduCette = true;

      const q       = questions[questionIndex];
      const correct = idx === q.bonne;
      const btns    = document.querySelectorAll('.reponse-btn');

      btns.forEach(btn => {
        btn.classList.add('disabled');
        const btnIdx = parseInt(btn.dataset.idx);
        if (btnIdx === q.bonne)  btn.classList.add('correct');
        if (btnIdx === idx && idx !== q.c) btn.classList.add('incorrect');
      });

      if (correct) score++;

      // Feedback
      const feedbackZone = document.getElementById('feedback-zone');
      document.getElementById('feedback-resultat').textContent =
        correct ? '✓ CORRECT' : '✗ RATÉ';
      document.getElementById('feedback-resultat').className =
        `feedback-resultat ${correct ? 'ok' : 'ko'}`;
      document.getElementById('feedback-explication').textContent =
        q.explication || '';

      // Indice Corey si disponible
      if (q.corey) {
        document.getElementById('corey-indice').style.display = 'flex';
        document.getElementById('corey-indice-texte').textContent = q.corey;
      } else {
        document.getElementById('corey-indice').style.display = 'none';
      }

      feedbackZone.classList.add('visible');
      feedbackZone.scrollIntoView({ behavior:'smooth' });
    }

    function questionSuivante() {
      questionIndex++;
      document.getElementById('feedback-zone').classList.remove('visible');
      document.getElementById('question-card').scrollIntoView({ behavior:'smooth' });
      setTimeout(afficherQuestion, 300);
    }

    function afficherResultat() {
      document.getElementById('quiz-zone').classList.remove('visible');
      document.getElementById('feedback-zone').classList.remove('visible');

      const total   = 3;
      const pct     = Math.round((score / total) * 100);
      const couleur = score === 3 ? '#00ffc8' : score >= 2 ? '#ff8855' : '#ff4466';

      document.getElementById('resultat-score').textContent = score;
      // Reset avatars au neutre
      const fr = document.getElementById('fred-quiz-avatar');
      const cr = document.getElementById('corey-quiz-avatar');
      const ct = document.getElementById('corey-quiz-texte');
      if (fr) fr.src = score === 3 ? 'posters/fred_fier.png' : 'posters/fred.png';
      if (cr) cr.src = score === 3 ? 'posters/corey-heureux.png' : score === 0 ? 'posters/corey-colere1.png' : 'posters/corey.png';
      document.getElementById('resultat-score').style.color = couleur;
      document.getElementById('resultat-score').style.textShadow = `0 0 20px ${couleur}`;
      document.getElementById('resultat-total').textContent = `/ 3`;
      document.getElementById('resultat-corey').textContent = getCoreyScore(score, total);

      // Impact gameState
      if (score >= 8) {
        gameState.energie = Math.min(
          gameState.energieMax||15,
          (gameState.energie||0) + 3
        );
      } else if (score <= 3) {
        gameState.energie = Math.max(0, (gameState.energie||0) - 1);
      }

      saveGame();

      document.getElementById('resultat-final').classList.add('visible');
      document.getElementById('resultat-final').scrollIntoView({ behavior:'smooth' });

      // Dialogue final HS — après 1.5s
      setTimeout(lancerDialogueHS, 1500);
    }

      if (zone) zone.style.display = 'block';

      const variantes = [
        [
          {perso:'corey', texte:"Tu crois qu'on a trop fumé Fred ?"},
          {perso:'fred',  texte:"Mais non."},
          {perso:'corey', texte:"On est bien."},
          {perso:'fred',  texte:"On va gérer."},
        ],
        [
          {perso:'corey', texte:"C'était quoi la dernière question ?"},
          {perso:'fred',  texte:"Je sais plus."},
          {perso:'corey', texte:"Moi non plus."},
          {perso:'fred',  texte:"On va gérer."},
          {perso:'corey', texte:"On est bien."},
        ],
        [
          {perso:'fred',  texte:"T'as l'air d'avoir l'air d'avoir l'air."},
          {perso:'corey', texte:"C'est une phrase ?"},
          {perso:'fred',  texte:"Je sais pas."},
          {perso:'corey', texte:"On est bien."},
          {perso:'fred',  texte:"On va gérer."},
        ],
        [
          {perso:'corey', texte:"Le Sicilian Gold était bon ce midi."},
          {perso:'fred',  texte:"Mmh."},
          {perso:'corey', texte:"T'es d'accord ou t'es endormi ?"},
          {perso:'fred',  texte:"Les deux."},
          {perso:'corey', texte:"On est bien."},
          {perso:'fred',  texte:"On va gérer."},
        ],
        [
          {perso:'corey', texte:"Kubrick aurait pas répondu à ces questions."},
          {perso:'fred',  texte:"Kubrick filmait pas dans un vidéoclub."},
          {perso:'corey', texte:"..."},
          {perso:'corey', texte:"On est bien quand même."},
          {perso:'fred',  texte:"On va gérer."},
        ],
      ];

      const dlg = variantes[Math.floor(Math.random()*variantes.length)];
      let i = 0;

      function setBulle(perso, texte) {
        const el = document.getElementById(perso === 'fred' ? 'hs-bulle-fred' : 'hs-bulle-corey');
        if (el) el.textContent = texte;
      }

      function setAv(perso, src) {
        const el = document.getElementById(perso === 'fred' ? 'hs-fred-avatar' : 'hs-corey-avatar');
        if (el) el.src = src;
      }

      // Gros plans stone
      setAv('fred',  'posters/fred-tete.png');
      setAv('corey', 'posters/corey-tete.png');

      function next() {
        if (i >= dlg.length) {
          // Afficher le bouton REPRENDRE
          setTimeout(() => {
            const btn = document.getElementById('btn-retour');
            if (btn) { btn.style.display = 'block'; btn.scrollIntoView({behavior:'smooth'}); }
          }, 500);
          return;
        }
        const l = dlg[i];
        setBulle(l.perso, l.texte);
        // Alterner légèrement les avatars — high et tete
        if (l.perso === 'corey') {
          setAv('corey', i % 2 === 0 ? 'posters/corey-tete.png' : 'posters/corey-high.png');
        } else {
          setAv('fred', i % 2 === 0 ? 'posters/fred-tete.png' : 'posters/fred-soupir.png');
        }
        i++;
        const delai = Math.min(l.texte.length * 55 + 600, 2200);
        setTimeout(next, delai);
      }

      next();
      zone.scrollIntoView({behavior:'smooth'});
    }

    function retournerAuJeu() {
      gameState.phase_journee = 'apres_midi';
      saveGame();
      fadeOutMusic(() => {
        document.body.classList.add('fade-out');
        setTimeout(() => { window.location.href = 'game.html'; }, 500);
      });
    }

    // ===================================================
    // UI
    // ===================================================

    function updateUI() {
      const gs = gameState;
      document.getElementById('bar-money').style.width =
        Math.min(100, ((gs.argent||0)/500)*100)+'%';
      document.getElementById('val-money').textContent = (gs.argent||0)+'$';
      document.getElementById('bar-legal').style.width = (gs.legalite||0)+'%';
      document.getElementById('val-legal').textContent = (gs.legalite||0)+'%';
      document.getElementById('bar-expo').style.width  = (gs.exposition||0)+'%';
      document.getElementById('val-expo').textContent  = (gs.exposition||0)+'%';
      const ePct = ((gs.energie||0)/(gs.energieMax||15))*100;
      document.getElementById('bar-energy').style.width = ePct+'%';
      document.getElementById('val-energy').textContent =
        (gs.energie||0)+'/'+(gs.energieMax||15);
    }

    function saveGame() {
      localStorage.setItem('rewindParadise_save', JSON.stringify(gameState));
    }
