<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 
        initial-scale=1.0, maximum-scale=1.0, 
        user-scalable=no">
  <title>Rewind Paradise — Le Vidéoclub</title>
  <link rel="stylesheet" href="data/style.css">
  <script src="data/dialogues.js"></script>
  <script src="data/events.js"></script>
  <script src="data/canopi.js"></script>
  <script src="data/sounds.js"></script>
  <script src="data/achievements.js"></script>
  <style>

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .top-bar {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
      background: #080810;
      border-bottom: 1px solid #1e1e3a;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .shop-title {
      font-size: 11px;
      color: #00ffc8;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00ffc8;
    }

    .day-info {
      font-size: 9px;
      color: #444466;
      letter-spacing: 1px;
    }

    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .shop-illustration {
      background: #080810;
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      border-bottom: 1px solid #1e1e3a;
    }

    /* ÉTAGÈRES */
    .shelves {
      width: 82px;
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-radius: 6px;
      padding: 8px 6px;
      flex-shrink: 0;
    }

    .shelves-title {
      font-size: 8px;
      color: #ff8855;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-align: center;
    }

    .shelf-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
      border-bottom: 1px solid #0f0f20;
      cursor: pointer;
    }

    .shelf-item:active { background: rgba(0,255,200,0.04); }

    .shelf-genre { font-size: 8px; color: #6060aa; letter-spacing: 1px; }
    .shelf-count        { font-size: 9px; color: #00ffc8; font-weight: bold; }
    .shelf-count.low    { color: #ff8855; }
    .shelf-count.empty  { color: #ff4466; }

    /* COMPTOIR */
    .counter-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .counter-top {
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-radius: 6px;
      padding: 8px;
      flex: 1;
      overflow-y: auto;
    }

    .counter-label {
      font-size: 8px;
      color: #ff8855;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    /* CLIENTS */
    .client-queue {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .client-card {
      background: #0f0f1e;
      border: 1px solid #1e1e3a;
      border-radius: 5px;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s;
    }

    .client-card:active        { background: #141428; border-color: #00ffc8; }
    .client-card.active-client { border-color: #00ffc8; background: #071a14; }
    .client-card.ramon-card    { border-color: #2e1a2e; }

    .client-mood   { font-size: 15px; width: 22px; }
    .client-info   { flex: 1; margin-left: 6px; }
    .client-name   { font-size: 10px; color: #00ffc8; letter-spacing: 1px; }
    .client-name.ramon { color: #cc88cc; }
    .client-demand { font-size: 9px; color: #9090bb; margin-top: 2px; line-height: 1.3; }

    .client-timer  { display: flex; gap: 2px; }
    .timer-dot       { width: 5px; height: 5px; border-radius: 50%; background: #00ffc8; }
    .timer-dot.empty { background: #1e1e3a; }

    .no-clients {
      font-size: 9px;
      color: #333355;
      text-align: center;
      padding: 12px;
      letter-spacing: 1px;
    }

    /* TV */
    .tv-small {
      width: 54px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tv-small-screen {
      width: 100%;
      aspect-ratio: 4/3;
      background: #030308;
      border: 2px solid #1e1e3a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .tv-small-label {
      font-size: 7px;
      color: #333355;
      letter-spacing: 1px;
      text-align: center;
    }

    /* FRED */
    .fred-thought {
      background: #080810;
      border-left: 2px solid #ff8855;
      padding: 7px 10px;
      margin: 0 12px;
      flex-shrink: 0;
    }

    .fred-thought-text {
      font-size: 10px;
      color: #9090bb;
      font-style: italic;
      line-height: 1.5;
    }

    /* BOUTON FERMER */
    .close-btn {
      margin: 8px 12px;
      background: #100508;
      border: 1px solid #3a1515;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .close-btn:active  { background: #180a0a; }
    .close-btn-text    { font-size: 10px; color: #ff8855; letter-spacing: 3px; }

    /* PANNEAU CLIENT */
    .client-panel {
      display: none;
      position: fixed;
      bottom: 65px; left: 0; right: 0;
      background: #080812;
      border-top: 2px solid #00ffc8;
      padding: 12px 12px 10px;
      z-index: 50;
      max-height: 72vh;
      overflow-y: auto;
    }

    .client-panel.visible   { display: block; }
    .client-panel.ramon-panel { border-top-color: #cc88cc; }

    .panel-client-name {
      font-size: 13px;
      color: #00ffc8;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .panel-client-name.ramon { color: #cc88cc; }

    .panel-client-demand {
      font-size: 11px;
      color: #c0c0dd;
      margin-bottom: 6px;
      line-height: 1.5;
      font-style: italic;
    }

    .panel-ramon-note {
      background: #100810;
      border: 1px solid #3a1a3a;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 8px;
      font-size: 9px;
      color: #7a55aa;
      font-style: italic;
      line-height: 1.5;
      display: none;
    }

    /* NOUVEAUX CLIENTS — badges */
    .panel-client-badge {
      display: inline-block;
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 2px;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .badge-concurrent  { background: #1a1000; color: #aa8800; border: 1px solid #aa880030; }
    .badge-journaliste { background: #001a10; color: #00aa66; border: 1px solid #00aa6630; }
    .badge-collectionneur { background: #100018; color: #8844cc; border: 1px solid #8844cc30; }

    .client-prefs {
      background: #060610;
      border: 1px solid #141428;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 8px;
    }

    .prefs-label {
      font-size: 8px;
      color: #444466;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .pref-tag {
      display: inline-block;
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 2px;
      margin: 2px 2px 0 0;
      letter-spacing: 1px;
    }

    .pref-tag.aime    { background: #00100a; color: #00aa55; border: 1px solid #00aa5520; }
    .pref-tag.deteste { background: #100005; color: #aa0033; border: 1px solid #aa003320; }

    .films-label {
      font-size: 9px;
      color: #666688;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .films-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 8px;
    }

    .film-option {
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-radius: 5px;
      padding: 9px 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .film-option:active         { background: #0f0f22; }
    .film-option.meilleur       { border-color: #00ffc820; background: #051510; }
    .film-option.meilleur-ramon { border-color: #cc88cc30; background: #100810; }
    .film-option.correct        { border-color: #ff882020; }
    .film-option.mauvais        { border-color: #ff002020; opacity: 0.6; }
    .film-option.rupture        { opacity: 0.35; pointer-events: none; }

    .film-info   { flex: 1; }
    .film-titre  { font-size: 11px; color: #e0e0f0; letter-spacing: 0.5px; margin-bottom: 2px; }
    .film-detail { font-size: 8px;  color: #555577; letter-spacing: 1px; }
    .film-match  { font-size: 9px;  margin-left: 8px; flex-shrink: 0; }
    .film-prix   { font-size: 10px; color: #00ffc8; font-weight: bold; margin-left: 8px; flex-shrink: 0; }

    /* Actions spéciales nouveaux clients */
    .action-speciale {
      background: #0a0a18;
      border: 1px solid #2e2e50;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      cursor: pointer;
    }

    .action-speciale:active { background: #0f0f22; }

    .action-speciale-titre {
      font-size: 10px;
      color: #c0c0dd;
      letter-spacing: 1px;
      margin-bottom: 3px;
    }

    .action-speciale-detail {
      font-size: 9px;
      color: #555577;
      letter-spacing: 0.5px;
    }

    .panel-alts {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .panel-alt {
      flex: 1;
      background: #060610;
      border: 1px solid #141428;
      border-radius: 4px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      font-size: 9px;
      color: #666688;
      letter-spacing: 1px;
    }

    .panel-alt:active { background: #0a0a18; }
    .panel-alt.danger { color: #ff5533; border-color: #ff553315; }

    .panel-close {
      text-align: center;
      font-size: 9px;
      color: #333355;
      cursor: pointer;
      letter-spacing: 2px;
      padding: 8px;
      margin-top: 4px;
    }

    /* TENSION RAMON */
    .tension-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #2a0a2a, #cc44cc, #2a0a2a);
      z-index: 600;
      animation: tensionPulse 1s infinite;
    }

    .tension-overlay.visible { display: block; }

    @keyframes tensionPulse {
      0%, 100% { opacity: 0.5; }
      50%       { opacity: 1; }
    }

    /* JAUGES */
    .bottom-bar {
      background: #080810;
      border-top: 1px solid #1e1e3a;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      flex-shrink: 0;
    }

    .gauge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .gauge-icon { font-size: 14px; }

    .gauge-bar-container {
      width: 100%; height: 4px;
      background: #0f0f20;
      border-radius: 2px;
      overflow: hidden;
    }

    .gauge-bar { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .gauge-bar.money  { background: #00ffc8; }
    .gauge-bar.legal  { background: #ff8855; }
    .gauge-bar.expo   { background: #ff4466; }
    .gauge-bar.energy { background: #ffdd44; }

    .gauge-value { font-size: 8px; color: #6060aa; letter-spacing: 1px; }

    .gauge-tooltip {
      display: none;
      position: fixed;
      bottom: 72px; left: 50%;
      transform: translateX(-50%);
      background: #0a0a18;
      border: 1px solid #00ffc8;
      border-radius: 6px;
      padding: 8px 14px;
      font-size: 10px;
      color: #f0f0ff;
      letter-spacing: 1px;
      text-align: center;
      z-index: 400;
      white-space: nowrap;
      max-width: 90vw;
      font-family: 'Courier New', monospace;
    }

    .gauge-tooltip.visible { display: block; }

    .notif {
      display: none;
      position: fixed;
      top: 58px; left: 50%;
      transform: translateX(-50%);
      background: #071a10;
      border: 2px solid #00ffc8;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 11px;
      color: #00ffc8;
      letter-spacing: 1px;
      z-index: 500;
      text-align: center;
      max-width: 85vw;
      font-weight: bold;
      font-family: 'Courier New', monospace;
    }

    .notif.visible   { display: block; animation: notifAnim 2.5s forwards; }
    .notif.negative  { border-color: #ff4466; color: #ff4466; background: #1a0710; }

    @keyframes notifAnim {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-6px); }
      12%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .fade-out { animation: fadeOut 0.5s forwards; }

    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

  </style>
</head>
<body>

  <div class="tension-overlay" id="tension-overlay"></div>

  <div class="top-bar">
    <div class="top-bar-left">
      <div class="btn-icon" onclick="openJournal()">📰</div>
      <div class="shop-title">REWIND PARADISE</div>
    </div>
    <div class="top-bar-right">
      <div class="day-info" id="day-info">Jour 1 — S1</div>
      <div class="btn-icon"
           onclick="ACHIEVEMENTS.showPanel(gameState)">🏆</div>
      <div class="btn-icon" onclick="openStock()">📦</div>
    </div>
  </div>

  <div class="main-area">

    <div class="shop-illustration">

      <div class="shelves">
        <div class="shelves-title">STOCK</div>
        <div class="shelf-item" onclick="showTooltip('stock_action')">
          <span class="shelf-genre">ACTION</span>
          <span class="shelf-count" id="stock-action">8</span>
        </div>
        <div class="shelf-item" onclick="showTooltip('stock_horreur')">
          <span class="shelf-genre">HORREUR</span>
          <span class="shelf-count" id="stock-horreur">6</span>
        </div>
        <div class="shelf-item" onclick="showTooltip('stock_drame')">
          <span class="shelf-genre">DRAME</span>
          <span class="shelf-count" id="stock-drame">4</span>
        </div>
        <div class="shelf-item" onclick="showTooltip('stock_enfants')">
          <span class="shelf-genre">ENFANTS</span>
          <span class="shelf-count" id="stock-enfants">6</span>
        </div>
        <div class="shelf-item" onclick="showTooltip('stock_rarites')">
          <span class="shelf-genre">RARETÉS</span>
          <span class="shelf-count" id="stock-rarites">1</span>
        </div>
      </div>

      <div class="counter-area">
        <div class="counter-top">
          <div class="counter-label">FILE D'ATTENTE</div>
          <div class="client-queue" id="client-queue">
            <div class="no-clients">░ EN ATTENTE D'OUVERTURE ░</div>
          </div>
        </div>
      </div>

      <div class="tv-small">
        <div class="tv-small-screen">📺</div>
        <div class="tv-small-label">AUCUNE<br>CASSETTE</div>
      </div>

    </div>

    <div class="fred-thought">
      <div class="fred-thought-text" id="fred-thought">
        "Un autre jour. Corey arrive quand il veut."
      </div>
    </div>

    <div class="close-btn" onclick="closingTime()">
      <div class="close-btn-text">▼ FERMER LE RIDEAU ▼</div>
    </div>

  </div>

  <!-- PANNEAU CLIENT -->
  <div class="client-panel" id="client-panel">
    <div class="panel-client-name"   id="panel-name">—</div>
    <div class="panel-client-demand" id="panel-demand">—</div>
    <div class="panel-ramon-note"    id="panel-ramon-note">—</div>
    <div id="panel-badge"></div>
    <div class="client-prefs"        id="client-prefs"></div>
    <div id="action-speciale-zone"></div>
    <div class="films-label">CHOISIR UN FILM :</div>
    <div class="films-list"          id="films-list"></div>
    <div class="panel-alts"          id="panel-alts"></div>
    <div class="panel-close" onclick="closePanel()">✕ FERMER</div>
  </div>

  <div class="gauge-tooltip" id="gauge-tooltip"></div>
  <div class="notif"         id="notif"></div>

  <div class="bottom-bar">
    <div class="gauge-item" onclick="showTooltip('money')">
      <span class="gauge-icon">💰</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar money" id="bar-money" style="width:40%"></div>
      </div>
      <span class="gauge-value" id="val-money">200$</span>
    </div>
    <div class="gauge-item" onclick="showTooltip('legal')">
      <span class="gauge-icon">🎬</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar legal" id="bar-legal" style="width:0%"></div>
      </div>
      <span class="gauge-value" id="val-legal">0%</span>
    </div>
    <div class="gauge-item" onclick="showTooltip('expo')">
      <span class="gauge-icon">👁</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar expo" id="bar-expo" style="width:0%"></div>
      </div>
      <span class="gauge-value" id="val-expo">0%</span>
    </div>
    <div class="gauge-item" onclick="showTooltip('energy')">
      <span class="gauge-icon">⚡</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar energy" id="bar-energy" style="width:100%"></div>
      </div>
      <span class="gauge-value" id="val-energy">15/15</span>
    </div>
  </div>

  <script>

    let gameState = {};
    let currentClients = [];
    let activeClientIndex = -1;

    // ===================================================
    // CATALOGUE
    // ===================================================

    const CATALOGUE = [

      { id:'home_alone',     titre:'Maman j\'ai raté l\'avion',   genre:'enfants',            ambiance:['fun','noel','enfant'],        prix:2 },
      { id:'little_mermaid', titre:'La Petite Sirène',            genre:'enfants',            ambiance:['famille','magie','chant'],    prix:2 },
      { id:'blow_out',       titre:'Blow Out (De Palma)',          genre:'rarites',            ambiance:['thriller','cinema','son'],   prix:5 },

    // ===================================================
    // INIT
    // ===================================================

    window.onload = function() {
      const save = localStorage.getItem('rewindParadise_save');
      if (!save) {
        window.location.href = 'index.html';
        return;
      }
      gameState = JSON.parse(save);

      if (!gameState.stock.comedie_romantique) {
        gameState.stock.comedie_romantique = 5;
      }

      gameState.ghost_loue_aujourd_hui = false;
      window.gameStateRef = gameState;
      updateUI();
      updateDayInfo();
      setTimeout(startDay, 600);
    };

    // ===================================================
    // JOURNÉE
    // ===================================================

    function startDay() {
      generateClients();
      updateFredThought('matin');
      checkDailyEvent();

      if (typeof CANOPI !== 'undefined') {
        const question = CANOPI.getQuestion(gameState);
        if (question) {
          setTimeout(() => {
            CANOPI.showInterrogatoire(question, () => {
              updateUI();
              saveGame();
            });
          }, 3000);
        }
      }

      // Néons d'ambiance
      if (typeof SOUNDS !== 'undefined') {
        setTimeout(() => SOUNDS.neons(4), 1000);
      }
    }

    function generateClients() {
      currentClients = [];

      // Canopi toujours présent
      currentClients.push({ ...CLIENT_TYPES.find(c => c.id === 'canopi'), timer: 5 });

      // Ramon selon semaine
      const ramonChance =
        gameState.semaine >= 4 ? 1.0 :
        gameState.semaine >= 2 ? 0.6 : 0.2;
      if (Math.random() < ramonChance) {
        currentClients.push({ ...CLIENT_TYPES.find(c => c.id === 'ramon'), timer: 4 });
      }

      // Miguel dès S2
      if (gameState.semaine >= 2 && Math.random() > 0.5) {
        currentClients.push({ ...CLIENT_TYPES.find(c => c.id === 'miguel'), timer: 3 });
      }

      // Concurrent dès S2 (30%)
      if (gameState.semaine >= 2 && Math.random() > 0.7) {
        currentClients.push({ ...CLIENT_TYPES.find(c => c.id === 'concurrent'), timer: 3 });
      }

      // Journaliste dès S3 (25%)
      if (gameState.semaine >= 3 && Math.random() > 0.75) {
        currentClients.push({ ...CLIENT_TYPES.find(c => c.id === 'journaliste'), timer: 4 });
      }

      // Collectionneur dès S3 (20%)
      if (gameState.semaine >= 3 && Math.random() > 0.8) {
        currentClients.push({ ...CLIENT_TYPES.find(c => c.id === 'collectionneur'), timer: 4 });
      }

      // Clients aléatoires
      const autres = CLIENT_TYPES.filter(
        c => !['canopi','ramon','miguel','concurrent','journaliste','collectionneur']
              .includes(c.id)
      );
      const nb = gameState.semaine >= 3 ? 4 : 3;
      for (let i = 0; i < nb; i++) {
        const r = Math.floor(Math.random() * autres.length);
        currentClients.push({ ...autres[r], timer: Math.floor(Math.random() * 2) + 3 });
      }

      renderQueue();
    }

    function renderQueue() {
      const queue = document.getElementById('client-queue');
      if (currentClients.length === 0) {
        queue.innerHTML = `<div class="no-clients">░ PLUS DE CLIENTS ░</div>`;
        return;
      }

      queue.innerHTML = currentClients.map((client, i) => `
        <div class="client-card
             ${client.isRamon ? 'ramon-card' : ''}
             ${i === activeClientIndex ? 'active-client' : ''}"
             onclick="selectClient(${i})">
          <span class="client-mood">${client.mood}</span>
          <div class="client-info">
            <div class="client-name ${client.isRamon ? 'ramon' : ''}">
              ${client.name}
            </div>
            <div class="client-demand">
              ${client.demande.substring(0,42)}${client.demande.length > 42 ? '...' : ''}
            </div>
          </div>
          <div class="client-timer">
            ${Array(client.timer).fill(0).map(() =>
              `<div class="timer-dot"></div>`
            ).join('')}
          </div>
        </div>
      `).join('');
    }

    // ===================================================
    // SÉLECTIONNER UN CLIENT
    // ===================================================

    function selectClient(index) {
      activeClientIndex = index;
      const client  = currentClients[index];
      const visites = gameState['client_' + client.id + '_count'] || 0;

      // Pensée de Fred
      document.getElementById('fred-thought').textContent =
        `"${client.thought}"`;

      // Panneau
      const panel   = document.getElementById('client-panel');
      const nameEl  = document.getElementById('panel-name');
      nameEl.textContent = client.name;
      nameEl.className   = 'panel-client-name' + (client.isRamon ? ' ramon' : '');

      // Demande Ramon selon visite
      let demande = client.demande;
      if (client.isRamon && client.dialogues) {
        const visitKey = 'visite' + Math.min(visites + 1, 5);
        demande = client.dialogues[visitKey] || client.demande;
      }
      document.getElementById('panel-demand').textContent = demande;

      // Note ambiance Ramon
      const ramonNote = document.getElementById('panel-ramon-note');
      if (client.isRamon && client.notes_ambiance) {
        const visitKey = 'visite' + Math.min(visites + 1, 5);
        const note = client.notes_ambiance[visitKey];
        if (note) { ramonNote.textContent = note; ramonNote.style.display = 'block'; }
        else ramonNote.style.display = 'none';
      } else {
        ramonNote.style.display = 'none';
      }

      // Badge nouveaux clients
      const badgeZone = document.getElementById('panel-badge');
      if (client.isConcurrent) {
        badgeZone.innerHTML = `<span class="panel-client-badge badge-concurrent">GALAXY VIDEO</span>`;
      } else if (client.isJournaliste) {
        badgeZone.innerHTML = `<span class="panel-client-badge badge-journaliste">PRESSE</span>`;
      } else if (client.isCollectionneur) {
        badgeZone.innerHTML = `<span class="panel-client-badge badge-collectionneur">COLLECTIONNEUR</span>`;
      } else {
        badgeZone.innerHTML = '';
      }

      // Action spéciale
      const actionZone = document.getElementById('action-speciale-zone');
      if (client.actionSpeciale) {
        actionZone.innerHTML = `
          <div class="action-speciale"
               onclick="doActionSpeciale()">
            <div class="action-speciale-titre">
              ${client.actionSpeciale.titre}
            </div>
            <div class="action-speciale-detail">
              ${client.actionSpeciale.detail}
            </div>
          </div>
        `;
      } else {
        actionZone.innerHTML = '';
      }

      // Bordure panneau
      panel.className = 'client-panel visible' +
        (client.isRamon ? ' ramon-panel' : '');

      // Tension Ramon
      const tension = document.getElementById('tension-overlay');
      if (client.isRamon && gameState.semaine >= 3) {
        tension.classList.add('visible');
      } else {
        tension.classList.remove('visible');
      }

      renderPrefs(client, visites);
      renderFilmsList(client);
      renderAlts(client);
      renderQueue();
    }

    function doActionSpeciale() {
      if (activeClientIndex < 0) return;
      const client = currentClients[activeClientIndex];
      if (!client.actionSpeciale) return;

      const resultat = client.actionSpeciale.effet(gameState);
      const key = 'client_' + client.id + '_count';
      gameState[key] = (gameState[key] || 0) + 1;

      currentClients.splice(activeClientIndex, 1);
      activeClientIndex = -1;

      document.getElementById('tension-overlay').classList.remove('visible');
      closePanel();
      showNotif(resultat.msg, resultat.positif);
      updateUI();
      saveGame();
      renderQueue();
    }

    function renderPrefs(client, visites) {
      const prefs = document.getElementById('client-prefs');
      if (visites === 0) {
        prefs.innerHTML = `<div class="prefs-label">PREMIÈRE VISITE — Apprenez ses goûts.</div>`;
        return;
      }
      const tags = [];
      client.aime.slice(0,3).forEach(id => {
        const film = CATALOGUE.find(f => f.id === id);
        if (film) tags.push(`<span class="pref-tag aime">♥ ${film.titre}</span>`);
      });
      client.deteste.slice(0,2).forEach(id => {
        const film = CATALOGUE.find(f => f.id === id);
        if (film) tags.push(`<span class="pref-tag deteste">✗ ${film.titre}</span>`);
      });
      prefs.innerHTML = `
        <div class="prefs-label">SES GOÛTS (${visites} visite${visites > 1 ? 's' : ''}) :</div>
        ${tags.join('')}
      `;
    }

    function renderFilmsList(client) {
      const list  = document.getElementById('films-list');
      const stock = gameState.stock;

      const dispo = CATALOGUE.filter(film => {
        if (film.id === 'ghost' && gameState.ghost_loue_aujourd_hui) return false;
        if (film.genre === 'noires')             return (stock.noires || 0) > 0;
        if (film.genre === 'rarites')            return (stock.rarites || 0) > 0;
        if (film.genre === 'comedie_romantique') return (stock.comedie_romantique || 0) > 0;
        return (stock[film.genre] || 0) > 0;
      });

      const tris = dispo.sort((a, b) =>
        getFilmScore(client, b) - getFilmScore(client, a)
      );

      const affiches = tris.slice(0, 8);

      if (affiches.length === 0) {
        list.innerHTML = `<div class="no-clients">Stock épuisé.</div>`;
        return;
      }

      list.innerHTML = affiches.map(film => {
        let classe = 'correct';
        let match  = '~';
        let prix   = film.prix;

        if (client.aime.includes(film.id)) {
          classe = client.isRamon ? 'meilleur-ramon' : 'meilleur';
          match  = client.isRamon ? '♥' : '★';
          prix++;
        } else if (client.deteste.includes(film.id)) {
          classe = 'mauvais';
          match  = '✗';
        }

        return `
          <div class="film-option ${classe}"
               onclick="servirFilm('${film.id}')">
            <div class="film-info">
              <div class="film-titre">${film.titre}</div>
              <div class="film-detail">
                ${film.genre.toUpperCase().replace('_',' ')}
                · ${film.ambiance.slice(0,2).join(', ')}
              </div>
            </div>
            <span class="film-match">${match}</span>
            <span class="film-prix">+${prix}$</span>
          </div>
        `;
      }).join('');
    }

    function getFilmScore(client, film) {
      if (client.aime.includes(film.id))       return 3;
      if (client.deteste.includes(film.id))    return -1;
      if (client.accepte.includes(film.genre)) return 2;
      return 0;
    }

    function renderAlts(client) {
      document.getElementById('panel-alts').innerHTML = `
        <div class="panel-alt" onclick="servirAleatoire()">🎲 AU HASARD</div>
        <div class="panel-alt danger" onclick="renvoyerClient()">✕ RENVOYER</div>
      `;
    }

    // ===================================================
    // SERVIR UN FILM
    // ===================================================

    function servirFilm(filmId) {
      if (activeClientIndex < 0) return;

      const client = currentClients[activeClientIndex];
      const film   = CATALOGUE.find(f => f.id === filmId);
      if (!film) return;

      if (film.id === 'ghost' && gameState.ghost_loue_aujourd_hui) {
        showNotif('Ghost est déjà sorti aujourd\'hui.', false);
        return;
      }

      gameState.energie = Math.max(0, gameState.energie - client.energie);

      const resultat = client.onServi(gameState, film);

      // Son caisse si positif
      if (resultat.positif && typeof SOUNDS !== 'undefined') {
        SOUNDS.caisse();
      }

      const key = 'client_' + client.id + '_count';
      gameState[key] = (gameState[key] || 0) + 1;

      document.getElementById('tension-overlay').classList.remove('visible');
      currentClients.splice(activeClientIndex, 1);
      activeClientIndex = -1;

      closePanel();
      showNotif(resultat.msg, resultat.positif);
      updateUI();
      renderQueue();
      saveGame();

      if (gameState.energie <= 0) updateFredThought('tired');
    }

    function servirAleatoire() {
      const stock = gameState.stock;
      const dispo = CATALOGUE.filter(f => {
        if (f.id === 'ghost' && gameState.ghost_loue_aujourd_hui) return false;
        if (f.genre === 'noires')             return (stock.noires || 0) > 0;
        if (f.genre === 'rarites')            return (stock.rarites || 0) > 0;
        if (f.genre === 'comedie_romantique') return (stock.comedie_romantique || 0) > 0;
        return (stock[f.genre] || 0) > 0;
      });
      if (dispo.length === 0) { showNotif('Plus rien en stock.', false); return; }
      servirFilm(dispo[Math.floor(Math.random() * dispo.length)].id);
    }

    function renvoyerClient() {
      if (activeClientIndex < 0) return;
      gameState.reputation = Math.max(0, gameState.reputation - 0.3);
      document.getElementById('tension-overlay').classList.remove('visible');
      currentClients.splice(activeClientIndex, 1);
      activeClientIndex = -1;
      closePanel();
      showNotif('Client renvoyé. Réputation -', false);
      updateUI();
      renderQueue();
      saveGame();
    }

    function closePanel() {
      document.getElementById('client-panel').className = 'client-panel';
      document.getElementById('tension-overlay').classList.remove('visible');
      activeClientIndex = -1;
      renderQueue();
    }

    // ===================================================
    // FERMER LE RIDEAU
    // ===================================================

    function closingTime() {
      // Son rideau de fer
      if (typeof SOUNDS !== 'undefined') SOUNDS.rideauFer();

      if (currentClients.length > 0) {
        const lost = currentClients.length;
        gameState.reputation = Math.max(0, gameState.reputation - lost * 0.2);
        currentClients = [];
        showNotif(`${lost} client(s) reparti(s). Réputation -`, false);
      }

      updateFredThought('fermeture');
      gameState.ghost_loue_aujourd_hui = false;
      saveGame();

      setTimeout(() => {
        document.body.classList.add('fade-out');
        setTimeout(() => { window.location.href = 'evening.html'; }, 500);
      }, 600);
    }

    // ===================================================
    // ÉVÉNEMENTS
    // ===================================================

    function checkDailyEvent() {
      if (typeof EVENTS === 'undefined') return;
      const jourDansSemaine = ((gameState.jour - 1) % 7) + 1;
      const narratif = EVENTS.getNarratif(gameState.semaine, jourDansSemaine);
      if (narratif) { setTimeout(() => showEvent(narratif), 1500); return; }
      if (Math.random() > 0.5) {
        const evt = EVENTS.getEvent(gameState);
        if (evt) setTimeout(() => showEvent(evt), 2000);
      }
    }

    function showEvent(event) {
      if (!event) return;
      const panel = document.createElement('div');
      panel.id = 'event-panel';
      panel.style.cssText = `
        position:fixed;top:0;left:0;right:0;bottom:0;
        background:rgba(0,0,0,0.92);z-index:300;
        display:flex;align-items:center;justify-content:center;
        padding:16px;font-family:'Courier New',monospace;
      `;
      panel.innerHTML = `
        <div style="background:#080818;border:1px solid #2e2e50;
             border-top:2px solid #ff8855;border-radius:8px;
             padding:16px;width:100%;max-width:400px;">
          <div style="font-size:9px;color:#ff8855;letter-spacing:3px;margin-bottom:4px;">
            ÉVÉNEMENT ${event.icon}
          </div>
          <div style="font-size:13px;color:#f0f0ff;letter-spacing:1px;margin-bottom:10px;">
            ${event.titre}
          </div>
          <div style="font-size:10px;color:#9090bb;line-height:1.6;
               margin-bottom:14px;font-style:italic;">
            ${event.texte}
          </div>
          <div style="display:flex;flex-direction:column;gap:6px;">
            ${event.choix.map((choix, i) => `
              <div onclick="resolveEvent(${i})"
                   style="background:#0f0f22;border:1px solid #2e2e50;
                          border-radius:4px;padding:10px 12px;cursor:pointer;">
                <div style="font-size:10px;color:#f0f0ff;letter-spacing:1px;margin-bottom:2px;">
                  ▶ ${choix.texte}
                </div>
                <div style="font-size:8px;color:#444466;letter-spacing:1px;">
                  ${choix.detail}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      document.body.appendChild(panel);
      window.currentEvent = event;
    }

    function resolveEvent(i) {
      const event = window.currentEvent;
      if (!event) return;
      const resultat = event.choix[i].effet(gameState);
      const panel = document.getElementById('event-panel');
      if (panel) panel.remove();
      showNotif(resultat.msg, resultat.positif);
      updateUI();
      saveGame();
      window.currentEvent = null;
    }

    // ===================================================
    // JOURNAL
    // ===================================================

    function openJournal() {
      if (typeof CANOPI === 'undefined') {
        showNotif('Journal — chargement...', true);
        return;
      }
      const gs      = gameState;
      const entrees = CANOPI.getCarnet(gs.semaine, gs.jour) || [];
      const score   = CANOPI.interrogatoire.evaluerCoherence(gs.choicesHistory);

      const panel = document.createElement('div');
      panel.id = 'journal-panel';
      panel.style.cssText = `
        position:fixed;top:0;left:0;right:0;bottom:0;
        background:#050510;z-index:300;
        font-family:'Courier New',monospace;overflow-y:auto;
      `;

      panel.innerHTML = `
        <div style="background:#080818;border-bottom:1px solid #1e1e3a;
             padding:12px 14px;display:flex;justify-content:space-between;
             align-items:center;position:sticky;top:0;z-index:10;">
          <span style="font-size:11px;color:#00ffc8;letter-spacing:2px;">
            JOURNAL & CARNET
          </span>
          <span onclick="document.getElementById('journal-panel').remove()"
                style="font-size:10px;color:#444466;cursor:pointer;padding:4px 8px;">✕</span>
        </div>
        <div style="padding:14px;display:flex;flex-direction:column;gap:16px;">

          <div>
            <div style="font-size:8px;color:#ff8855;letter-spacing:2px;margin-bottom:8px;">
              LE PROJECTEUR DU QUARTIER — S${gs.semaine}J${gs.jour}
            </div>
            <div style="font-size:10px;color:#7777aa;font-style:italic;
                 line-height:1.6;border-left:1px solid #1e1e3a;padding-left:10px;">
              ${gs.legalite >= 30
                ? '"Des courts-métrages non identifiés continuent de circuler. La police enquête."'
                : '"Faits divers habituels. Rien de notable cette semaine."'
              }
            </div>
          </div>

          ${gs.semaine >= 2 ? `
          <div>
            <div style="font-size:8px;color:#8855aa;letter-spacing:2px;margin-bottom:6px;">
              NOTE — RAMON
            </div>
            <div style="font-size:10px;color:#6644aa;font-style:italic;
                 line-height:1.6;border-left:1px solid #3a1a3a;padding-left:10px;">
              ${getRamonNote(gs)}
            </div>
          </div>
          ` : ''}

          ${gs.accord_concurrent ? `
          <div>
            <div style="font-size:8px;color:#aa8800;letter-spacing:2px;margin-bottom:6px;">
              ACCORD GALAXY VIDEO
            </div>
            <div style="font-size:10px;color:#887700;font-style:italic;
                 line-height:1.6;border-left:1px solid #443300;padding-left:10px;">
              Accord passé avec le concurrent. Partage d'infos clients.
            </div>
          </div>
          ` : ''}

          <div>
            <div style="font-size:8px;color:#444466;letter-spacing:2px;margin-bottom:8px;">
              CARNET DE CANOPI
            </div>
            ${entrees.length > 0
              ? entrees.map(e => `
                  <div style="padding:8px 0;border-bottom:1px solid #0a0a18;">
                    <div style="font-size:8px;color:#333355;letter-spacing:1px;margin-bottom:3px;">
                      Jour ${e.jour}
                    </div>
                    <div style="font-size:10px;color:#6060aa;font-style:italic;line-height:1.5;">
                      ${e.texte}
                    </div>
                  </div>
                `).join('')
              : '<div style="font-size:9px;color:#222244;">Aucune entrée.</div>'
            }
          </div>

          <div style="background:#080818;border:1px solid #1e1e3a;
               border-radius:6px;padding:10px 12px;">
            <div style="font-size:8px;color:#333355;letter-spacing:2px;margin-bottom:6px;">
              COHÉRENCE — CANOPI
            </div>
            <div style="font-size:11px;letter-spacing:1px;color:${
              score >= 80 ? '#00ffc8' : score >= 50 ? '#ff8855' : '#ff4466'
            };">
              ${score}% — ${
                score >= 80 ? 'Canopi a peu de preuves.'
                : score >= 50 ? 'Canopi a des doutes.'
                : 'Canopi a des preuves.'
              }
            </div>
          </div>

        </div>
      `;

      document.body.appendChild(panel);
    }

    function getRamonNote(gs) {
      const v = gs['client_ramon_count'] || 0;
      if (v === 0) return 'Un homme en costume. Comédies romantiques. Première observation.';
      if (v === 1) return 'Il revient. Il regarde les étagères longuement.';
      if (v === 2) return 'Il a mentionné DiMaggio. Comme si c\'était anodin.';
      if (v === 3) return 'Ses yeux s\'arrêtent sur la porte de la réserve.';
      return 'Il vient plus pour les films.';
    }

    // ===================================================
    // STOCK
    // ===================================================

    function openStock() {
      const gs = gameState;
      const genres = [
        { id:'action',             label:'ACTION',          max:10, prix:12 },
        { id:'horreur',            label:'HORREUR',         max:10, prix:8  },
        { id:'drame',              label:'DRAME',           max:10, prix:6  },
        { id:'enfants',            label:'ENFANTS',         max:10, prix:5  },
        { id:'comedie_romantique', label:'COM. ROMANTIQUE', max:8,  prix:7  },
        { id:'rarites',            label:'RARETÉS',         max:3,  prix:25 }
      ];

      const stockHTML = genres.map(g => {
        const val   = gs.stock[g.id] || 0;
        const pct   = (val / g.max) * 100;
        const color = val === 0 ? '#ff4466' : val <= g.max * 0.3 ? '#ff8855' : '#00ffc8';
        return `
          <div style="background:#0a0a18;border:1px solid #1e1e3a;border-radius:6px;
               padding:10px 12px;display:flex;align-items:center;gap:10px;">
            <div style="flex:1;">
              <div style="font-size:10px;color:#9090bb;letter-spacing:1px;margin-bottom:5px;">
                ${g.label}
              </div>
              <div style="width:100%;height:4px;background:#050510;border-radius:2px;overflow:hidden;">
                <div style="width:${pct}%;height:100%;background:${color};border-radius:2px;"></div>
              </div>
            </div>
            <div style="font-size:13px;color:${color};font-weight:bold;width:24px;text-align:right;">
              ${val}
            </div>
            <div onclick="commanderStock('${g.id}', ${g.prix})"
                 style="background:#0f0f1e;border:1px solid #2e2e50;border-radius:4px;
                        padding:5px 8px;font-size:8px;color:#00ffc8;
                        letter-spacing:1px;cursor:pointer;">
              +${g.prix}$
            </div>
          </div>
        `;
      }).join('');

      const panel = document.createElement('div');
      panel.id = 'stock-panel';
      panel.style.cssText = `
        position:fixed;top:0;left:0;right:0;bottom:0;
        background:#050510;z-index:300;
        font-family:'Courier New',monospace;overflow-y:auto;
      `;
      panel.innerHTML = `
        <div style="background:#080818;border-bottom:1px solid #1e1e3a;
             padding:12px 14px;display:flex;justify-content:space-between;
             align-items:center;position:sticky;top:0;z-index:10;">
          <span style="font-size:11px;color:#00ffc8;letter-spacing:2px;">GESTION DU STOCK</span>
          <span onclick="document.getElementById('stock-panel').remove()"
                style="font-size:10px;color:#444466;cursor:pointer;padding:4px 8px;">✕</span>
        </div>
        <div style="padding:14px;display:flex;flex-direction:column;gap:8px;">
          <div style="font-size:10px;color:#7777aa;letter-spacing:1px;margin-bottom:4px;">
            Budget : <span style="color:#00ffc8;font-weight:bold;">${gs.argent}$</span>
          </div>
          ${stockHTML}
          <div style="font-size:8px;color:#333355;letter-spacing:1px;
               text-align:center;margin-top:8px;">
            Livraison le lendemain matin.
          </div>
        </div>
      `;
      document.body.appendChild(panel);
    }

    function commanderStock(genre, prix) {
      if (gameState.argent < prix) { showNotif('Pas assez d\'argent.', false); return; }
      gameState.argent -= prix;
      const maxes  = { action:10, horreur:10, drame:10, enfants:10, comedie_romantique:8, rarites:3 };
      const ajouts = { action:2,  horreur:2,  drame:2,  enfants:2,  comedie_romantique:2, rarites:1 };
      gameState.stock[genre] = Math.min(
        maxes[genre] || 10,
        (gameState.stock[genre] || 0) + (ajouts[genre] || 2)
      );
      updateUI();
      saveGame();
      showNotif(`Commande passée. -${prix}$`, true);
      const panel = document.getElementById('stock-panel');
      if (panel) panel.remove();
      openStock();
    }

    // ===================================================
    // PENSÉES DE FRED
    // ===================================================

    function updateFredThought(context) {
      if (typeof DIALOGUES === 'undefined') return;
      let pool = [];
      const gs = gameState;
      if (context === 'matin') {
        if      (gs.semaine === 4) pool = DIALOGUES.fred.semaine4;
        else if (gs.semaine === 3) pool = DIALOGUES.fred.semaine3;
        else if (gs.semaine === 2) pool = DIALOGUES.fred.semaine2;
        else                       pool = DIALOGUES.fred.matin;
        if (gs.legalite  >= 60) pool = [...pool, ...DIALOGUES.fred.legalite_haute];
        if (gs.exposition >= 50) pool = [...pool, ...DIALOGUES.fred.exposition_haute];
        if (gs.argent < 100)     pool = [...pool, ...DIALOGUES.fred.argent_serre];
      } else if (context === 'tired') {
        pool = ["Je suis à plat. Faut fermer.", "Plus d'énergie. La réserve attend."];
      } else if (context === 'fermeture') {
        pool = DIALOGUES.fred.fermeture;
      }
      if (pool && pool.length > 0) {
        const t = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('fred-thought').textContent = `"${t}"`;
      }
    }

    // ===================================================
    // UI
    // ===================================================

    function updateUI() {
      const gs = gameState;
      document.getElementById('bar-money').style.width =
        Math.min(100, (gs.argent / 500) * 100) + '%';
      document.getElementById('val-money').textContent = gs.argent + '$';
      document.getElementById('bar-legal').style.width = gs.legalite + '%';
      document.getElementById('val-legal').textContent = gs.legalite + '%';
      document.getElementById('bar-expo').style.width  = gs.exposition + '%';
      document.getElementById('val-expo').textContent  = gs.exposition + '%';
      const ePct = (gs.energie / (gs.energieMax || 15)) * 100;
      document.getElementById('bar-energy').style.width = ePct + '%';
      document.getElementById('val-energy').textContent =
        gs.energie + '/' + (gs.energieMax || 15);

      ['action','horreur','drame','enfants','rarites'].forEach(g => {
        const el = document.getElementById('stock-' + g);
        if (!el) return;
        const max = g === 'rarites' ? 3 : 10;
        const val = gs.stock[g] || 0;
        el.textContent = val;
        el.className   = 'shelf-count';
        if (val === 0)             el.classList.add('empty');
        else if (val <= max * 0.3) el.classList.add('low');
      });
    }

    function updateDayInfo() {
      document.getElementById('day-info').textContent =
        `Jour ${gameState.jour} — S${gameState.semaine}`;
    }

    function showTooltip(type) {
      const gs = gameState;
      const messages = {
        money:        `Caisse : ${gs.argent}$ — Collecte Jackson mercredi`,
        legal:        `Légalité : ${gs.legalite}% — L'œil de Canopi`,
        expo:         `Exposition : ${gs.exposition}% — Le radar de DiMaggio`,
        energy:       `Énergie : ${gs.energie}/${gs.energieMax || 15}`,
        stock_action: `Action : ${gs.stock.action || 0}/10`,
        stock_horreur:`Horreur : ${gs.stock.horreur || 0}/10`,
        stock_drame:  `Drame : ${gs.stock.drame || 0}/10`,
        stock_enfants:`Enfants : ${gs.stock.enfants || 0}/10`,
        stock_rarites:`Raretés : ${gs.stock.rarites || 0}/3`
      };
      const tooltip = document.getElementById('gauge-tooltip');
      tooltip.textContent = messages[type] || '';
      tooltip.classList.add('visible');
      setTimeout(() => tooltip.classList.remove('visible'), 2000);
    }

    function showNotif(message, positive = true) {
      const notif = document.getElementById('notif');
      notif.textContent = message;
      notif.className = 'notif visible' + (positive ? '' : ' negative');
      setTimeout(() => { notif.className = 'notif'; }, 2500);
    }

    function saveGame() {
      // Vérifier les achievements
      if (typeof ACHIEVEMENTS !== 'undefined') {
        ACHIEVEMENTS.checkAndNotify(gameState);
      }
      window.gameStateRef = gameState;
      localStorage.setItem(
        'rewindParadise_save',
        JSON.stringify(gameState)
      );
    }

  </script>

</body>
</html>
