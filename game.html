<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 
        initial-scale=1.0, maximum-scale=1.0, 
        user-scalable=no">
  <title>Rewind Paradise — Le Vidéoclub</title>
  <link rel="stylesheet" href="data/theme.css">
  <script src="data/dialogues.js"></script>
  <script src="data/events.js"></script>
  <script src="data/canopi.js"></script>
  <style>

    body {
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .top-bar {
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .top-bar-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .shop-title {
      font-size: 11px;
      color: #00ffc8;
      letter-spacing: 2px;
      text-shadow: 0 0 8px #00ffc8;
    }

    .day-info {
      font-size: 10px;
      color: #8888aa;
      letter-spacing: 1px;
    }

    /* ===== ZONE PRINCIPALE ===== */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ===== ILLUSTRATION ===== */
    .shop-illustration {
      background: linear-gradient(180deg, #0d0d1f 0%, #111128 100%);
      padding: 10px 12px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
      border-bottom: 1px solid #2a2a4a;
    }

    /* ===== ÉTAGÈRES ===== */
    .shelves {
      width: 82px;
      background: #0f0f20;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 8px 6px;
      flex-shrink: 0;
    }

    .shelves-title {
      font-size: 8px;
      color: #ff8855;
      letter-spacing: 2px;
      margin-bottom: 6px;
      text-align: center;
    }

    .shelf-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 2px;
      border-bottom: 1px solid #1a1a2e;
      cursor: pointer;
    }

    .shelf-item:active { background: rgba(0,255,200,0.06); }

    .shelf-genre {
      font-size: 8px;
      color: #9999bb;
      letter-spacing: 1px;
    }

    .shelf-count        { font-size: 9px; color: #00ffc8; font-weight: bold; }
    .shelf-count.low    { color: #ff8855; }
    .shelf-count.empty  { color: #ff3355; }

    /* ===== COMPTOIR ===== */
    .counter-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .counter-top {
      background: #0f0f20;
      border: 1px solid #2a2a4a;
      border-radius: 6px;
      padding: 8px;
      flex: 1;
      overflow-y: auto;
    }

    .counter-label {
      font-size: 8px;
      color: #ff8855;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    /* ===== CLIENTS ===== */
    .client-queue {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .client-card {
      background: #141428;
      border: 1px solid #2a2a4a;
      border-radius: 5px;
      padding: 7px 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s;
    }

    .client-card:active       { background: #1e1e38; border-color: #00ffc8; }
    .client-card.active-client {
      border-color: #00ffc8;
      background: #0d1e22;
      box-shadow: 0 0 10px rgba(0,255,200,0.15);
    }

    /* Ramon — bordure spéciale */
    .client-card.ramon-card {
      border-color: #4a2a4a;
    }

    .client-card.ramon-card:active {
      border-color: #aa44aa;
    }

    .client-mood   { font-size: 15px; width: 22px; }
    .client-info   { flex: 1; margin-left: 6px; }
    .client-name   { font-size: 10px; color: #00ffc8; letter-spacing: 1px; }
    .client-demand { font-size: 9px;  color: #aaaacc; margin-top: 2px; line-height: 1.3; }

    /* Ramon name spécial */
    .client-name.ramon { color: #cc88cc; }

    .client-timer { display: flex; gap: 2px; }
    .timer-dot       { width: 5px; height: 5px; border-radius: 50%; background: #00ffc8; }
    .timer-dot.empty { background: #2a2a4a; }

    .no-clients {
      font-size: 9px;
      color: #555577;
      text-align: center;
      padding: 12px;
      letter-spacing: 1px;
    }

    /* ===== TV ===== */
    .tv-small {
      width: 58px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .tv-small-screen {
      width: 100%;
      aspect-ratio: 4/3;
      background: #050510;
      border: 2px solid #2a2a4a;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .tv-small-label {
      font-size: 7px;
      color: #444466;
      letter-spacing: 1px;
      text-align: center;
    }

    /* ===== PENSÉE DE FRED ===== */
    .fred-thought {
      background: #0c0c1c;
      border-left: 2px solid #ff6b35;
      padding: 7px 10px;
      margin: 0 12px;
      flex-shrink: 0;
    }

    .fred-thought-text {
      font-size: 10px;
      color: #aaaacc;
      font-style: italic;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }

    /* ===== BOUTON FERMER ===== */
    .close-btn {
      margin: 8px 12px;
      background: #1a0a0a;
      border: 1px solid #4a2020;
      border-radius: 6px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .close-btn:active  { background: #2a1010; }
    .close-btn-text    { font-size: 10px; color: #ff8855; letter-spacing: 3px; }

    /* ===== PANNEAU CLIENT ===== */
    .client-panel {
      display: none;
      position: fixed;
      bottom: 72px; left: 0; right: 0;
      background: #0f0f22;
      border-top: 2px solid #00ffc8;
      padding: 14px 12px 12px;
      z-index: 50;
      max-height: 72vh;
      overflow-y: auto;
    }

    .client-panel.visible { display: block; }

    /* Ramon panel — bordure violette */
    .client-panel.ramon-panel {
      border-top-color: #cc88cc;
    }

    .panel-client-name {
      font-size: 13px;
      color: #00ffc8;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .panel-client-name.ramon { color: #cc88cc; }

    .panel-client-demand {
      font-size: 11px;
      color: #ccccee;
      margin-bottom: 6px;
      line-height: 1.5;
      font-style: italic;
    }

    /* Note d'ambiance Ramon */
    .panel-ramon-note {
      background: #1a0a1a;
      border: 1px solid #4a2a4a;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 10px;
      font-size: 9px;
      color: #8855aa;
      font-style: italic;
      letter-spacing: 0.5px;
      line-height: 1.5;
      display: none;
    }

    /* PRÉFÉRENCES CLIENT */
    .client-prefs {
      background: #0a0a1a;
      border: 1px solid #1e1e3e;
      border-radius: 4px;
      padding: 6px 8px;
      margin-bottom: 10px;
    }

    .prefs-label {
      font-size: 8px;
      color: #666688;
      letter-spacing: 1px;
      margin-bottom: 4px;
    }

    .pref-tag {
      display: inline-block;
      font-size: 8px;
      padding: 2px 6px;
      border-radius: 2px;
      margin: 2px 2px 0 0;
      letter-spacing: 1px;
    }

    .pref-tag.aime    { background: #001a0a; color: #00aa55; border: 1px solid #00aa5530; }
    .pref-tag.deteste { background: #1a0005; color: #aa0033; border: 1px solid #aa003330; }

    /* LISTE DE FILMS */
    .films-label {
      font-size: 9px;
      color: #888899;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .films-list {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-bottom: 10px;
    }

    .film-option {
      background: #141428;
      border: 1px solid #2a2a4a;
      border-radius: 5px;
      padding: 9px 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.1s;
    }

    .film-option:active      { background: #1e1e38; }
    .film-option.meilleur    { border-color: #00ffc830; background: #0a1e14; }
    .film-option.meilleur-ramon { border-color: #cc88cc40; background: #1a0a1a; }
    .film-option.correct     { border-color: #ff883030; }
    .film-option.mauvais     { border-color: #ff003330; opacity: 0.7; }
    .film-option.rupture     { opacity: 0.4; pointer-events: none; }

    .film-info { flex: 1; }
    .film-titre  { font-size: 11px; color: #ddddee; letter-spacing: 0.5px; margin-bottom: 2px; }
    .film-detail { font-size: 8px;  color: #7777aa; letter-spacing: 1px; }
    .film-match  { font-size: 9px;  margin-left: 8px; flex-shrink: 0; }
    .film-prix   { font-size: 10px; color: #00ffc8; font-weight: bold; margin-left: 8px; flex-shrink: 0; }

    /* ACTIONS ALTERNATIVES */
    .panel-alts {
      display: flex;
      gap: 6px;
      margin-top: 4px;
    }

    .panel-alt {
      flex: 1;
      background: #0a0a1a;
      border: 1px solid #1e1e3e;
      border-radius: 4px;
      padding: 8px 6px;
      text-align: center;
      cursor: pointer;
      font-size: 9px;
      color: #888899;
      letter-spacing: 1px;
    }

    .panel-alt:active { background: #141428; }
    .panel-alt.danger { color: #ff5533; border-color: #ff553320; }

    .panel-close {
      text-align: center;
      font-size: 9px;
      color: #444466;
      cursor: pointer;
      letter-spacing: 2px;
      padding: 8px;
      margin-top: 4px;
    }

    /* ===== JAUGES ===== */
    .bottom-bar {
      background: #0a0a18;
      border-top: 1px solid #2a2a4a;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 1fr;
      gap: 6px;
      flex-shrink: 0;
    }

    .gauge-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .gauge-icon { font-size: 14px; }

    .gauge-bar-container {
      width: 100%; height: 5px;
      background: #1e1e3e;
      border-radius: 3px;
      overflow: hidden;
    }

    .gauge-bar { height: 100%; border-radius: 3px; transition: width 0.3s ease; }
    .gauge-bar.money  { background: #00ffc8; }
    .gauge-bar.legal  { background: #ff8855; }
    .gauge-bar.expo   { background: #ff3355; }
    .gauge-bar.energy { background: #ffcc00; }

    .gauge-value { font-size: 9px; color: #8888aa; letter-spacing: 1px; font-weight: bold; }

    /* ===== TOOLTIP ===== */
    .gauge-tooltip {
      display: none;
      position: fixed;
      bottom: 75px; left: 50%;
      transform: translateX(-50%);
      background: #0f0f22;
      border: 1px solid #00ffc8;
      border-radius: 6px;
      padding: 10px 16px;
      font-size: 11px;
      color: #f0f0ff;
      letter-spacing: 1px;
      text-align: center;
      z-index: 400;
      white-space: nowrap;
      max-width: 90vw;
    }

    .gauge-tooltip.visible { display: block; }

    /* ===== NOTIFICATIONS ===== */
    .notif {
      display: none;
      position: fixed;
      top: 58px; left: 50%;
      transform: translateX(-50%);
      background: #0d1e22;
      border: 2px solid #00ffc8;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 11px;
      color: #00ffc8;
      letter-spacing: 1px;
      z-index: 500;
      text-align: center;
      max-width: 85vw;
      font-weight: bold;
    }

    .notif.visible   { display: block; animation: notifAnim 2.5s forwards; }
    .notif.negative  { border-color: #ff3355; color: #ff3355; background: #1a0a10; }

    @keyframes notifAnim {
      0%   { opacity: 0; transform: translateX(-50%) translateY(-6px); }
      12%  { opacity: 1; transform: translateX(-50%) translateY(0); }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    /* ===== TENSION RAMON ===== */
    .tension-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #4a0a4a, #cc44cc, #4a0a4a);
      z-index: 600;
      animation: tensionPulse 1s infinite;
    }

    .tension-overlay.visible { display: block; }

    @keyframes tensionPulse {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 1; }
    }

    /* ===== FADE ===== */
    .fade-out { animation: fadeOut 0.5s forwards; }

    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

  </style>
</head>
<body>

  <!-- TENSION RAMON -->
  <div class="tension-overlay" id="tension-overlay"></div>

  <div class="top-bar">
    <div class="top-bar-left">
      <div class="btn-icon" onclick="openJournal()">📰</div>
      <div class="shop-title">REWIND PARADISE</div>
    </div>

  </div>

  <div class="main-area">

    <div class="shop-illustration">

      <div class="shelves">
        <div class="shelves-title">STOCK</div>

          <span class="shelf-count" id="stock-action">8</span>
        </div>
        <div class="shelf-item" onclick="showTooltip('stock_horreur')">
          <span class="shelf-genre">HORREUR</span>

        <div class="shelf-item" onclick="showTooltip('stock_drame')">
          <span class="shelf-genre">DRAME</span>

        </div>
        <div class="shelf-item" onclick="showTooltip('stock_enfants')">
          <span class="shelf-genre">ENFANTS</span>
          <span class="shelf-count" id="stock-enfants">6</span>
        </div>
        <div class="shelf-item" onclick="showTooltip('stock_rarites')">
          <span class="shelf-genre">RARETÉS</span>
          <span class="shelf-count" id="stock-rarites">1</span>
        </div>
      </div>

      <div class="counter-area">
        <div class="counter-top">
          <div class="counter-label">FILE D'ATTENTE</div>

          </div>

      <div class="tv-small">
        <div class="tv-small-screen">📺</div>

    <div class="fred-thought">
      <div class="fred-thought-text" id="fred-thought">
        "Un autre jour. Corey arrive quand il veut."
      </div>
    </div>

    <div class="close-btn" onclick="closingTime()">
      <div class="close-btn-text">▼ FERMER LE RIDEAU ▼</div>
    </div>

  </div>

  <!-- PANNEAU CLIENT -->
  <div class="client-panel" id="client-panel">
    <div class="panel-client-name" id="panel-name">—</div>
    <div class="panel-client-demand" id="panel-demand">—</div>
    <div class="panel-ramon-note" id="panel-ramon-note">—</div>
    <div class="client-prefs" id="client-prefs"></div>
    <div class="films-label">CHOISIR UN FILM :</div>
    <div class="films-list" id="films-list"></div>
    <div class="panel-alts" id="panel-alts"></div>
    <div class="panel-close" onclick="closePanel()">✕ FERMER</div>
  </div>

  <div class="gauge-tooltip" id="gauge-tooltip"></div>
  <div class="notif" id="notif"></div>

  <div class="bottom-bar">
    <div class="gauge-item" onclick="showTooltip('money')">
      <span class="gauge-icon">💰</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar money" id="bar-money" style="width:40%"></div>
      </div>
      <span class="gauge-value" id="val-money">200$</span>
    </div>
    <div class="gauge-item" onclick="showTooltip('legal')">
      <span class="gauge-icon">🎬</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar legal" id="bar-legal" style="width:0%"></div>
      </div>
      <span class="gauge-value" id="val-legal">0%</span>
    </div>
    <div class="gauge-item" onclick="showTooltip('expo')">
      <span class="gauge-icon">👁</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar expo" id="bar-expo" style="width:0%"></div>
      </div>
      <span class="gauge-value" id="val-expo">0%</span>
    </div>
    <div class="gauge-item" onclick="showTooltip('energy')">
      <span class="gauge-icon">⚡</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar energy" id="bar-energy" style="width:100%"></div>
      </div>
      <span class="gauge-value" id="val-energy">15/15</span>
    </div>
  </div>

  <script>

    // ===== ÉTAT =====
    let gameState = {};
    let currentClients = [];
    let activeClientIndex = -1;

    // ===================================================
    // CATALOGUE DE FILMS
    // ===================================================

    const CATALOGUE = [

    // ===================================================
    // PROFILS CLIENTS
    // ===================================================

    const CLIENT_TYPES = [

    // ===================================================
    // INIT
    // ===================================================

    window.onload = function() {
      const save = localStorage.getItem('rewindParadise_save');
      if (!save) {
        window.location.href = 'index.html';
        return;
      }
      gameState = JSON.parse(save);

      // Init stock comédie romantique si absent
      if (!gameState.stock.comedie_romantique) {
        gameState.stock.comedie_romantique = 5;
      }

      // Réinitialiser flags journée
      gameState.ghost_loue_aujourd_hui = false;

      window.gameStateRef = gameState;
      updateUI();
      updateDayInfo();
      setTimeout(startDay, 600);
    };

    // ===================================================
    // JOURNÉE
    // ===================================================

    function startDay() {
      generateClients();
      updateFredThought('matin');
      checkDailyEvent();

      if (typeof CANOPI !== 'undefined') {
        const question = CANOPI.getQuestion(gameState);
        if (question) {
          setTimeout(() => {
            CANOPI.showInterrogatoire(question, () => {
              updateUI();
              saveGame();
            });
          }, 3000);
        }
      }
    }

    function generateClients() {
      currentClients = [];

      // Canopi toujours présent
      currentClients.push({
        ...CLIENT_TYPES.find(c => c.id === 'canopi'),
        timer: 5
      });

      // Ramon — apparaît selon la semaine
      // S1 : rare (20%), S2+ : régulier (60%), S4+ : toujours
      const ramonChance =
        gameState.semaine >= 4 ? 1.0 :
        gameState.semaine >= 2 ? 0.6 : 0.2;

      if (Math.random() < ramonChance) {
        currentClients.push({
          ...CLIENT_TYPES.find(c => c.id === 'ramon'),
          timer: 4
        });
      }

      // Miguel dès semaine 2
      if (gameState.semaine >= 2 && Math.random() > 0.5) {
        currentClients.push({
          ...CLIENT_TYPES.find(c => c.id === 'miguel'),
          timer: 3
        });
      }

      // 3 clients aléatoires parmi les autres
      const autres = CLIENT_TYPES.filter(
        c => c.id !== 'canopi'
          && c.id !== 'ramon'
          && c.id !== 'miguel'
      );
      const nb = gameState.semaine >= 3 ? 4 : 3;
      for (let i = 0; i < nb; i++) {
        const r = Math.floor(Math.random() * autres.length);
        currentClients.push({
          ...autres[r],
          timer: Math.floor(Math.random() * 2) + 3
        });
      }

      renderQueue();
    }

    function renderQueue() {
      const queue = document.getElementById('client-queue');

      if (currentClients.length === 0) {
        queue.innerHTML =
          `<div class="no-clients">░ PLUS DE CLIENTS ░</div>`;
        return;
      }

      queue.innerHTML = currentClients.map((client, i) => `
        <div class="client-card
             ${client.isRamon ? 'ramon-card' : ''}
             ${i === activeClientIndex ? 'active-client' : ''}"
             onclick="selectClient(${i})">
          <span class="client-mood">${client.mood}</span>
          <div class="client-info">
            <div class="client-name
                 ${client.isRamon ? 'ramon' : ''}">
              ${client.name}
            </div>
            <div class="client-demand">
              ${client.demande.substring(0, 40)}${client.demande.length > 40 ? '...' : ''}
            </div>
          </div>
          <div class="client-timer">
            ${Array(client.timer).fill(0).map(() =>
              `<div class="timer-dot"></div>`
            ).join('')}
          </div>
        </div>
      `).join('');
    }

    // ===================================================
    // SÉLECTIONNER UN CLIENT
    // ===================================================

    function selectClient(index) {
      activeClientIndex = index;
      const client = currentClients[index];
      const visites = gameState['client_' + client.id + '_count'] || 0;

      // Pensée de Fred
      if (typeof DIALOGUES !== 'undefined' && !client.isRamon) {
        const pool = client.id === 'canopi'
          ? DIALOGUES.fred.canopi_arrive
          : DIALOGUES.fred.matin;
        const thought = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('fred-thought').textContent =
          `"${thought}"`;
      } else {
        document.getElementById('fred-thought').textContent =
          `"${client.thought}"`;
      }

      // Panneau
      const panel = document.getElementById('client-panel');
      const nameEl = document.getElementById('panel-name');

      nameEl.textContent = client.name;
      nameEl.className = 'panel-client-name' +
        (client.isRamon ? ' ramon' : '');

      // Demande selon visite pour Ramon
      let demande = client.demande;
      if (client.isRamon && client.dialogues) {
        const visitKey = 'visite' + Math.min(visites + 1, 5);
        demande = client.dialogues[visitKey] || client.demande;
      }
      document.getElementById('panel-demand').textContent = demande;

      // Note d'ambiance Ramon
      const ramonNote = document.getElementById('panel-ramon-note');
      if (client.isRamon && client.notes_ambiance) {
        const visitKey = 'visite' + Math.min(visites + 1, 5);
        const note = client.notes_ambiance[visitKey];
        if (note) {
          ramonNote.textContent = note;
          ramonNote.style.display = 'block';
        } else {
          ramonNote.style.display = 'none';
        }
      } else {
        ramonNote.style.display = 'none';
      }

      // Bordure spéciale Ramon
      panel.className = 'client-panel visible' +
        (client.isRamon ? ' ramon-panel' : '');

      // Tension overlay pour Ramon
      const tension = document.getElementById('tension-overlay');
      if (client.isRamon && gameState.semaine >= 3) {
        tension.classList.add('visible');
      } else {
        tension.classList.remove('visible');
      }

      // Préférences
      renderPrefs(client, visites);

      // Films
      renderFilmsList(client);

      // Alts
      renderAlts(client);

      renderQueue();
    }

    // ===== PRÉFÉRENCES =====
    function renderPrefs(client, visites) {
      const prefs = document.getElementById('client-prefs');

      if (visites === 0) {
        prefs.innerHTML = `
          <div class="prefs-label">
            PREMIÈRE VISITE — Apprenez ses goûts.
          </div>
        `;
        return;
      }

      const tags = [];
      client.aime.slice(0, 3).forEach(id => {
        const film = CATALOGUE.find(f => f.id === id);
        if (film) tags.push(
          `<span class="pref-tag aime">♥ ${film.titre}</span>`
        );
      });
      client.deteste.slice(0, 2).forEach(id => {
        const film = CATALOGUE.find(f => f.id === id);
        if (film) tags.push(
          `<span class="pref-tag deteste">✗ ${film.titre}</span>`
        );
      });

      prefs.innerHTML = `
        <div class="prefs-label">
          SES GOÛTS (${visites} visite${visites > 1 ? 's' : ''}) :
        </div>
        ${tags.join('')}
      `;
    }

    // ===== LISTE DE FILMS =====
    function renderFilmsList(client) {
      const list = document.getElementById('films-list');
      const stock = gameState.stock;

      // Films disponibles
      const dispo = CATALOGUE.filter(film => {
        // Ghost déjà loué aujourd'hui
        if (film.id === 'ghost' && gameState.ghost_loue_aujourd_hui) {
          return false;
        }
        // Vérifier stock
        if (film.genre === 'noires') return (stock.noires || 0) > 0;
        if (film.genre === 'rarites') return (stock.rarites || 0) > 0;
        if (film.genre === 'comedie_romantique') {
          return (stock.comedie_romantique || 0) > 0;
        }
        return (stock[film.genre] || 0) > 0;
      });

      // Trier selon les préférences du client
      const tris = dispo.sort((a, b) => {
        return getFilmScore(client, b) - getFilmScore(client, a);
      });

      // Limiter à 8
      const affiches = tris.slice(0, 8);

      if (affiches.length === 0) {
        list.innerHTML =
          `<div class="no-clients">Stock épuisé.</div>`;
        return;
      }

      list.innerHTML = affiches.map(film => {
        const score = getFilmScore(client, film);
        let classe = 'correct';
        let match  = '~';
        let prix   = film.prix;

        if (client.aime.includes(film.id)) {
          classe = client.isRamon ? 'meilleur-ramon' : 'meilleur';
          match  = client.isRamon ? '♥' : '★';
          prix   += 1;
        } else if (client.deteste.includes(film.id)) {
          classe = 'mauvais';
          match  = '✗';
        }

        return `
          <div class="film-option ${classe}"
               onclick="servirFilm('${film.id}')">
            <div class="film-info">
              <div class="film-titre">${film.titre}</div>
              <div class="film-detail">
                ${film.genre.toUpperCase().replace('_',' ')}
                · ${film.ambiance.slice(0,2).join(', ')}
              </div>
            </div>
            <span class="film-match">${match}</span>
            <span class="film-prix">+${prix}$</span>
          </div>
        `;
      }).join('');
    }

    function getFilmScore(client, film) {
      if (client.aime.includes(film.id))    return 3;
      if (client.deteste.includes(film.id)) return -1;
      if (client.accepte.includes(film.genre)) return 2;
      return 0;
    }

    // ===== ACTIONS ALTERNATIVES =====
    function renderAlts(client) {
      document.getElementById('panel-alts').innerHTML = `
        <div class="panel-alt" onclick="servirAleatoire()">
          🎲 AU HASARD
        </div>
        <div class="panel-alt danger" onclick="renvoyerClient()">
          ✕ RENVOYER
        </div>
      `;
    }

    // ===================================================
    // SERVIR UN FILM
    // ===================================================

    function servirFilm(filmId) {
      if (activeClientIndex < 0) return;

      const client = currentClients[activeClientIndex];
      const film   = CATALOGUE.find(f => f.id === filmId);
      if (!film) return;

      // Vérifier Ghost déjà loué
      if (film.id === 'ghost' && gameState.ghost_loue_aujourd_hui) {
        showNotif('Ghost est déjà sorti aujourd\'hui.', false);
        return;
      }

      // Énergie
      gameState.energie = Math.max(
        0, gameState.energie - client.energie
      );

      // Appliquer le service
      const resultat = client.onServi(gameState, film);

      // Compter les visites
      const key = 'client_' + client.id + '_count';
      gameState[key] = (gameState[key] || 0) + 1;

      // Fermer tension overlay
      document.getElementById('tension-overlay')
              .classList.remove('visible');

      // Retirer le client
      currentClients.splice(activeClientIndex, 1);
      activeClientIndex = -1;

      closePanel();
      showNotif(resultat.msg, resultat.positif);
      updateUI();
      renderQueue();
      saveGame();

      if (gameState.energie <= 0) {
        updateFredThought('tired');
      }
    }

    function servirAleatoire() {
      const stock = gameState.stock;
      const dispo = CATALOGUE.filter(f => {
        if (f.id === 'ghost' && gameState.ghost_loue_aujourd_hui)
          return false;
        if (f.genre === 'noires') return (stock.noires || 0) > 0;
        if (f.genre === 'rarites') return (stock.rarites || 0) > 0;
        if (f.genre === 'comedie_romantique')
          return (stock.comedie_romantique || 0) > 0;
        return (stock[f.genre] || 0) > 0;
      });
      if (dispo.length === 0) {
        showNotif('Plus rien en stock.', false);
        return;
      }
      const film = dispo[Math.floor(Math.random() * dispo.length)];
      servirFilm(film.id);
    }

    function renvoyerClient() {
      if (activeClientIndex < 0) return;
      gameState.reputation = Math.max(0, gameState.reputation - 0.3);
      document.getElementById('tension-overlay')
              .classList.remove('visible');
      currentClients.splice(activeClientIndex, 1);
      activeClientIndex = -1;
      closePanel();
      showNotif('Client renvoyé. Réputation -', false);
      updateUI();
      renderQueue();
      saveGame();
    }

    function closePanel() {
      document.getElementById('client-panel')
              .classList.remove('visible');
      document.getElementById('client-panel')
              .classList.remove('ramon-panel');
      document.getElementById('tension-overlay')
              .classList.remove('visible');
      activeClientIndex = -1;
      renderQueue();
    }

    // ===================================================
    // FERMER LE VIDÉOCLUB
    // ===================================================

    function closingTime() {
      if (currentClients.length > 0) {
        const lost = currentClients.length;
        gameState.reputation = Math.max(
          0, gameState.reputation - lost * 0.2
        );
        currentClients = [];
        showNotif(
          `${lost} client(s) reparti(s). Réputation -`,
          false
        );
      }

      updateFredThought('fermeture');

      // Réinitialiser flags journée avant de partir
      gameState.ghost_loue_aujourd_hui = false;
      saveGame();

      setTimeout(() => {
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = 'evening.html';
        }, 500);
      }, 800);
    }

    // ===================================================
    // ÉVÉNEMENTS
    // ===================================================

    function checkDailyEvent() {
      if (typeof EVENTS === 'undefined') return;

      const jourDansSemaine = ((gameState.jour - 1) % 7) + 1;
      const narratif = EVENTS.getNarratif(
        gameState.semaine, jourDansSemaine
      );

      if (narratif) {
        setTimeout(() => showEvent(narratif), 1500);
        return;
      }

      if (Math.random() > 0.5) {
        const evt = EVENTS.getEvent(gameState);
        if (evt) setTimeout(() => showEvent(evt), 2000);
      }
    }

    function showEvent(event) {
      if (!event) return;

      const panel = document.createElement('div');
      panel.id = 'event-panel';
      panel.style.cssText = `
        position:fixed;top:0;left:0;right:0;bottom:0;
        background:rgba(0,0,0,0.88);z-index:300;
        display:flex;align-items:center;
        justify-content:center;padding:16px;
        font-family:'Courier New',monospace;
      `;

      panel.innerHTML = `
        <div style="
          background:#0f0f22;
          border:1px solid #2a2a4a;
          border-top:2px solid #ff8855;
          border-radius:8px;
          padding:16px;width:100%;max-width:400px;">

          <div style="font-size:9px;color:#ff8855;
               letter-spacing:3px;margin-bottom:4px;">
            ÉVÉNEMENT ${event.icon}
          </div>
          <div style="font-size:13px;color:#f0f0ff;
               letter-spacing:1px;margin-bottom:10px;">
            ${event.titre}
          </div>
          <div style="font-size:10px;color:#aaaacc;
               line-height:1.6;margin-bottom:14px;
               font-style:italic;">
            ${event.texte}
          </div>

          <div style="display:flex;flex-direction:column;gap:6px;">
            ${event.choix.map((choix, i) => `
              <div onclick="resolveEvent(${i})"
                   style="background:#141428;
                          border:1px solid #2a2a4a;
                          border-radius:4px;
                          padding:10px 12px;cursor:pointer;">
                <div style="font-size:10px;color:#f0f0ff;
                     letter-spacing:1px;margin-bottom:2px;">
                  ▶ ${choix.texte}
                </div>
                <div style="font-size:8px;color:#666688;
                     letter-spacing:1px;">
                  ${choix.detail}
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;

      document.body.appendChild(panel);
      window.currentEvent = event;
    }

    function resolveEvent(i) {
      const event = window.currentEvent;
      if (!event) return;

      const choix    = event.choix[i];
      const resultat = choix.effet(gameState);

      const panel = document.getElementById('event-panel');
      if (panel) panel.remove();

      showNotif(resultat.msg, resultat.positif);
      updateUI();
      saveGame();
      window.currentEvent = null;
    }

    // ===================================================
    // JOURNAL
    // ===================================================

    function openJournal() {
      if (typeof CANOPI === 'undefined') {
        showNotif('Journal — chargement...', true);
        return;
      }

      const gs      = gameState;
      const entrees = CANOPI.getCarnet(gs.semaine, gs.jour) || [];
      const score   = CANOPI.interrogatoire.evaluerCoherence(
        gs.choicesHistory
      );

      const entreesHTML = entrees.length > 0
        ? entrees.map(e => `
            <div style="padding:8px 0;border-bottom:1px solid #0d0d20;">
              <div style="font-size:8px;color:#444466;
                   letter-spacing:1px;margin-bottom:3px;">
                Jour ${e.jour} — Suspicion +${e.suspicion}
              </div>
              <div style="font-size:10px;color:#8888aa;
                   font-style:italic;line-height:1.5;">
                ${e.texte}
              </div>
            </div>
          `).join('')
        : '<div style="font-size:9px;color:#333355;letter-spacing:1px;">Aucune entrée cette semaine.</div>';

      const panel = document.createElement('div');
      panel.id = 'journal-panel';
      panel.style.cssText = `
        position:fixed;top:0;left:0;right:0;bottom:0;
        background:#080812;z-index:300;
        font-family:'Courier New',monospace;overflow-y:auto;
      `;

      panel.innerHTML = `
        <div style="
          background:#0d0d1e;border-bottom:1px solid #2a2a4a;
          padding:12px 14px;display:flex;
          justify-content:space-between;align-items:center;
          position:sticky;top:0;z-index:10;">
          <span style="font-size:11px;color:#00ffc8;letter-spacing:2px;">
            JOURNAL & CARNET
          </span>
          <span onclick="document.getElementById('journal-panel').remove()"
                style="font-size:10px;color:#666688;
                       cursor:pointer;padding:4px 8px;">✕</span>
        </div>

        <div style="padding:14px;display:flex;
             flex-direction:column;gap:16px;">

          <div>
            <div style="font-size:8px;color:#ff8855;
                 letter-spacing:2px;margin-bottom:8px;">
              LE PROJECTEUR DU QUARTIER — S${gs.semaine}J${gs.jour}
            </div>
            <div style="font-size:10px;color:#9999bb;
                 font-style:italic;line-height:1.6;
                 border-left:1px solid #2a2a4a;padding-left:10px;">
              ${gs.legalite >= 30
                ? '"Des courts-métrages non identifiés continuent de circuler. La police enquête."'
                : '"Faits divers habituels. Rien de notable cette semaine."'
              }
            </div>
          </div>

          ${gs.semaine >= 2 ? `
          <div>
            <div style="font-size:8px;color:#8855aa;
                 letter-spacing:2px;margin-bottom:8px;">
              NOTE — RAMON
            </div>
            <div style="font-size:10px;color:#7755aa;
                 font-style:italic;line-height:1.6;
                 border-left:1px solid #4a2a4a;padding-left:10px;">
              ${getRamonNote(gs)}
            </div>
          </div>
          ` : ''}

          <div>
            <div style="font-size:8px;color:#555577;
                 letter-spacing:2px;margin-bottom:8px;">
              CARNET DE CANOPI
            </div>
            ${entreesHTML}
          </div>

          <div style="background:#0a0a18;border:1px solid #1a1a3a;
               border-radius:6px;padding:10px 12px;">
            <div style="font-size:8px;color:#444466;
                 letter-spacing:2px;margin-bottom:6px;">
              VOS RÉPONSES — COHÉRENCE
            </div>
            <div style="font-size:11px;letter-spacing:1px;color:${
              score >= 80 ? '#00ffc8'
              : score >= 50 ? '#ff8855'
              : '#ff3355'
            };">
              ${score}% — ${
                score >= 80 ? 'Canopi a peu de preuves.'
                : score >= 50 ? 'Canopi a des doutes.'
                : 'Canopi a des preuves de contradiction.'
              }
            </div>
          </div>

        </div>
      `;

      document.body.appendChild(panel);
    }

    function getRamonNote(gs) {
      const visites = gs['client_ramon_count'] || 0;
      if (visites === 0) return 'Un homme en costume. Loue des comédies romantiques. Première et unique observation.';
      if (visites === 1) return 'Il revient. Pretty Woman encore. Il regarde les étagères longuement.';
      if (visites === 2) return 'Il a mentionné DiMaggio. Comme si c\'était anodin.';
      if (visites === 3) return 'Ses yeux s\'arrêtent sur la porte de la réserve. Il sait.';
      return 'Il vient plus pour les films.';
    }

    // ===================================================
    // STOCK
    // ===================================================

    function openStock() {
      const gs = gameState;

      const genres = [
        { id:'action',             label:'ACTION',             max:10, prix:12 },
        { id:'horreur',            label:'HORREUR',            max:10, prix:8  },
        { id:'drame',              label:'DRAME',              max:10, prix:6  },
        { id:'enfants',            label:'ENFANTS',            max:10, prix:5  },
        { id:'comedie_romantique', label:'COM. ROMANTIQUE',    max:8,  prix:7  },
        { id:'rarites',            label:'RARETÉS',            max:3,  prix:25 }
      ];

      const stockHTML = genres.map(g => {
        const val   = gs.stock[g.id] || 0;
        const pct   = (val / g.max) * 100;
        const color = val === 0 ? '#ff3355'
                    : val <= g.max * 0.3 ? '#ff8855'
                    : '#00ffc8';

        return `
          <div style="background:#0f0f20;border:1px solid #2a2a4a;
               border-radius:6px;padding:10px 12px;
               display:flex;align-items:center;gap:10px;">
            <div style="flex:1;">
              <div style="font-size:10px;color:#aaaacc;
                   letter-spacing:1px;margin-bottom:5px;">
                ${g.label}
              </div>
              <div style="width:100%;height:5px;
                   background:#0a0a18;border-radius:2px;overflow:hidden;">
                <div style="width:${pct}%;height:100%;
                     background:${color};border-radius:2px;"></div>
              </div>
            </div>
            <div style="font-size:13px;color:${color};
                 font-weight:bold;width:24px;text-align:right;">
              ${val}
            </div>
            <div onclick="commanderStock('${g.id}', ${g.prix})"
                 style="background:#141428;border:1px solid #2a2a4a;
                        border-radius:4px;padding:5px 8px;
                        font-size:8px;color:#00ffc8;
                        letter-spacing:1px;cursor:pointer;">
              +${g.prix}$
            </div>
          </div>
        `;
      }).join('');

      const panel = document.createElement('div');
      panel.id = 'stock-panel';
      panel.style.cssText = `
        position:fixed;top:0;left:0;right:0;bottom:0;
        background:#080812;z-index:300;
        font-family:'Courier New',monospace;overflow-y:auto;
      `;

      panel.innerHTML = `
        <div style="
          background:#0d0d1e;border-bottom:1px solid #2a2a4a;
          padding:12px 14px;display:flex;
          justify-content:space-between;align-items:center;
          position:sticky;top:0;z-index:10;">
          <span style="font-size:11px;color:#00ffc8;letter-spacing:2px;">
            GESTION DU STOCK
          </span>
          <span onclick="document.getElementById('stock-panel').remove()"
                style="font-size:10px;color:#666688;
                       cursor:pointer;padding:4px 8px;">✕</span>
        </div>

        <div style="padding:14px;display:flex;
             flex-direction:column;gap:8px;">
          <div style="font-size:10px;color:#9999bb;
               letter-spacing:1px;margin-bottom:4px;">
            Budget disponible :
            <span style="color:#00ffc8;font-weight:bold;">
              ${gs.argent}$
            </span>
          </div>
          ${stockHTML}
          <div style="font-size:8px;color:#444466;letter-spacing:1px;
               text-align:center;margin-top:8px;">
            Livraison le lendemain matin.
          </div>
        </div>
      `;

      document.body.appendChild(panel);
    }

    function commanderStock(genre, prix) {
      if (gameState.argent < prix) {
        showNotif('Pas assez d\'argent.', false);
        return;
      }
      gameState.argent -= prix;
      const maxes = {
        action:20, horreur:10, drame:10,
        enfants:10, comedie_romantique:8, rarites:3
      };
      const ajouts = {
        action:2, horreur:2, drame:2,
        enfants:2, comedie_romantique:2, rarites:1
      };
      const max  = maxes[genre]  || 10;
      const ajout = ajouts[genre] || 2;
      gameState.stock[genre] = Math.min(
        max,
        (gameState.stock[genre] || 0) + ajout
      );
      updateUI();
      saveGame();
      showNotif(`Commande passée. -${prix}$`, true);
      const panel = document.getElementById('stock-panel');
      if (panel) panel.remove();
      openStock();
    }

    // ===================================================
    // PENSÉES DE FRED
    // ===================================================

    function updateFredThought(context) {
      if (typeof DIALOGUES === 'undefined') return;

      let pool = [];
      const gs = gameState;

      if (context === 'matin') {
        if      (gs.semaine === 4) pool = DIALOGUES.fred.semaine4;
        else if (gs.semaine === 3) pool = DIALOGUES.fred.semaine3;
        else if (gs.semaine === 2) pool = DIALOGUES.fred.semaine2;
        else                       pool = DIALOGUES.fred.matin;

        if (gs.legalite  >= 60)
          pool = [...pool, ...DIALOGUES.fred.legalite_haute];
        if (gs.exposition >= 50)
          pool = [...pool, ...DIALOGUES.fred.exposition_haute];
        if (gs.argent < 100)
          pool = [...pool, ...DIALOGUES.fred.argent_serre];
      } else if (context === 'tired') {
        pool = [
          "Je suis à plat. Faut fermer.",
          "Plus d'énergie. La réserve attend."
        ];
      } else if (context === 'fermeture') {
        pool = DIALOGUES.fred.fermeture;
      }

      if (pool.length > 0) {
        const t = pool[Math.floor(Math.random() * pool.length)];
        document.getElementById('fred-thought').textContent = `"${t}"`;
      }
    }

    // ===================================================
    // UI
    // ===================================================

    function updateUI() {
      const gs = gameState;

      document.getElementById('bar-money').style.width =
        Math.min(100, (gs.argent / 500) * 100) + '%';
      document.getElementById('val-money').textContent = gs.argent + '$';
      document.getElementById('bar-legal').style.width = gs.legalite + '%';
      document.getElementById('val-legal').textContent = gs.legalite + '%';
      document.getElementById('bar-expo').style.width  = gs.exposition + '%';
      document.getElementById('val-expo').textContent  = gs.exposition + '%';
      const ePct = (gs.energie / gs.energieMax) * 100;
      document.getElementById('bar-energy').style.width = ePct + '%';
      document.getElementById('val-energy').textContent =
        gs.energie + '/' + gs.energieMax;

      // Stock étagères
      ['action','horreur','drame','enfants','rarites'].forEach(g => {
        const el  = document.getElementById('stock-' + g);
        if (!el) return;
        const max = g === 'rarites' ? 3 : 10;
        const val = gs.stock[g] || 0;
        el.textContent = val;
        el.className   = 'shelf-count';
        if (val === 0)             el.classList.add('empty');
        else if (val <= max * 0.3) el.classList.add('low');
      });
    }

    function updateDayInfo() {
      document.getElementById('day-info').textContent =
        `Jour ${gameState.jour} — S${gameState.semaine}`;
    }

    function showTooltip(type) {
      const gs = gameState;
      const messages = {
        money:              `Caisse : ${gs.argent}$ — Collecte Jackson : Mercredi`,
        legal:              `Légalité : ${gs.legalite}% — L'œil de Canopi`,
        expo:               `Exposition : ${gs.exposition}% — Le radar de DiMaggio`,
        energy:             `Énergie : ${gs.energie}/${gs.energieMax}`,
        stock_action:       `Action en stock : ${gs.stock.action || 0}/10`,
        stock_horreur:      `Horreur en stock : ${gs.stock.horreur || 0}/10`,
        stock_drame:        `Drame en stock : ${gs.stock.drame || 0}/10`,
        stock_enfants:      `Enfants en stock : ${gs.stock.enfants || 0}/10`,
        stock_rarites:      `Raretés en stock : ${gs.stock.rarites || 0}/3`
      };

      const tooltip = document.getElementById('gauge-tooltip');
      tooltip.textContent = messages[type] || '';
      tooltip.classList.add('visible');
      setTimeout(() => tooltip.classList.remove('visible'), 2000);
    }

    function showNotif(message, positive = true) {
      const notif = document.getElementById('notif');
      notif.textContent = message;
      notif.className = 'notif visible' + (positive ? '' : ' negative');
      setTimeout(() => { notif.className = 'notif'; }, 2500);
    }

    function saveGame() {
      window.gameStateRef = gameState;
      localStorage.setItem(
        'rewindParadise_save',
        JSON.stringify(gameState)
      );
    }

  </script>

</body>
