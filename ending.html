<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rewind Paradise — Fin</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: #000000;
      color: #ffffff;
      font-family: 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      animation: fadeIn 2s ease;
    }

    @keyframes fadeIn {
      from { opacity:0; }
      to   { opacity:1; }
    }

    .derniere_ligne {
      font-size: 13px;
      color: #555566;
      font-style: italic;
      letter-spacing: 1px;
      margin-bottom: 60px;
      text-align: center;
      line-height: 1.8;
      max-width: 320px;
    }

    .derniere_ligne em {
      color: #8888aa;
    }

    .separateur {
      width: 40px;
      height: 1px;
      background: #222233;
      margin: 0 auto 60px;
    }

    .titre_fin {
      font-size: 9px;
      color: #333344;
      letter-spacing: 5px;
      text-align: center;
      margin-bottom: 30px;
    }

    .roman_titre {
      font-size: 32px;
      color: #ffffff;
      letter-spacing: 6px;
      text-align: center;
      margin-bottom: 8px;
      font-weight: bold;
      text-shadow: 0 0 30px #ffffff20;
    }

    .roman_sous {
      font-size: 10px;
      color: #444455;
      letter-spacing: 3px;
      text-align: center;
      margin-bottom: 50px;
    }

    .roman_texte {
      font-size: 12px;
      color: #555566;
      font-style: italic;
      text-align: center;
      line-height: 1.9;
      max-width: 300px;
      margin-bottom: 50px;
    }

    .btn_roman {
      display: block;
      background: transparent;
      border: 1px solid #333344;
      border-radius: 6px;
      padding: 16px 32px;
      font-family: 'Courier New', monospace;
      font-size: 10px;
      color: #ffffff;
      letter-spacing: 4px;
      text-decoration: none;
      text-align: center;
      margin-bottom: 20px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }

    .btn_roman::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.05), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0%   { left: -100%; }
      100% { left: 200%; }
    }

    .btn_roman:active {
      border-color: #ffffff;
      color: #ffffff;
    }

    .btn_rejouer {
      font-size: 9px;
      color: #333344;
      letter-spacing: 2px;
      text-align: center;
      cursor: pointer;
      padding: 8px;
      margin-top: 10px;
    }

    .celluloide {
      font-size: 8px;
      color: #222233;
      letter-spacing: 3px;
      text-align: center;
      margin-top: 60px;
    }
  </style>
</head>
<body>
  <audio id="skip-music" autoplay loop>
    <source src="music/skip.mp3" type="audio/mpeg">
  </audio>
  <script>
    const m = document.getElementById('skip-music');
    if (m) { m.volume = 0.4; m.play().catch(()=>{}); }
  </script>

  <div class="derniere_ligne">
    <em>"Jackson allait passer le mercredi.</em><br>
    <em>On était mercredi."</em>
  </div>

  <div class="separateur"></div>

  <div class="titre_fin">LA SUITE DANS</div>

  <div class="roman_titre">MICRO-MÉTRAGE</div>
  <div class="roman_sous">DAVID HUMBERT — ROMAN</div>

  <div class="roman_texte">
    Fred. Corey. Jackson.<br>
    La boîte volée.<br>
    Ce qui arrive ensuite.
  </div>

  <a class="btn_roman" href="https://davhumb.github.io/micro-metrage/" target="_blank">
    ▶ LIRE LE ROMAN
  </a>

  <div class="btn_rejouer" onclick="window.location.href='landing.html'">
    ◀ RECOMMENCER
  </div>

  <div class="celluloide">CELLULOÏD SCALPEL — REWIND PARADISE</div>

</body>
</html>
