<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rewind Paradise — La Réserve</title>
  <link rel="stylesheet" href="data/style.css">
  <script src="data/cassettes.js"></script>
  <script src="data/sounds.js"></script>
  <script src="data/achievements.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #080818;
      font-family: 'Courier New', monospace;
      color: #ffffff;
    }

    .top-bar {
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #080818;
      border-bottom: 2px solid #00b4ff;
      box-shadow: 0 2px 12px #00b4ff30;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .reserve-title {
      font-size: 10px;
      color: #ffffff;
      letter-spacing: 3px;
      text-shadow: 0 0 8px #ff2d78, 0 0 16px #00b4ff;
    }

    .night-info {
      font-size: 9px;
      color: #aaaadd;
      letter-spacing: 1px;
    }

    .mute-btn { font-size: 16px; cursor: pointer; opacity: 0.6; }

    .main-area {
      flex: 1;
      padding: 10px 12px 100px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* CASSETTE INFO */
    .cassette-source {
      background: #0a0a1a;
      border: 2px solid #ff2d78;
      box-shadow: 0 0 10px #ff2d7830;
      border-radius: 8px;
      padding: 12px;
    }

    .cassette-label { font-size: 9px; color: #ff2d78; letter-spacing: 2px; margin-bottom: 4px; }
    .cassette-title { font-size: 15px; color: #ffffff; font-weight: bold; letter-spacing: 1px; margin-bottom: 2px; }
    .cassette-meta  { font-size: 10px; color: #aaaadd; }

    /* FRED + COREY AVANT */
    .fred-corey-avant {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #06060f;
      border-left: 3px solid #00b4ff;
      border-radius: 0 6px 6px 0;
      padding: 10px 12px;
    }

    .fred-reserve-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid #00b4ff80;
      object-fit: cover;
      background: #080818;
      box-shadow: 0 0 10px #00b4ff30;
      flex-shrink: 0;
    }

    .corey-avant-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      background: #06060f;
      border-left: 3px solid #ff2d78;
      border-radius: 0 6px 6px 0;
      padding: 8px 10px;
    }

    .corey-reserve-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid #ff2d7880;
      object-fit: cover;
      background: #080818;
      box-shadow: 0 0 10px #ff2d7830;
      flex-shrink: 0;
    }

    .corey-avant-text {
      font-size: 12px;
      color: #ffdd99;
      font-style: italic;
      line-height: 1.5;
    }

    /* MONITEUR */
    .monitor-wrapper {
      background: #08081a;
      border: 2px solid #00b4ff;
      box-shadow: 0 0 12px #00b4ff30;
      border-radius: 8px;
      overflow: hidden;
    }

    .monitor-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 12px;
      font-size: 8px;
      color: #444466;
      letter-spacing: 2px;
    }

    .monitor-rec {
      color: #ff0000;
      display: none;
    }
    .monitor-rec.visible {
      display: block;
      animation: recBlink 1s infinite;
    }
    @keyframes recBlink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    .monitor-screen {
      width: 100%;
      aspect-ratio: 4/3;
      background: #020205;
      position: relative;
      overflow: hidden;
    }

    /* SCANLINES */
    .monitor-screen::after {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: repeating-linear-gradient(
        0deg, transparent, transparent 3px,
        rgba(0,0,0,0.15) 3px, rgba(0,0,0,0.15) 4px
      );
      pointer-events: none;
      z-index: 10;
    }

    .scene-image {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .scene-image.visible { opacity: 1; }

    .tracking-line {
      position: absolute;
      width: 100%; height: 3px;
      background: rgba(255,255,255,0.08);
      left: 0; z-index: 8;
      display: none;
      pointer-events: none;
    }
    .tracking-line.visible {
      display: block;
      animation: trackingMove 3s linear infinite;
    }
    @keyframes trackingMove {
      0%   { top: -5%; opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 0.4; }
      100% { top: 105%; opacity: 0; }
    }

    .scene-timecode {
      position: absolute;
      bottom: 8px; right: 10px;
      font-size: 9px;
      color: rgba(255,255,255,0.3);
      letter-spacing: 1px;
      z-index: 11;
      font-family: 'Courier New', monospace;
    }

    /* PROGRESS BAR — subtile, juste l'ambiance */
    .progress-bar {
      height: 3px;
      background: #0a0a18;
    }
    .progress-fill {
      height: 100%;
      background: #ff2d78;
      width: 0%;
      transition: width 0.1s linear;
    }

    /* BOUTONS */
    .cut-zone {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-lancer {
      width: 100%;
      background: #080f06;
      border: 2px solid #ff8855;
      border-radius: 8px;
      padding: 16px 8px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      color: #ff8855;
      letter-spacing: 3px;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      text-shadow: 0 0 10px #ff8855;
    }
    .btn-lancer:active { transform: scale(0.97); }
    .btn-lancer.hidden { display: none; }

    .cut-btn {
      width: 100%;
      background: #100508;
      border: 2px solid #ff4466;
      border-radius: 8px;
      padding: 18px 8px;
      text-align: center;
      cursor: pointer;
      display: none;
      position: relative;
      overflow: hidden;
    }
    .cut-btn.visible  { display: block; }
    .cut-btn:active   { transform: scale(0.97); }

    .cut-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,68,102,0.1), transparent);
      animation: shimmer 2s infinite;
    }
    @keyframes shimmer {
      0%   { left: -100%; }
      100% { left: 100%; }
    }

    .cut-text { font-size: 16px; color: #ff4466; letter-spacing: 4px; font-weight: bold; text-shadow: 0 0 12px #ff4466; }

    /* COREY RÉACTION */
    .corey-reaction {
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-left: 3px solid #ff2d78;
      border-radius: 0 6px 6px 0;
      padding: 12px;
      display: none;
    }
    .corey-reaction.visible {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }
    .corey-reaction-avatar {
      width: 64px; height: 64px;
      border-radius: 50%;
      border: 2px solid #ff2d7880;
      object-fit: cover;
      flex-shrink: 0;
      background: #080818;
    }
    .corey-label { font-size: 8px; color: #ff2d78; letter-spacing: 2px; margin-bottom: 6px; }
    .corey-text  { font-size: 13px; color: #ffffff; font-style: italic; line-height: 1.6; }

    /* CUTTER */
    .cutter-panel {
      display: none;
      background: #060612;
      border: 1px solid #2e2e50;
      border-radius: 8px;
      overflow: hidden;
    }
    .cutter-panel.visible { display: block; animation: fadeIn 0.5s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .cutter-header {
      background: #0a0a1e;
      padding: 10px 14px;
      border-bottom: 1px solid #2e2e50;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .cutter-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid #4444aa40;
      background: #0a0a18;
    }
    .cutter-fanzine { font-size: 11px; color: #f0f0ff; letter-spacing: 2px; }
    .cutter-pseudo  { font-size: 9px; color: #444466; letter-spacing: 1px; }
    .cutter-body    { padding: 14px; }
    .cutter-title   { font-size: 13px; color: #f0f0ff; letter-spacing: 1px; margin-bottom: 10px; }
    .cutter-critique { font-size: 12px; color: #8080aa; font-style: italic; line-height: 1.7; margin-bottom: 14px; }
    .cutter-note {
      display: flex;
      align-items: baseline;
      gap: 4px;
      margin-bottom: 10px;
    }
    .note-label { font-size: 10px; color: #444466; letter-spacing: 2px; }
    .note-max   { font-size: 14px; color: #444466; }
    .note-value {
      font-size: 40px;
      font-weight: bold;
      letter-spacing: 2px;
      animation: noteReveal 0.6s ease;
    }
    @keyframes noteReveal {
      from { opacity: 0; transform: scale(0.5); }
      to   { opacity: 1; transform: scale(1); }
    }
    .corey-after {
      font-size: 11px;
      color: #7070aa;
      font-style: italic;
      border-top: 1px solid #1e1e3a;
      padding-top: 10px;
    }

    /* DISTRIBUTION */
    .distrib-section { display: none; }
    .distrib-section.visible { display: block; }
    .distrib-title { font-size: 9px; color: #ff2d78; letter-spacing: 2px; margin-bottom: 8px; }
    .distrib-options { display: flex; flex-direction: column; gap: 6px; }
    .distrib-option {
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-radius: 6px;
      padding: 12px 14px;
      cursor: pointer;
    }
    .distrib-option:active { background: #0f0f22; border-color: #00b4ff; }
    .distrib-option.disabled { opacity: 0.3; pointer-events: none; }
    .distrib-name    { font-size: 12px; color: #f0f0ff; letter-spacing: 1px; margin-bottom: 6px; }
    .distrib-effects { display: flex; flex-direction: column; gap: 3px; }
    .distrib-effect  { font-size: 9px; color: #555577; letter-spacing: 1px; }
    .distrib-effect.positive { color: #00ffc8; }
    .distrib-effect.negative { color: #ff4466; }
    .distrib-effect.warning  { color: #ff8855; }

    /* BOTTOM */
    .bottom-bar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #080818;
      border-top: 2px solid #ff2d78;
      padding: 8px 12px;
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
      z-index: 100;
    }
    .gauge-item { display: flex; flex-direction: column; align-items: center; gap: 3px; }
    .gauge-icon { font-size: 14px; }
    .gauge-bar-container { width: 100%; height: 4px; background: #0f0f20; border-radius: 2px; overflow: hidden; }
    .gauge-bar { height: 100%; border-radius: 2px; transition: width 0.3s; }
    .gauge-bar.money  { background: #00ffc8; }
    .gauge-bar.legal  { background: #ff8855; }
    .gauge-bar.energy { background: #ffdd44; }
    .gauge-value { font-size: 9px; color: #aaaadd; letter-spacing: 1px; font-weight: bold; }

    .notif-toast {
      position: fixed;
      top: 60px; left: 50%;
      transform: translateX(-50%);
      background: #050510;
      border: 1px solid #2e2e50;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 11px;
      color: #7777aa;
      letter-spacing: 1px;
      z-index: 500;
      text-align: center;
      max-width: 85vw;
      font-family: 'Courier New', monospace;
      display: none;
    }
    .notif-toast.visible { display: block; animation: notifAnim 2.5s forwards; }
    .notif-toast.positive { border-color: #00ffc8; color: #00ffc8; }
    .notif-toast.negative { border-color: #ff4466; color: #ff4466; }
    @keyframes notifAnim {
      0%  { opacity: 0; }
      12% { opacity: 1; }
      75% { opacity: 1; }
      100%{ opacity: 0; }
    }

    .fade-out { animation: fadeOut 0.5s forwards; }
    @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="reserve-title">▓ LA RÉSERVE ▓</div>
    <div style="display:flex;align-items:center;gap:12px;">
      <div class="night-info" id="night-info">Soir — Jour 1</div>
      <div class="mute-btn" id="mute-btn" onclick="toggleMute()">🔊</div>
    </div>
  </div>

  <div class="main-area">

    <!-- CASSETTE -->
    <div class="cassette-source">
      <div class="cassette-label">CASSETTE SOURCE</div>
      <div class="cassette-title" id="cassette-title">Chargement...</div>
      <div class="cassette-meta" id="cassette-type">—</div>
    </div>

    <!-- FRED + COREY -->
    <div class="fred-corey-avant">
      <img class="fred-reserve-avatar" id="fred-reserve-avatar"
           src="posters/fred.png" alt="Fred"
           onerror="this.style.display='none'">
      <div class="corey-avant-wrapper">
        <img class="corey-reserve-avatar" id="corey-avant-avatar"
             src="posters/corey.png" alt="Corey"
             onerror="this.style.display='none'">
        <div class="corey-avant-text" id="corey-avant-text">
          Corey prépare le magnéto...
        </div>
      </div>
    </div>

    <!-- MONITEUR -->
    <div class="monitor-wrapper">
      <div class="monitor-top">
        <span>▶ MONITEUR</span>
        <span class="monitor-rec" id="monitor-rec">● REC</span>
        <span class="scene-timecode" id="scene-timecode" style="position:relative;bottom:auto;right:auto;">00:00</span>
      </div>
      <div class="monitor-screen">
        <img class="scene-image" id="scene-image" src="" alt="">
        <div class="tracking-line" id="tracking-line"></div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </div>

    <!-- BOUTONS -->
    <div class="cut-zone">
      <div class="btn-lancer" id="btn-lancer" onclick="lancerFilm()">
        ▶ LANCER LE FILM
      </div>
      <div class="cut-btn" id="cut-btn" onclick="makeCut()">
        <div class="cut-text">✂ COUPER</div>
      </div>
    </div>

    <!-- COREY RÉACTION -->
    <div class="corey-reaction" id="corey-reaction">
      <img class="corey-reaction-avatar" id="corey-reaction-avatar"
           src="posters/corey.png" alt="Corey"
           onerror="this.style.display='none'">
      <div>
        <div class="corey-label">COREY —</div>
        <div class="corey-text" id="corey-text">...</div>
      </div>
    </div>

    <!-- CUTTER -->
    <div class="cutter-panel" id="cutter-panel">
      <div class="cutter-header">
        <img class="cutter-avatar" src="posters/cuter.png" alt=""
             onerror="this.style.display='none'">
        <div>
          <div class="cutter-fanzine">CELLULOÏD SCALPEL</div>
          <div class="cutter-pseudo">The Glitch</div>
        </div>
      </div>
      <div class="cutter-body">
        <div class="cutter-title" id="cutter-title">—</div>
        <div class="cutter-critique" id="cutter-critique">—</div>
        <div class="cutter-note">
          <span class="note-label">NOTE :</span>
          <span class="note-value" id="note-value">—</span>
          <span class="note-max">/10</span>
        </div>
        <div class="corey-after" id="corey-after">—</div>
      </div>
    </div>

    <!-- DISTRIBUTION -->
    <div class="distrib-section" id="distrib-section">
      <div class="distrib-title">DISTRIBUER LE MICRO-MÉTRAGE</div>
      <div class="distrib-options" id="distrib-options"></div>
    </div>

  </div>

  <div class="bottom-bar">
    <div class="gauge-item">
      <span class="gauge-icon">💰</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar money" id="bar-money" style="width:40%"></div>
      </div>
      <span class="gauge-value" id="val-money">—</span>
    </div>
    <div class="gauge-item">
      <span class="gauge-icon">🎬</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar legal" id="bar-legal" style="width:0%"></div>
      </div>
      <span class="gauge-value" id="val-legal">—</span>
    </div>
    <div class="gauge-item">
      <span class="gauge-icon">⚡</span>
      <div class="gauge-bar-container">
        <div class="gauge-bar energy" id="bar-energy" style="width:100%"></div>
      </div>
      <span class="gauge-value" id="val-energy">—</span>
    </div>
  </div>

  <div class="notif-toast" id="notif-toast"></div>
  <audio id="bg-music" loop><source src="music/micrometrage.mp3" type="audio/mpeg"></audio>

  <script>

    let gameState       = {};
    let currentCassette = null;
    let segments        = [];
    let currentSegIdx   = -1;
    let cutMade         = false;
    let filmEnCours     = false;
    let timelineRAF     = null;
    let rembBonus       = 0;
    let music           = null;
    let isMuted         = false;

    // ===================================================
    // MUSIQUE
    // ===================================================

    function initMusic() {
      music   = document.getElementById('bg-music');
      isMuted = localStorage.getItem('rewind_muted') === 'true';
      music.volume = 0.25;
      music.muted  = isMuted;
      document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
      const p = music.play();
      if (p) p.catch(() => document.addEventListener('touchstart', () => music.play(), {once:true}));
    }

    function toggleMute() {
      isMuted = !isMuted;
      if (music) music.muted = isMuted;
      localStorage.setItem('rewind_muted', isMuted);
      document.getElementById('mute-btn').textContent = isMuted ? '🔇' : '🔊';
    }

    function fadeOutMusic(cb) {
      if (!music || isMuted) { if (cb) cb(); return; }
      let v = music.volume;
      const f = setInterval(() => {
        v = Math.max(0, v - 0.05);
        music.volume = v;
        if (v <= 0) { clearInterval(f); music.pause(); if (cb) cb(); }
      }, 50);
    }

    // ===================================================
    // INIT
    // ===================================================

    window.onload = function() {
      const save = localStorage.getItem('rewindParadise_save');
      if (!save) { window.location.href = 'index.html'; return; }
      gameState = JSON.parse(save);

      initMusic();
      updateUI();
      document.getElementById('night-info').textContent =
        `Soir — Jour ${gameState.jour || 1}`;

      // Choisir cassette
      const semaine = gameState.semaine || 1;
      currentCassette = getCassetteAleatoire(semaine);
      if (!currentCassette && CASSETTES_DATA && CASSETTES_DATA.length) {
        currentCassette = CASSETTES_DATA[0];
      }

      if (!currentCassette) { window.location.href = 'night.html'; return; }

      // Mémoriser
      if (!gameState.cassettes_jouees) gameState.cassettes_jouees = [];
      if (!gameState.cassettes_jouees.includes(currentCassette.id)) {
        gameState.cassettes_jouees.push(currentCassette.id);
      }
      gameState.derniereCassette = currentCassette.id;

      segments = currentCassette.segments || [];

      // Afficher infos
      document.getElementById('cassette-title').textContent = currentCassette.titre;
      document.getElementById('cassette-type').textContent  = currentCassette.type || '—';
      document.getElementById('corey-avant-text').textContent =
        currentCassette.corey_avant || 'Corey charge la cassette.';

      // Avatars selon difficulté
      const diff = currentCassette.difficulte || 2;
      if (diff >= 4) {
        setAvatar('corey-avant-avatar', 'posters/corey-peur.png');
        setAvatar('fred-reserve-avatar', 'posters/fred_stress.png');
      } else {
        setAvatar('corey-avant-avatar', 'posters/corey-heureux.png');
        setAvatar('fred-reserve-avatar', 'posters/fred.png');
      }
    };

    function getCassetteAleatoire(semaine) {
      if (typeof CASSETTES_DATA === 'undefined') return null;
      const dispo     = CASSETTES_DATA.filter(c => c.semaine_min <= semaine);
      const dejouees  = gameState.cassettes_jouees || [];
      const nonJouees = dispo.filter(c => !dejouees.includes(c.id));
      const pool      = nonJouees.length > 0 ? nonJouees : dispo;
      if (!pool.length) return null;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function setAvatar(id, src) {
      const el = document.getElementById(id);
      if (el) el.src = src;
    }

    // ===================================================
    // LANCER LE FILM
    // ===================================================

    function lancerFilm() {
      if (!segments.length) return;

      document.getElementById('btn-lancer').classList.add('hidden');
      document.getElementById('cut-btn').classList.add('visible');
      document.getElementById('monitor-rec').classList.add('visible');
      document.getElementById('tracking-line').classList.add('visible');

      cutMade      = false;
      filmEnCours  = true;
      currentSegIdx = -1;

      // Durée par image selon difficulté
      const DUREES = {0:3000, 1:2800, 2:2200, 3:1600, 4:1100, 5:800};
      const dureeParImage = DUREES[currentCassette.difficulte || 2];
      const dureeTotal    = segments.length * dureeParImage;

      let startTime = null;

      function animate(timestamp) {
        if (cutMade) return;
        if (!startTime) startTime = timestamp;

        const elapsed = timestamp - startTime;
        const pct     = Math.min(elapsed / dureeTotal, 1);

        // Progress bar
        document.getElementById('progress-fill').style.width = (pct * 100) + '%';

        // Index du segment actuel
        const newIdx = Math.min(
          Math.floor(pct * segments.length),
          segments.length - 1
        );

        if (newIdx !== currentSegIdx) {
          currentSegIdx = newIdx;
          afficherSegment(newIdx);
        }

        // Timecode
        const secs = Math.floor(elapsed / 1000);
        document.getElementById('scene-timecode').textContent =
          String(Math.floor(secs / 60)).padStart(2,'0') + ':' +
          String(secs % 60).padStart(2,'0');

        if (pct < 1) {
          timelineRAF = requestAnimationFrame(animate);
        } else {
          // Film terminé sans couper — coupe forcée sur dernier segment
          cutMade = true;
          finaliserCoupe(segments.length - 1);
        }
      }

      timelineRAF = requestAnimationFrame(animate);
    }

    function afficherSegment(idx) {
      const seg   = segments[idx];
      const imgEl = document.getElementById('scene-image');
      if (!seg || !imgEl) return;
      imgEl.classList.remove('visible');
      imgEl.src = seg.image || '';
      imgEl.onload = () => imgEl.classList.add('visible');
      imgEl.onerror = () => imgEl.classList.remove('visible');
    }

    // ===================================================
    // COUPER
    // ===================================================

    function makeCut() {
      if (cutMade || !filmEnCours) return;
      cutMade = true;
      if (timelineRAF) cancelAnimationFrame(timelineRAF);
      finaliserCoupe(currentSegIdx);
    }

    function finaliserCoupe(segIdx) {
      filmEnCours = false;
      document.getElementById('monitor-rec').classList.remove('visible');
      document.getElementById('tracking-line').classList.remove('visible');
      document.getElementById('cut-btn').classList.remove('visible');

      // Calculer la note
      const note = calculerNote(segIdx);

      // Corey réaction
      setTimeout(() => afficherCoreyReaction(note, segIdx), 400);

      // Cutter jugement
      setTimeout(() => showCutterJudgement(note), 2200);
    }

    // ===================================================
    // CALCUL NOTE
    // ===================================================

    function calculerNote(segIdx) {
      const c = currentCassette;

      // OCR — n'importe où c'est bien
      if (c.id === 'ocr') return 8;

      // Requins du Bronx — pas de bonne coupe
      if (c.pasDeCoupe) return 10;

      if (!c.coupesIdeal || !c.coupesIdeal.length) return 5;

      const minDist = Math.min(...c.coupesIdeal.map(i => Math.abs(segIdx - i)));
      let note;
      if (minDist === 0)      note = 10;
      else if (minDist === 1) note = 7;
      else if (minDist === 2) note = 4;
      else                    note = Math.max(1, 4 - minDist);

      // Coupe acceptable
      if (c.coupeAcceptable && Array.isArray(c.coupeAcceptable)) {
        const ad = Math.min(...c.coupeAcceptable.map(a => Math.abs(segIdx - a)));
        if (ad === 0 && note < 6) note = 6;
      }

      return Math.max(1, Math.min(10, note + rembBonus));
    }

    // ===================================================
    // COREY RÉACTION
    // ===================================================

    const COREY_GENERIQUES = {
      bien: [
        "T'as vu le moment exact.",
        "Je dirai rien de plus. C'est bien.",
        "Comment t'as trouvé ça ?"
      ],
      moyen: [
        "Pas loin. Mais pas parfait.",
        "Y'avait mieux. Mais c'est honnête.",
        "Mmh. Ça passe."
      ],
      rate: [
        "Non. Juste... non.",
        "T'as essayé un truc. Ça a pas marché.",
        "Fred... on en reparlera."
      ]
    };

    function afficherCoreyReaction(note, segIdx) {
      const c   = currentCassette;
      let txt   = '';
      let avatar = 'posters/corey-heureux.png';

      if (c.pasDeCoupe) {
        txt    = c.corey_reussi || "On touche pas à ça.";
        avatar = 'posters/corey-illumine.png';
        setAvatar('fred-reserve-avatar', 'posters/fred-attentif.png');
      } else if (note >= 8 && c.corey_reussi) {
        txt    = c.corey_reussi;
        avatar = 'posters/corey-heureux.png';
        setAvatar('fred-reserve-avatar', 'posters/fred_fier.png');
      } else if (note >= 6 && c.corey_rate_acceptable) {
        txt    = c.corey_rate_acceptable;
        avatar = 'posters/corey-ok.png';
        setAvatar('fred-reserve-avatar', 'posters/fred-attentif.png');
      } else if (note < 5 && c.corey_rate) {
        txt    = c.corey_rate;
        avatar = 'posters/corey-depite.png';
        setAvatar('fred-reserve-avatar', 'posters/fred_doute.png');
      } else if (note >= 7) {
        txt    = COREY_GENERIQUES.bien[Math.floor(Math.random()*3)];
        avatar = 'posters/corey-heureux.png';
        setAvatar('fred-reserve-avatar', 'posters/fred_fier.png');
      } else if (note >= 5) {
        txt    = COREY_GENERIQUES.moyen[Math.floor(Math.random()*3)];
        avatar = 'posters/corey-ok.png';
      } else {
        txt    = COREY_GENERIQUES.rate[Math.floor(Math.random()*3)];
        avatar = 'posters/corey-colere1.png';
        setAvatar('fred-reserve-avatar', 'posters/fred_doute.png');
      }

      setAvatar('corey-reaction-avatar', avatar);
      document.getElementById('corey-text').textContent = txt;
      document.getElementById('corey-reaction').classList.add('visible');
    }

    // ===================================================
    // CUTTER
    // ===================================================

    function showCutterJudgement(note) {
      const critiques = {
        10: { texte:"Je ne comprends pas encore pourquoi cette coupe fonctionne. Mais elle fonctionne.", corey:'"Dix sur dix."' },
        9:  { texte:"Exactement là où le film n'avait plus besoin de continuer.", corey:'"Je savais que t\'avais ça en toi."' },
        8:  { texte:"Vous avez vu juste. Pas de chance — c'est du travail.", corey:'"Huit. C\'est bien. Pas dix."' },
        7:  { texte:"L'instinct était là. L'exécution presque parfaite.", corey:'"Sept. On peut faire mieux."' },
        6:  { texte:"Vous avez compris ce que ce film avait à dire. Presque.", corey:'"Six sur dix."' },
        5:  { texte:"Bon endroit. Mauvais moment. Ou l'inverse.", corey:'"Cinq. Le milieu."' },
        4:  { texte:"Prudent. Sécurité au lieu du risque.", corey:'"Quatre. Cutter est déçu."' },
        3:  { texte:"Au bon endroit mais trop tôt ou trop tard.", corey:'"Trois. On recommence."' },
        2:  { texte:"Vous avez coupé. C'est tout ce qu'on peut dire.", corey:'"Deux sur dix. Dur."' },
        1:  { texte:"Vous avez appuyé sur stop au hasard.", corey:'"Un sur dix Fred. Un."' }
      };

      const c = critiques[note] || critiques[5];

      document.getElementById('cutter-title').textContent = `"${currentCassette.titre}"`;
      document.getElementById('cutter-critique').textContent = c.texte;
      document.getElementById('corey-after').textContent    = c.corey;

      const noteEl = document.getElementById('note-value');
      noteEl.textContent   = note;
      noteEl.style.color   = note >= 8 ? '#00ffc8' : note >= 5 ? '#ff8855' : '#ff4466';
      noteEl.style.animation = 'none';
      void noteEl.offsetWidth;
      noteEl.style.animation = 'noteReveal 0.6s ease';

      document.getElementById('cutter-panel').classList.add('visible');

      // gameState
      if (note >= 8) {
        gameState.credibilite = Math.min(100, (gameState.credibilite||0) + 5);
        if (note === 10) gameState.cutterInteret = 'investi';
        else if (!gameState.cutterInteret || gameState.cutterInteret === 'indifferent')
          gameState.cutterInteret = 'intrigue';
      } else if (note <= 3) {
        gameState.credibilite = Math.max(0, (gameState.credibilite||0) - 2);
      }

      if (!gameState.notesHistory) gameState.notesHistory = [];
      gameState.notesHistory.push(note);
      gameState.currentNote = note;
      saveGame();

      setTimeout(() => {
        showDistribution(note);
        setTimeout(() => document.getElementById('distrib-section')
          .scrollIntoView({behavior:'smooth'}), 300);
      }, 1000);
    }

    // ===================================================
    // DISTRIBUTION
    // ===================================================

    function showDistribution(note) {
      const options = document.getElementById('distrib-options');
      const jacksonOk = note >= 4;

      options.innerHTML = `
        <div class="distrib-option ${jacksonOk ? '' : 'disabled'}" onclick="distribute('jackson')">
          <div class="distrib-name">▶ VIA JACKSON</div>
          <div class="distrib-effects">
            <div class="distrib-effect positive">+${Math.round(note*4)}$</div>
            <div class="distrib-effect positive">Crédibilité +2</div>
            <div class="distrib-effect warning">Légalité +1</div>
            ${!jacksonOk ? '<div class="distrib-effect negative">Note insuffisante</div>' : ''}
          </div>
        </div>
        <div class="distrib-option" onclick="distribute('gamins')">
          <div class="distrib-name">▶ VIA LES GAMINS</div>
          <div class="distrib-effects">
            <div class="distrib-effect positive">+${Math.round(note*1.5)}$</div>
            <div class="distrib-effect positive">Crédibilité +3</div>
            <div class="distrib-effect warning">Exposition +${note>=7?4:2}</div>
          </div>
        </div>
        <div class="distrib-option" onclick="distribute('garder')">
          <div class="distrib-name">▷ GARDER — FLASH-CUT</div>
          <div class="distrib-effects">
            <div class="distrib-effect">Flash-cut stock +1</div>
            <div class="distrib-effect positive">Légalité -1</div>
          </div>
        </div>`;

      document.getElementById('distrib-section').classList.add('visible');
    }

    function distribute(choice) {
      const note = gameState.currentNote || 5;
      if (choice === 'jackson') {
        gameState.argent      = (gameState.argent||0) + Math.round(note*4);
        gameState.credibilite = Math.min(100, (gameState.credibilite||0) + 2);
        gameState.legalite    = Math.min(100, (gameState.legalite||0) + 1);
        showNotif(`+${Math.round(note*4)}$ via Jackson`, true);
      } else if (choice === 'gamins') {
        gameState.argent      = (gameState.argent||0) + Math.round(note*1.5);
        gameState.credibilite = Math.min(100, (gameState.credibilite||0) + 3);
        gameState.exposition  = Math.min(100, (gameState.exposition||0) + (note>=7?4:2));
        gameState.noires_distribuees = (gameState.noires_distribuees||0) + 1;
        showNotif(`+${Math.round(note*1.5)}$ via les gamins`, true);
      } else {
        if (!gameState.flashCutStock) gameState.flashCutStock = 0;
        gameState.flashCutStock++;
        gameState.legalite = Math.max(0, (gameState.legalite||0) - 1);
        showNotif(`Flash-cut stocké. Total : ${gameState.flashCutStock}`, true);
      }
      gameState.energieBonusTomorrow = note >= 8 ? 3 : note <= 3 ? -3 : 0;
      updateUI();
      saveGame();
      setTimeout(goToNight, 1500);
    }

    // ===================================================
    // UI / NAV
    // ===================================================

    function updateUI() {
      const gs = gameState;
      document.getElementById('bar-money').style.width  = Math.min(100,((gs.argent||0)/500)*100)+'%';
      document.getElementById('val-money').textContent  = (gs.argent||0)+'$';
      document.getElementById('bar-legal').style.width  = (gs.legalite||0)+'%';
      document.getElementById('val-legal').textContent  = (gs.legalite||0)+'%';
      const ePct = ((gs.energie||0)/(gs.energieMax||15))*100;
      document.getElementById('bar-energy').style.width = ePct+'%';
      document.getElementById('val-energy').textContent = (gs.energie||0)+'/'+(gs.energieMax||15);
    }

    function showNotif(msg, positive) {
      const n = document.getElementById('notif-toast');
      n.textContent = msg;
      n.className   = `notif-toast visible ${positive ? 'positive' : 'negative'}`;
      setTimeout(() => { n.className = 'notif-toast'; }, 2500);
    }

    function saveGame() {
      if (typeof ACHIEVEMENTS !== 'undefined') ACHIEVEMENTS.checkAndNotify(gameState);
      localStorage.setItem('rewindParadise_save', JSON.stringify(gameState));
    }

    function goToNight() {
      fadeOutMusic(() => {
        document.body.classList.add('fade-out');
        setTimeout(() => { window.location.href = 'night.html'; }, 500);
      });
    }

  </script>
</body>
