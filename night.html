<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 
        initial-scale=1.0, maximum-scale=1.0, 
        user-scalable=no">
  <title>Rewind Paradise — La Nuit</title>
  <link rel="stylesheet" href="data/style.css">
  <script src="data/dialogues.js"></script>
  <style>

    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #030306;
      font-family: 'Courier New', monospace;
      color: #f0f0ff;
      overflow-x: hidden;
    }

    /* TOP */
    .top-bar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #0d0d1a;
      background: #050508;
    }

    .night-title {
      font-size: 10px;
      color: #333355;
      letter-spacing: 3px;
    }

    .night-info {
      font-size: 9px;
      color: #222233;
      letter-spacing: 1px;
    }

    /* MAIN */
    .main-area {
      flex: 1;
      padding: 16px 14px 100px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    /* HEURE */
    .time-display {
      text-align: center;
      padding: 12px 0 4px;
    }

    .time-val {
      font-size: 36px;
      color: #1a1a2e;
      letter-spacing: 6px;
      text-shadow: 0 0 20px #0d0d1a;
    }

    .time-label {
      font-size: 8px;
      color: #111122;
      letter-spacing: 3px;
      margin-top: 4px;
    }

    /* BILAN JOURNÉE */
    .bilan-section {
      background: #080810;
      border: 1px solid #0f0f20;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .bilan-label {
      font-size: 8px;
      color: #222244;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .bilan-ligne {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid #0a0a15;
    }

    .bilan-ligne:last-child { border-bottom: none; }

    .bilan-nom {
      font-size: 10px;
      color: #333355;
      letter-spacing: 1px;
    }

    .bilan-val {
      font-size: 11px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .bilan-val.positif { color: #1a5a3a; }
    .bilan-val.negatif { color: #5a1a1a; }
    .bilan-val.neutre  { color: #222244; }

    /* MESSAGES */
    .messages-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-card {
      border-radius: 8px;
      padding: 12px 14px;
      opacity: 0;
      transform: translateY(8px);
      animation: msgAppear 0.5s ease forwards;
    }

    @keyframes msgAppear {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Jackson */
    .msg-jackson {
      background: #080810;
      border: 1px solid #1a1a30;
      border-left: 3px solid #2a2a50;
    }

    .msg-jackson.tendu {
      border-left-color: #503030;
      background: #0a0808;
    }

    .msg-jackson.furieux {
      border-left-color: #aa3333;
      background: #0f0505;
    }

    /* Corey */
    .msg-corey {
      background: #080810;
      border: 1px solid #1a1a30;
      border-left: 3px solid #ff885530;
    }

    /* Cutter */
    .msg-cutter {
      background: #060612;
      border: 1px solid #1e1e3a;
      border-left: 3px solid #4444aa;
    }

    /* Jessica */
    .msg-jessica {
      background: #08080e;
      border: 1px solid #1a1a2a;
      border-left: 3px solid #aa4488;
    }

    /* Lucious */
    .msg-lucious {
      background: #080a08;
      border: 1px solid #1a1e1a;
      border-left: 3px solid #448844;
    }

    /* Anonyme */
    .msg-anonyme {
      background: #060608;
      border: 1px solid #111118;
      border-left: 3px solid #222233;
    }

    .msg-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .msg-expediteur {
      font-size: 9px;
      letter-spacing: 2px;
      font-weight: bold;
    }

    .msg-heure {
      font-size: 8px;
      color: #1a1a2e;
      letter-spacing: 1px;
    }

    .msg-texte {
      font-size: 11px;
      color: #555577;
      line-height: 1.6;
      font-style: italic;
    }

    .msg-texte.important { color: #7777aa; }
    .msg-texte.urgent    { color: #aa5555; }
    .msg-texte.cutter    { color: #6666aa; }
    .msg-texte.jessica   { color: #aa6688; }
    .msg-texte.lucious   { color: #668866; }

    /* CHOIX DE NUIT */
    .choix-nuit {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .choix-nuit-btn {
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .choix-nuit-btn:active { background: #0f0f22; }

    .choix-nuit-texte {
      font-size: 10px;
      color: #6666aa;
      letter-spacing: 1px;
    }

    .choix-nuit-effet {
      font-size: 8px;
      color: #333355;
      letter-spacing: 1px;
    }

    /* JACKSON COLLECTE */
    .collecte-zone {
      background: #080810;
      border: 1px solid #1a1a30;
      border-top: 2px solid #2a2a50;
      border-radius: 8px;
      padding: 14px;
      display: none;
    }

    .collecte-zone.visible { display: block; }

    .collecte-label {
      font-size: 9px;
      color: #333355;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .collecte-montant {
      font-size: 28px;
      color: #2a2a50;
      font-weight: bold;
      letter-spacing: 3px;
      margin-bottom: 8px;
    }

    .collecte-detail {
      font-size: 9px;
      color: #222233;
      letter-spacing: 1px;
      margin-bottom: 12px;
      line-height: 1.6;
    }

    .collecte-btn {
      width: 100%;
      background: #080810;
      border: 1px solid #2a2a50;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 10px;
      color: #333355;
      letter-spacing: 2px;
    }

    .collecte-btn:active { background: #0d0d1e; }
    .collecte-btn.manque { border-color: #502a2a; color: #553333; }

    /* SCÈNE JESSICA */
    .scene-card {
      background: #060610;
      border: 1px solid #1a1a2e;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .scene-card.visible { display: block; }

    .scene-header {
      background: #0a0a1a;
      padding: 8px 14px;
      border-bottom: 1px solid #1a1a2e;
      display: flex;
      justify-content: space-between;
    }

    .scene-titre {
      font-size: 9px;
      color: #444466;
      letter-spacing: 2px;
    }

    .scene-num {
      font-size: 8px;
      color: #222233;
      letter-spacing: 1px;
    }

    .scene-body { padding: 14px; }

    .scene-texte {
      font-size: 11px;
      color: #555577;
      line-height: 1.8;
      margin-bottom: 12px;
      font-style: italic;
    }

    .scene-texte em {
      color: #7777aa;
      font-style: normal;
    }

    .scene-choix {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .scene-choix-btn {
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-radius: 6px;
      padding: 10px 12px;
      cursor: pointer;
    }

    .scene-choix-btn:active { background: #0f0f22; }

    .scene-choix-texte {
      font-size: 10px;
      color: #6666aa;
      letter-spacing: 0.5px;
      margin-bottom: 2px;
    }

    .scene-choix-effet {
      font-size: 8px;
      color: #333355;
      letter-spacing: 1px;
    }

    /* BOUTON DORMIR */
    .sleep-btn {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #030306;
      border-top: 1px solid #0d0d1a;
      padding: 14px 16px;
      text-align: center;
      cursor: pointer;
      z-index: 100;
    }

    .sleep-btn:active { background: #050508; }

    .sleep-btn-text {
      font-size: 10px;
      color: #1a1a2e;
      letter-spacing: 4px;
    }

    .notif {
      display: none;
      position: fixed;
      top: 58px; left: 50%;
      transform: translateX(-50%);
      background: #050510;
      border: 1px solid #2a2a50;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 11px;
      color: #555577;
      letter-spacing: 1px;
      z-index: 500;
      text-align: center;
      max-width: 85vw;
      font-family: 'Courier New', monospace;
    }

    .notif.visible {
      display: block;
      animation: notifAnim 2.5s forwards;
    }

    @keyframes notifAnim {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .fade-out { animation: fadeOut 0.8s forwards; }

    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

  </style>
</head>
<body>

  <div class="top-bar">
    <div class="night-title">▓ LA NUIT ▓</div>
    <div class="night-info" id="night-info">—</div>
  </div>

  <div class="main-area" id="main-area">

    <!-- HEURE -->
    <div class="time-display">
      <div class="time-val" id="time-val">23:47</div>
      <div class="time-label">REWIND PARADISE — FERMÉ</div>
    </div>

    <!-- BILAN -->
    <div class="bilan-section" id="bilan-section">
      <div class="bilan-label">BILAN DE LA JOURNÉE</div>
      <div id="bilan-contenu"></div>
    </div>

    <!-- COLLECTE JACKSON -->
    <div class="collecte-zone" id="collecte-zone">
      <div class="collecte-label">COLLECTE — JACKSON</div>
      <div class="collecte-montant" id="collecte-montant">—$</div>
      <div class="collecte-detail" id="collecte-detail">—</div>
      <div class="collecte-btn" id="collecte-btn"
           onclick="payerJackson()">
        REMETTRE LA COLLECTE
      </div>
    </div>

    <!-- SCÈNE JESSICA -->
    <div class="scene-card" id="scene-jessica">
      <div class="scene-header">
        <span class="scene-titre">JESSICA</span>
        <span class="scene-num" id="scene-jessica-num">—</span>
      </div>
      <div class="scene-body">
        <div class="scene-texte" id="scene-jessica-texte">—</div>
        <div class="scene-choix" id="scene-jessica-choix"></div>
      </div>
    </div>

    <!-- SCÈNE LUCIOUS -->
    <div class="scene-card" id="scene-lucious">
      <div class="scene-header">
        <span class="scene-titre">LUCIOUS</span>
        <span class="scene-num" id="scene-lucious-num">—</span>
      </div>
      <div class="scene-body">
        <div class="scene-texte" id="scene-lucious-texte">—</div>
        <div class="scene-choix" id="scene-lucious-choix"></div>
      </div>
    </div>

    <!-- MESSAGES -->
    <div class="messages-section" id="messages-section"></div>

  </div>

  <div class="sleep-btn" onclick="dormirJusquAuMatin()">
    <div class="sleep-btn-text">▽ FERMER LES YEUX ▽</div>
  </div>

  <div class="notif" id="notif"></div>

  <script>

    let gameState = {};

    // ===================================================
    // SCÈNES JESSICA
    // ===================================================

    const SCENES_JESSICA = [
      {
        id: 'jessica_01',
        semaine_min: 1,
        titre: 'La Boîte à Musique',
        texte: `Jessica entre dans un appartement vide. Elle cherche quelque chose de précis. Sur la table de nuit — une boîte à musique en marqueterie. Elle l'ouvre. <em>Une mélodie simple. Deux figurines qui tournent.</em> Elle reste figée. Une image d'enfance. La patinoire de Rockefeller. Son père. Elle referme brusquement. Un bruit dans la serrure.`,
        choix: [
          {
            texte: 'Elle prend la boîte et plonge sous le lit.',
            effet: 'jessica_cache',
            detail: 'Discrétion. Elle attend.',
            impact: (gs) => {
              gs.jessica_boite = true;
              gs.jessica_cache = true;
            }
          },
          {
            texte: 'Elle repose la boîte et sort par la fenêtre.',
            effet: 'jessica_fuite',
            detail: 'Rapide. Mais les mains vides.',
            impact: (gs) => {
              gs.jessica_fuite = true;
            }
          }
        ]
      },
      {
        id: 'jessica_02',
        semaine_min: 2,
        titre: 'L\'Homme au Fauteuil',
        texte: `Sous le lit. Jessica entend l'homme s'installer dans le fauteuil. <em>Ghost commence à la télévision.</em> Elle reconnaît la musique. Pathétique, pense-t-elle. Une crampe lui tire la cuisse. Elle voit ses chaussures — usées, lourdes. Il pose quelque chose sur le guéridon. Une arme.`,
        choix: [
          {
            texte: 'Attendre. Ne pas bouger.',
            effet: 'jessica_attend',
            detail: 'La crampe empire. Mais il repart.',
            impact: (gs) => {
              gs.jessica_patience = (gs.jessica_patience || 0) + 1;
            }
          },
          {
            texte: 'Sortir son .38. Prête.',
            effet: 'jessica_arme',
            detail: 'Risqué. Le téléphone sonne.',
            impact: (gs) => {
              gs.jessica_arme_sortie = true;
            }
          }
        ]
      },
      {
        id: 'jessica_03',
        semaine_min: 2,
        titre: 'Canopi',
        texte: `Le téléphone sonne. L'homme répond. <em>"Canopi."</em> Jessica retient son souffle. Il parle de Lucious. De John Wang. Il raccroche. Bruit d'un manteau, de clés. La porte claque. Jessica reste figée. John est mort. Ce flic enquête. Le monde vient de basculer sous le lit de quelqu'un d'autre.`,
        choix: [
          {
            texte: 'Prendre la boîte et partir immédiatement.',
            effet: 'jessica_part',
            detail: 'Exposition +5. La boîte dans le sac.',
            impact: (gs) => {
              gs.jessica_boite_recuperee = true;
              gs.exposition = Math.min(100, (gs.exposition || 0) + 5);
            }
          },
          {
            texte: 'Attendre encore. Être sûre.',
            effet: 'jessica_prudente',
            detail: 'Légalité -2. Plus sûre.',
            impact: (gs) => {
              gs.legalite = Math.max(0, (gs.legalite || 0) - 2);
              gs.jessica_prudente = true;
            }
          }
        ]
      },
      {
        id: 'jessica_04',
        semaine_min: 3,
        titre: 'La Rousse',
        texte: `Jessica sort de l'appartement. Dans le couloir — une femme. Grande, rousse, cheveux comme une lame. <em>Yeux verts qui scrutent tout.</em> "John ?" demande-t-elle. Jessica improvise. "Il m'a demandé de rapporter ses films." La rousse regarde les cassettes dans ses mains. Puis Jessica. Elle sait. Jessica aussi.`,
        choix: [
          {
            texte: '"On est du même côté je crois."',
            effet: 'jessica_alliance',
            detail: 'Alliance possible. Info sur John.',
            impact: (gs) => {
              gs.jessica_alliance_rousse = true;
              gs.credibilite = Math.min(100, (gs.credibilite || 0) + 3);
            }
          },
          {
            texte: 'Partir sans rien ajouter.',
            effet: 'jessica_esquive',
            detail: 'Discret. Mais une piste perdue.',
            impact: (gs) => {
              gs.jessica_esquive_rousse = true;
            }
          }
        ]
      }
    ];

    // ===================================================
    // SCÈNES LUCIOUS
    // ===================================================

    const SCENES_LUCIOUS = [
      {
        id: 'lucious_01',
        semaine_min: 1,
        titre: 'L\'Appartement de John Wang',
        texte: `Lucious crochète la serrure en quelques secondes. L'appartement sent le renfermé, la naphtaline, l'encens éteint. Vingt mètres carrés. Costumes synthétiques, manuels de chimie, matelas au sol. Une tour de VHS. <em>La cassette dans le magnéto : Les Aventuriers de l'Arche Perdue.</em> Il allume. Il sourit malgré lui.`,
        choix: [
          {
            texte: 'Fouiller méthodiquement.',
            effet: 'lucious_fouille',
            detail: 'Trouve les cassettes de location.',
            impact: (gs) => {
              gs.lucious_cassettes_trouvees = true;
              gs.info_john_wang = true;
            }
          },
          {
            texte: 'Regarder le film d\'abord.',
            effet: 'lucious_film',
            detail: 'Indiana Jones meurt. Micro-métrage.',
            impact: (gs) => {
              gs.lucious_vu_micro = true;
              gs.credibilite = Math.min(100, (gs.credibilite || 0) + 2);
            }
          }
        ]
      },
      {
        id: 'lucious_02',
        semaine_min: 2,
        titre: 'L\'Autel',
        texte: `Près de la fenêtre — un autel bricolé. Statuette de Bouddha. Bâtons d'encens consumés. Des rouleaux de papier ligaturés de fil rouge. Lucious en déplie un. <em>"Que j'arrive à partir de mon boulot."</em> Un autre. <em>"Qu'elle ne me quitte jamais."</em> Prières de survie griffonnées à l'encre pâle. John Wang priait pour des choses simples.`,
        choix: [
          {
            texte: 'Prendre les rouleaux comme preuve.',
            effet: 'lucious_rouleaux',
            detail: 'Info sur John. Piste vers la pépinière.',
            impact: (gs) => {
              gs.lucious_rouleaux = true;
              gs.info_pepiniere = true;
            }
          },
          {
            texte: 'Les laisser. Ce sont des prières.',
            effet: 'lucious_respect',
            detail: 'Rien de concret. Mais quelque chose d\'autre.',
            impact: (gs) => {
              gs.lucious_respect = true;
            }
          }
        ]
      },
      {
        id: 'lucious_03',
        semaine_min: 2,
        titre: 'Blasphème',
        texte: `À l'écran — la boule de pierre dévale. Lucious regarde malgré lui. Elle se rapproche. Indiana Jones court. <em>Écran noir brutal. KRUNCH. Froissement de chair.</em> Il reste bouche bée. Quelqu'un a osé modifier Les Aventuriers de l'Arche Perdue. Indiana Jones est mort. C'est une cassette noire. Un micro-métrage.`,
        choix: [
          {
            texte: 'Emporter la cassette.',
            effet: 'lucious_cassette_noire',
            detail: 'Piste vers le Rewind Paradise.',
            impact: (gs) => {
              gs.lucious_cassette_noire = true;
              gs.exposition = Math.min(100, (gs.exposition || 0) + 8);
            }
          },
          {
            texte: 'La laisser. Trop compromettant.',
            effet: 'lucious_laisse',
            detail: 'Légalité -3. Prudent.',
            impact: (gs) => {
              gs.legalite = Math.max(0, (gs.legalite || 0) - 3);
            }
          }
        ]
      },
      {
        id: 'lucious_04',
        semaine_min: 3,
        titre: 'Le Vidéoclub',
        texte: `Lucious entre dans le Rewind Paradise. L'odeur — plastique chauffé, dépoussiérant, marijuana mal dissimulée. Il dépose deux cassettes sur le comptoir. L'employé derrière est avachi sur un tabouret. <em>Une doudoune bleue. Une coupe au bol indisciplinée.</em> Lucious attend. L'homme lève les yeux. "Ah !"`,
        choix: [
          {
            texte: '"Ces cassettes viennent de l\'appartement de John Wang."',
            effet: 'lucious_confronte',
            detail: 'Confrontation directe. Exposition +10.',
            impact: (gs) => {
              gs.lucious_confronte_rewind = true;
              gs.exposition = Math.min(100, (gs.exposition || 0) + 10);
            }
          },
          {
            texte: 'Observer d\'abord. Ne rien dire.',
            effet: 'lucious_observe',
            detail: 'Info sur le vidéoclub. Discret.',
            impact: (gs) => {
              gs.lucious_observe_rewind = true;
              gs.info_dimaggio = (gs.info_dimaggio || 0) + 1;
            }
          }
        ]
      }
    ];

    // ===================================================
    // MESSAGES JACKSON
    // ===================================================

    function getMessageJackson(gs) {
      const semaine = gs.semaine || 1;
      const humeur  = gs.jacksonHumeur || 'cool';
      const note    = gs.currentNote || 5;
      const discretion = gs.discretion || 0;
      const estMercredi = ((gs.jour - 1) % 7) === 2;

      let msg = '';
      let classe = 'msg-jackson';

      if (estMercredi) {
        // Jour de collecte
        const montant = getCollecteMontant(gs);
        msg = `Mercredi. Je passe ce soir. ${montant}$ comme convenu.`;
        classe = 'msg-jackson';
      } else if (humeur === 'furieux' || discretion >= 70) {
        msg = getMessageFurieux(gs);
        classe = 'msg-jackson furieux';
      } else if (humeur === 'tendu' || discretion >= 50) {
        msg = getMessageTendu(gs);
        classe = 'msg-jackson tendu';
      } else {
        msg = getMessageCool(gs);
        classe = 'msg-jackson';
      }

      return { msg, classe };
    }

    function getCollecteMontant(gs) {
      const base = 80;
      const bonus = Math.floor((gs.credibilite || 0) / 20) * 10;
      return base + bonus;
    }

    function getMessageCool(gs) {
      const msgs = [
        "Les affaires continuent. C'est bien.",
        "T'as fait quoi ce soir ? Je veux pas savoir. Continue.",
        "Le vidéoclub tourne. Garde ça comme ça.",
        "Certaines personnes posent des questions. Réponds pas.",
        "Je t'ai dit de rien faire d'inhabituel. T'as écouté. Bien."
      ];
      let msg = msgs[Math.floor(Math.random() * msgs.length)];

      // Mention DiMaggio dès S3
      if (gs.semaine >= 3 && Math.random() > 0.5) {
        const dimaggio = [
          "DiMaggio a demandé si le Rewind Paradise était fiable. J'ai dit oui.",
          "DiMaggio sait que t'existes. C'est pas encore un problème.",
          "M. DiMaggio voudrait te rencontrer. Pas encore une invitation officielle."
        ];
        msg += ' ' + dimaggio[Math.floor(Math.random() * dimaggio.length)];
      }

      return msg;
    }

    function getMessageTendu(gs) {
      const msgs = [
        "Fais profil bas cette semaine. Je dis pas pourquoi.",
        "DiMaggio a entendu des choses. Je te dis ça pour que tu saches.",
        "Le type en costume qui vient — laisse-le faire. Il fait partie des meubles.",
        "J'ai eu des questions sur le Rewind Paradise. J'ai rien dit.",
        "Reste tranquille. Pour l'instant."
      ];
      return msgs[Math.floor(Math.random() * msgs.length)];
    }

    function getMessageFurieux(gs) {
      const msgs = [
        "T'as un problème Fred. Et c'est mon problème aussi.",
        "Le Rewind Paradise peut fermer aussi vite qu'il a ouvert.",
        "DiMaggio est pas content. Moi non plus.",
        "Dernière chance. Je dis ça rarement.",
        "J'attends une explication. Courte. Claire."
      ];
      return msgs[Math.floor(Math.random() * msgs.length)];
    }

    // ===================================================
    // MESSAGE COREY
    // ===================================================

    function getMessageCorey(gs) {
      const note = gs.currentNote || 5;
      const semaine = gs.semaine || 1;

      if (note >= 9) {
        return "Je savais que t'avais ça en toi. Repose-toi.";
      } else if (note >= 7) {
        return "Bonne coupe ce soir. Cutter va remarquer.";
      } else if (note >= 5) {
        return "Correct. La prochaine fois va plus loin.";
      } else if (note >= 3) {
        return "C'était pas ça. On recommence demain.";
      } else {
        return "Non. Juste... non. Dors.";
      }
    }

    // ===================================================
    // MESSAGE CUTTER
    // ===================================================

    function getMessageCutter(gs) {
      const note      = gs.currentNote || 5;
      const cassette  = gs.derniereCassette || '';
      const semaine   = gs.semaine || 1;

      if (semaine < 2) return null;
      if (Math.random() > 0.4) return null; // Pas toujours

      const citations = [
        "Un micro-métrage c'est pas résumer un film. C'est trouver le moment où le film n'a plus besoin de continuer.",
        "La bascule c'est pas un moment. C'est une décision.",
        "Couper trop tôt c'est de la lâcheté déguisée en minimalisme.",
        "Couper trop tard c'est vouloir expliquer. Le cinéma n'explique pas.",
        "Le meilleur micro-métrage que j'ai vu cette année. Je donne pas le nom. Pas encore.",
        "Quelqu'un dans ce quartier fait du cinéma sans le savoir. Ou en le sachant très bien.",
        "Un bon micro-métrage ne change pas la fin. Il révèle que le début était déjà foutu.",
        "Je ne comprends pas encore pourquoi cette coupe fonctionne. Mais elle fonctionne. Je déteste ça."
      ];

      return citations[Math.floor(Math.random() * citations.length)];
    }

    // ===================================================
    // INIT
    // ===================================================

    window.onload = function() {
      const save = localStorage.getItem('rewindParadise_save');
      if (!save) { window.location.href = 'index.html'; return; }
      gameState = JSON.parse(save);

      updateNightInfo();
      afficherBilan();
      afficherMessages();
      afficherScenes();
      afficherCollecte();
    };

    // ===================================================
    // BILAN
    // ===================================================

    function afficherBilan() {
      const gs  = gameState;
      const note = gs.currentNote || 0;

      const lignes = [
        {
          nom: 'CAISSE',
          val: gs.argent + '$',
          classe: gs.argent >= 200 ? 'positif'
                : gs.argent >= 80  ? 'neutre'
                : 'negatif'
        },
        {
          nom: 'NOTE CUTTER',
          val: note > 0 ? note + '/10' : '—',
          classe: note >= 7 ? 'positif'
                : note >= 4 ? 'neutre'
                : 'negatif'
        },
        {
          nom: 'LÉGALITÉ',
          val: gs.legalite + '%',
          classe: gs.legalite < 30 ? 'positif'
                : gs.legalite < 60 ? 'neutre'
                : 'negatif'
        },
        {
          nom: 'EXPOSITION',
          val: gs.exposition + '%',
          classe: gs.exposition < 30 ? 'positif'
                : gs.exposition < 60 ? 'neutre'
                : 'negatif'
        },
        {
          nom: 'DISCRÉTION',
          val: gs.discretion + '%',
          classe: gs.discretion < 40 ? 'positif'
                : gs.discretion < 70 ? 'neutre'
                : 'negatif'
        },
        {
          nom: 'RÉPUTATION',
          val: '★'.repeat(Math.round(gs.reputation || 0)),
          classe: gs.reputation >= 3 ? 'positif'
                : gs.reputation >= 2 ? 'neutre'
                : 'negatif'
        }
      ];

      document.getElementById('bilan-contenu').innerHTML =
        lignes.map(l => `
          <div class="bilan-ligne">
            <span class="bilan-nom">${l.nom}</span>
            <span class="bilan-val ${l.classe}">${l.val}</span>
          </div>
        `).join('');
    }

    // ===================================================
    // COLLECTE JACKSON
    // ===================================================

    function afficherCollecte() {
      const gs = gameState;
      const estMercredi = ((gs.jour - 1) % 7) === 2;
      if (!estMercredi) return;

      const montant = getCollecteMontant(gs);
      const zone    = document.getElementById('collecte-zone');
      const btn     = document.getElementById('collecte-btn');

      document.getElementById('collecte-montant').textContent =
        montant + '$';

      if (gs.argent >= montant) {
        document.getElementById('collecte-detail').textContent =
          'Jackson passe ce soir. La somme est prête.';
        btn.className = 'collecte-btn';
        btn.textContent = 'REMETTRE LA COLLECTE';
      } else {
        document.getElementById('collecte-detail').textContent =
          `Il manque ${montant - gs.argent}$. Jackson va pas apprécier.`;
        btn.className = 'collecte-btn manque';
        btn.textContent = 'REMETTRE CE QU\'ON A';
      }

      zone.classList.add('visible');
    }

    function payerJackson() {
      const gs      = gameState;
      const montant = getCollecteMontant(gs);

      if (gs.argent >= montant) {
        gs.argent -= montant;
        gs.jacksonHumeur = 'cool';
        showNotif('Collecte remise. Jackson repart sans un mot.');
      } else {
        const paye = gs.argent;
        gs.argent  = 0;
        gs.jacksonHumeur = 'tendu';
        gs.legalite = Math.min(100, gs.legalite + 5);
        showNotif(
          `${paye}$ remis. Il manquait ${montant - paye}$. Jackson est pas content.`
        );
      }

      document.getElementById('collecte-zone').classList.remove('visible');
      saveGame();
    }

    // ===================================================
    // MESSAGES
    // ===================================================

    function afficherMessages() {
      const gs       = gameState;
      const section  = document.getElementById('messages-section');
      const messages = [];
      let delay      = 0;

      // Jackson
      const jackson = getMessageJackson(gs);
      messages.push({
        expediteur: 'JACKSON',
        heure:      '23:' + String(Math.floor(Math.random()*30)+15).padStart(2,'0'),
        texte:      jackson.msg,
        classe:     jackson.classe,
        important:  gs.jacksonHumeur !== 'cool'
      });

      // Corey
      messages.push({
        expediteur: 'COREY',
        heure:      '23:' + String(Math.floor(Math.random()*20)+40).padStart(2,'0'),
        texte:      getMessageCorey(gs),
        classe:     'msg-corey',
        important:  false
      });

      // Cutter (conditionnel)
      const cutter = getMessageCutter(gs);
      if (cutter) {
        messages.push({
          expediteur: 'CELLULOÏD SCALPEL',
          heure:      '00:' + String(Math.floor(Math.random()*59)).padStart(2,'0'),
          texte:      cutter,
          classe:     'msg-cutter',
          important:  true,
          isCutter:   true
        });
      }

      // Message anonyme si discrétion haute
      if (gs.discretion >= 50) {
        messages.push({
          expediteur: '— ANONYME —',
          heure:      '01:' + String(Math.floor(Math.random()*59)).padStart(2,'0'),
          texte:      'Faites attention. Quelqu\'un pose des questions.',
          classe:     'msg-anonyme',
          important:  true
        });
      }

      // Message DiMaggio indirect (S3+)
      if (gs.semaine >= 3 && gs.ultimatum_dimaggio) {
        messages.push({
          expediteur: 'NUMÉRO INCONNU',
          heure:      '02:13',
          texte:      'M. DiMaggio vous attend. C\'est pas une suggestion.',
          classe:     'msg-anonyme',
          important:  true
        });
      }

      // Afficher avec délai
      section.innerHTML = '';
      messages.forEach((msg, i) => {
        setTimeout(() => {
          const card = document.createElement('div');
          card.className = `message-card ${msg.classe}`;
          card.style.animationDelay = '0s';

          const couleurExp =
            msg.classe.includes('jackson')  ? '#2a2a50' :
            msg.classe.includes('corey')    ? '#ff885560' :
            msg.classe.includes('cutter')   ? '#4444aa' :
            msg.classe.includes('jessica')  ? '#aa4488' :
            msg.classe.includes('lucious')  ? '#448844' :
                                              '#222233';

          const classeTexte =
            msg.important     ? 'important' :
            msg.isCutter      ? 'cutter'    :
            msg.classe.includes('furieux') ? 'urgent' : '';

          card.innerHTML = `
            <div class="msg-header">
              <span class="msg-expediteur"
                    style="color:${couleurExp}">
                ${msg.expediteur}
              </span>
              <span class="msg-heure">${msg.heure}</span>
            </div>
            <div class="msg-texte ${classeTexte}">
              "${msg.texte}"
            </div>
          `;

          section.appendChild(card);
        }, delay);
        delay += 400;
      });
    }

    // ===================================================
    // SCÈNES JESSICA + LUCIOUS
    // ===================================================

    function afficherScenes() {
      const gs = gameState;

      // Jessica — prochaine scène non vue
      const sceneJessica = SCENES_JESSICA.find(s =>
        s.semaine_min <= gs.semaine &&
        !gs['scene_' + s.id + '_vue']
      );

      if (sceneJessica && Math.random() > 0.4) {
        afficherSceneJessica(sceneJessica);
      }

      // Lucious — prochaine scène non vue
      const sceneLucious = SCENES_LUCIOUS.find(s =>
        s.semaine_min <= gs.semaine &&
        !gs['scene_' + s.id + '_vue']
      );

      if (sceneLucious && Math.random() > 0.4) {
        setTimeout(() => afficherSceneLucious(sceneLucious), 600);
      }
    }

    function afficherSceneJessica(scene) {
      const card = document.getElementById('scene-jessica');
      document.getElementById('scene-jessica-num').textContent =
        scene.titre;
      document.getElementById('scene-jessica-texte').innerHTML =
        scene.texte;

      const choixEl = document.getElementById('scene-jessica-choix');
      choixEl.innerHTML = scene.choix.map((c, i) => `
        <div class="scene-choix-btn"
             onclick="resoudreJessica(${i})">
          <div class="scene-choix-texte">▶ ${c.texte}</div>
          <div class="scene-choix-effet">${c.detail}</div>
        </div>
      `).join('');

      card.classList.add('visible');
      window.sceneJessicaCourante = scene;
    }

    function resoudreJessica(index) {
      const scene = window.sceneJessicaCourante;
      if (!scene) return;

      scene.choix[index].impact(gameState);
      gameState['scene_' + scene.id + '_vue'] = true;

      document.getElementById('scene-jessica').classList.remove('visible');
      showNotif('Jessica — ' + scene.choix[index].effet);
      saveGame();
    }

    function afficherSceneLucious(scene) {
      const card = document.getElementById('scene-lucious');
      document.getElementById('scene-lucious-num').textContent =
        scene.titre;
      document.getElementById('scene-lucious-texte').innerHTML =
        scene.texte;

      const choixEl = document.getElementById('scene-lucious-choix');
      choixEl.innerHTML = scene.choix.map((c, i) => `
        <div class="scene-choix-btn"
             onclick="resoudreLucious(${i})">
          <div class="scene-choix-texte">▶ ${c.texte}</div>
          <div class="scene-choix-effet">${c.detail}</div>
        </div>
      `).join('');

      card.classList.add('visible');
      window.sceneLuciousCourante = scene;
    }

    function resoudreLucious(index) {
      const scene = window.sceneLuciousCourante;
      if (!scene) return;

      scene.choix[index].impact(gameState);
      gameState['scene_' + scene.id + '_vue'] = true;

      document.getElementById('scene-lucious').classList.remove('visible');
      showNotif('Lucious — ' + scene.choix[index].effet);
      saveGame();
    }

    // ===================================================
    // DORMIR
    // ===================================================

    function dormirJusquAuMatin() {
      const gs = gameState;

      // Avancer le jour
      gs.jour++;

      // Semaine
      if (gs.jour > 1 && (gs.jour - 1) % 7 === 0) {
        gs.semaine++;
      }

      // Récupération énergie
      const bonusNote = gs.energieBonusTomorrow || 0;
      gs.energie = Math.min(
        gs.energieMax || 15,
        (gs.energieMax || 15) * 0.7 + bonusNote
      );
      gs.energieBonusTomorrow = 0;

      // Réinitialiser phase journée
      gs.phase_journee = 'matin';

      // Discrétion redescend légèrement la nuit
      gs.discretion = Math.max(0, (gs.discretion || 0) - 5);

      // Vérifier fin du jeu
      if (gs.semaine > 4) {
        saveGame();
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = 'ending.html';
        }, 800);
        return;
      }

      // Legalité monte légèrement si micro-métrages distribués
      if ((gs.noires_distribuees || 0) > 3) {
        gs.legalite = Math.min(100, gs.legalite + 2);
      }

      saveGame();

      document.body.classList.add('fade-out');
      setTimeout(() => {
        window.location.href = 'game.html';
      }, 800);
    }

    // ===================================================
    // UTILITAIRES
    // ===================================================

    function updateNightInfo() {
      document.getElementById('night-info').textContent =
        `Nuit — Jour ${gameState.jour}`;

      // Heure aléatoire entre 23h et 2h
      const h = Math.random() > 0.5
        ? '23:' + String(Math.floor(Math.random()*59)).padStart(2,'0')
        : '0' + Math.floor(Math.random()*3) + ':' + String(Math.floor(Math.random()*59)).padStart(2,'0');
      document.getElementById('time-val').textContent = h;
    }

    function showNotif(message) {
      const notif = document.getElementById('notif');
      notif.textContent = message;
      notif.classList.add('visible');
      setTimeout(() => notif.classList.remove('visible'), 2500);
    }

    function saveGame() {
      localStorage.setItem(
        'rewindParadise_save',
        JSON.stringify(gameState)
      );
    }

  </script>

</body>
