<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, 
        initial-scale=1.0, maximum-scale=1.0, 
        user-scalable=no">
  <title>Rewind Paradise — La Nuit</title>
  <link rel="stylesheet" href="data/style.css">
  <script src="data/dialogues.js"></script>
  <style>

    * { box-sizing: border-box; }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: #030306;
      font-family: 'Courier New', monospace;
      color: #f0f0ff;
      overflow-x: hidden;
    }

    /* TOP */
    .top-bar {
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1a1a2e;
      background: #060610;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .night-title {
      font-size: 10px;
      color: #4444aa;
      letter-spacing: 3px;
    }

    .night-info {
      font-size: 9px;
      color: #333366;
      letter-spacing: 1px;
    }

    .top-bar-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .mute-btn {
      font-size: 16px;
      cursor: pointer;
      opacity: 0.6;
    }

    .mute-btn:active { opacity: 1; }

    /* MAIN */
    .main-area {
      flex: 1;
      padding: 12px 14px 100px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* HEURE */
    .time-display {
      text-align: center;
      padding: 10px 0 4px;
    }

    .time-val {
      font-size: 42px;
      color: #1e1e3a;
      letter-spacing: 8px;
      font-weight: bold;
      text-shadow: 0 0 30px #0a0a20;
    }

    .time-label {
      font-size: 8px;
      color: #1a1a30;
      letter-spacing: 3px;
      margin-top: 4px;
    }

    /* BILAN */
    .bilan-section {
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-radius: 8px;
      padding: 14px 16px;
    }

    .bilan-label {
      font-size: 8px;
      color: #3a3a6a;
      letter-spacing: 3px;
      margin-bottom: 12px;
    }

    .bilan-ligne {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid #0f0f1e;
    }

    .bilan-ligne:last-child { border-bottom: none; }
    .bilan-nom { font-size: 10px; color: #555577; letter-spacing: 1px; }
    .bilan-val { font-size: 12px; font-weight: bold; letter-spacing: 1px; }
    .bilan-val.positif { color: #00ffc8; }
    .bilan-val.negatif { color: #ff4466; }
    .bilan-val.neutre  { color: #4444aa; }
    .bilan-val.warning { color: #ff8855; }

    /* COLLECTE JACKSON */
    .collecte-zone {
      background: #080814;
      border: 1px solid #1e1e3a;
      border-top: 2px solid #3a3a6a;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .collecte-zone.visible { display: block; }

    .collecte-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid #1a1a2e;
      background: #0a0a1a;
    }

    .jackson-avatar {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #3a3a6a40;
      background: #0a0a18;
      flex-shrink: 0;
    }

    .collecte-info { flex: 1; }
    .collecte-label { font-size: 9px; color: #3a3a6a; letter-spacing: 3px; margin-bottom: 4px; }
    .collecte-montant { font-size: 26px; color: #4444aa; font-weight: bold; letter-spacing: 3px; }

    .collecte-body { padding: 12px 14px; }

    .collecte-detail {
      font-size: 10px;
      color: #444466;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      line-height: 1.7;
      font-style: italic;
    }

    .collecte-btn {
      width: 100%;
      background: #080814;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 10px;
      color: #4444aa;
      letter-spacing: 2px;
      font-family: 'Courier New', monospace;
    }

    .collecte-btn:active { background: #0d0d1e; }
    .collecte-btn.manque { border-color: #6a2a2a; color: #664444; }

    /* MESSAGES */
    .messages-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .message-card {
      border-radius: 8px;
      overflow: hidden;
      opacity: 0;
      transform: translateY(8px);
      animation: msgAppear 0.5s ease forwards;
    }

    @keyframes msgAppear {
      to { opacity: 1; transform: translateY(0); }
    }

    .msg-header-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px 8px;
    }

    .msg-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #0a0a18;
      border: 1px solid #1e1e3a;
    }

    .msg-header-info { flex: 1; }

    .msg-expediteur {
      font-size: 10px;
      letter-spacing: 2px;
      font-weight: bold;
      display: block;
      margin-bottom: 2px;
    }

    .msg-heure {
      font-size: 8px;
      color: #222233;
      letter-spacing: 1px;
    }

    .msg-texte {
      font-size: 11px;
      color: #666688;
      line-height: 1.8;
      font-style: italic;
      padding: 0 14px 14px;
    }

    .msg-texte.important { color: #7777aa; }
    .msg-texte.urgent    { color: #886655; }

    .msg-jackson {
      background: #080814;
      border: 1px solid #1e1e3a;
      border-left: 3px solid #2a2a50;
    }

    .msg-jackson.tendu   { border-left-color: #503020; background: #080810; }
    .msg-jackson.furieux { border-left-color: #662222; background: #0a0808; }

    .msg-corey {
      background: #0a0a18;
      border: 1px solid #1e1e3a;
      border-left: 3px solid #ff885525;
    }

    .msg-cutter {
      background: #080818;
      border: 1px solid #1e1e3a;
      border-left: 3px solid #4444aa40;
    }

    .msg-anonyme {
      background: #060610;
      border: 1px solid #111122;
      border-left: 3px solid #111133;
    }

    /* FANZINE */
    .fanzine-card {
      background: #080818;
      border: 1px solid #1e1e3a;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .fanzine-card.visible { display: block; }

    .fanzine-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #1a1a2e;
      background: #0a0a1e;
    }

    .fanzine-cover {
      width: 48px;
      height: 48px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid #2e2e50;
      background: #0a0a18;
      flex-shrink: 0;
    }

    .fanzine-titre {
      font-size: 11px;
      color: #5555aa;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .fanzine-num {
      font-size: 8px;
      color: #333355;
      letter-spacing: 1px;
    }

    .fanzine-citation {
      padding: 14px;
      font-size: 11px;
      color: #555577;
      font-style: italic;
      line-height: 1.8;
    }

    /* SCÈNES */
    .scene-card {
      background: #080818;
      border: 1px solid #1e1e3a;
      border-radius: 8px;
      overflow: hidden;
      display: none;
    }

    .scene-card.visible {
      display: block;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .scene-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid #1a1a2e;
      background: #0a0a1e;
    }

    .scene-perso-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #aa448840;
      background: #0a0a18;
      flex-shrink: 0;
    }

    .scene-perso-avatar.lucious { border-color: #44884440; }

    .scene-header-info { flex: 1; }

    .scene-titre {
      font-size: 11px;
      color: #5555aa;
      letter-spacing: 2px;
      margin-bottom: 2px;
    }

    .scene-num {
      font-size: 9px;
      color: #333355;
      letter-spacing: 1px;
      font-style: italic;
    }

    .scene-body { padding: 14px; }

    .scene-texte {
      font-size: 11px;
      color: #7070aa;
      line-height: 1.9;
      margin-bottom: 16px;
      font-style: italic;
    }

    .scene-texte em {
      color: #8888bb;
      font-style: normal;
      font-weight: bold;
    }

    .scene-choix {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .scene-choix-btn {
      background: #0f0f22;
      border: 1px solid #2e2e50;
      border-radius: 6px;
      padding: 12px 14px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .scene-choix-btn:active { background: #141430; border-color: #4444aa; }

    .scene-choix-texte {
      font-size: 11px;
      color: #7777aa;
      letter-spacing: 0.5px;
      margin-bottom: 3px;
    }

    .scene-choix-effet {
      font-size: 8px;
      color: #333355;
      letter-spacing: 1px;
    }

    /* DORMIR */
    .sleep-btn {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, #030306 40%);
      padding: 20px 16px 16px;
      text-align: center;
      cursor: pointer;
      z-index: 100;
    }

    .sleep-btn-inner {
      background: #080814;
      border: 1px solid #1e1e3a;
      border-radius: 8px;
      padding: 14px;
    }

    .sleep-btn-inner:active { background: #0d0d1e; }

    .sleep-btn-text {
      font-size: 10px;
      color: #2a2a50;
      letter-spacing: 4px;
    }

    /* NOTIF */
    .notif {
      display: none;
      position: fixed;
      top: 58px; left: 50%;
      transform: translateX(-50%);
      background: #080818;
      border: 1px solid #3a3a6a;
      border-radius: 6px;
      padding: 10px 18px;
      font-size: 11px;
      color: #7777aa;
      letter-spacing: 1px;
      z-index: 500;
      text-align: center;
      max-width: 85vw;
      font-family: 'Courier New', monospace;
    }

    .notif.visible {
      display: block;
      animation: notifAnim 2.5s forwards;
    }

    @keyframes notifAnim {
      0%   { opacity: 0; }
      12%  { opacity: 1; }
      75%  { opacity: 1; }
      100% { opacity: 0; }
    }

    .fade-out { animation: fadeOut 0.8s forwards; }

    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

  </style>
</head>
<body>

  <div class="top-bar">
    <div class="night-title">▓ LA NUIT ▓</div>
    <div class="top-bar-right">
      <div class="night-info" id="night-info">—</div>
      <div class="mute-btn" id="mute-btn" onclick="toggleMute()">🔊</div>
    </div>
  </div>

  <div class="main-area">

    <div class="time-display">
      <div class="time-val" id="time-val">23:47</div>
      <div class="time-label">REWIND PARADISE — FERMÉ</div>
    </div>

    <!-- BILAN -->
    <div class="bilan-section">
      <div class="bilan-label">BILAN DE LA JOURNÉE</div>
      <div id="bilan-contenu"></div>
    </div>

    <!-- COLLECTE JACKSON -->
    <div class="collecte-zone" id="collecte-zone">
      <div class="collecte-header">
        <img class="jackson-avatar"
             src="posters/jackson.png" alt="Jackson"
             onerror="this.style.display='none'">
        <div class="collecte-info">
          <div class="collecte-label">COLLECTE — JACKSON</div>
          <div class="collecte-montant" id="collecte-montant">—$</div>
        </div>
      </div>
      <div class="collecte-body">
        <div class="collecte-detail" id="collecte-detail">—</div>
        <div class="collecte-btn" id="collecte-btn"
             onclick="payerJackson()">
          REMETTRE LA COLLECTE
        </div>
      </div>
    </div>

    <!-- FANZINE CUTTER -->
    <div class="fanzine-card" id="fanzine-card">
      <div class="fanzine-header">
        <img class="fanzine-cover"
             src="posters/cuter_magazine.png"
             alt="Celluloïd Scalpel"
             onerror="this.style.display='none'">
        <div>
          <div class="fanzine-titre">CELLULOÏD SCALPEL</div>
          <div class="fanzine-num" id="fanzine-num">—</div>
        </div>
      </div>
      <div class="fanzine-citation" id="fanzine-citation">—</div>
    </div>

    <!-- SCÈNE JESSICA -->
    <div class="scene-card" id="scene-jessica">
      <div class="scene-header">
        <img class="scene-perso-avatar"
             src="posters/inconnu.png"
             alt="Jessica"
             onerror="this.src='posters/joie.png'">
        <div class="scene-header-info">
          <div class="scene-titre">JESSICA</div>
          <div class="scene-num" id="scene-jessica-num">—</div>
        </div>
      </div>
      <div class="scene-body">
        <div class="scene-texte" id="scene-jessica-texte">—</div>
        <div class="scene-choix" id="scene-jessica-choix"></div>
      </div>
    </div>

    <!-- SCÈNE LUCIOUS -->
    <div class="scene-card" id="scene-lucious">
      <div class="scene-header">
        <img class="scene-perso-avatar lucious"
             src="posters/inconnu.png"
             alt="Lucious"
             onerror="this.src='posters/joie.png'">
        <div class="scene-header-info">
          <div class="scene-titre">LUCIOUS</div>
          <div class="scene-num" id="scene-lucious-num">—</div>
        </div>
      </div>
      <div class="scene-body">
        <div class="scene-texte" id="scene-lucious-texte">—</div>
        <div class="scene-choix" id="scene-lucious-choix"></div>
      </div>
    </div>

    <!-- MESSAGES -->
    <div class="messages-section" id="messages-section"></div>

  </div>

  <!-- DORMIR -->
  <div class="sleep-btn" onclick="dormirJusquAuMatin()">
    <div class="sleep-btn-inner">
      <div class="sleep-btn-text">▽ FERMER LES YEUX ▽</div>
    </div>
  </div>

  <div class="notif" id="notif"></div>

  <!-- AUDIO -->
  <audio id="bg-music" loop>
    <source src="music/night.mp3" type="audio/mpeg">
  </audio>

  <script>

    let gameState = {};
    let music     = null;
    let isMuted   = false;

    // ===================================================
    // MUSIQUE
    // ===================================================

    function initMusic() {
      music   = document.getElementById('bg-music');
      isMuted = localStorage.getItem('rewind_muted') === 'true';

      music.volume = 0.25;

      if (isMuted) {
        music.muted = true;
        document.getElementById('mute-btn').textContent = '🔇';
      } else {
        music.muted = false;
        document.getElementById('mute-btn').textContent = '🔊';
      }

      // Autoplay avec fallback
      const playPromise = music.play();
      if (playPromise !== undefined) {
        playPromise.catch(() => {
          // Autoplay bloqué — attendre interaction
          document.addEventListener('touchstart', () => {
            music.play();
          }, { once: true });
        });
      }
    }

    function toggleMute() {
      isMuted = !isMuted;
      if (music) music.muted = isMuted;
      localStorage.setItem('rewind_muted', isMuted);
      document.getElementById('mute-btn').textContent =
        isMuted ? '🔇' : '🔊';
    }

    function fadeOutMusic(callback) {
      if (!music || isMuted) { if (callback) callback(); return; }
      let vol = music.volume;
      const fade = setInterval(() => {
        vol = Math.max(0, vol - 0.05);
        music.volume = vol;
        if (vol <= 0) {
          clearInterval(fade);
          music.pause();
          if (callback) callback();
        }
      }, 50);
    }

    // ===================================================
    // SCÈNES JESSICA
    // ===================================================

    const SCENES_JESSICA = [
      {
        id: 'jessica_01',
        semaine_min: 1,
        titre: 'La Boîte à Musique',
        texte: `Jessica entre dans un appartement vide. Elle cherche quelque chose de précis. Sur la table de nuit — une boîte à musique en marqueterie. Elle l'ouvre. <em>Une mélodie simple. Deux figurines qui tournent.</em> Elle reste figée. Une image d'enfance. La patinoire de Rockefeller. Son père. Elle referme brusquement. Un bruit dans la serrure.`,
        choix: [
          {
            texte: 'Elle prend la boîte et plonge sous le lit.',
            effet: 'jessica_cache',
            detail: 'Discrétion. Elle attend.',
            impact: (gs) => {
              gs.jessica_boite = true;
              gs.jessica_cache = true;
            }
          },
          {
            texte: 'Elle repose la boîte et sort par la fenêtre.',
            effet: 'jessica_fuite',
            detail: 'Rapide. Mais les mains vides.',
            impact: (gs) => { gs.jessica_fuite = true; }
          }
        ]
      },
      {
        id: 'jessica_02',
        semaine_min: 2,
        titre: 'L\'Homme au Fauteuil',
        texte: `Sous le lit. Jessica entend l'homme s'installer dans le fauteuil. <em>Ghost commence à la télévision.</em> Elle reconnaît la musique. Pathétique, pense-t-elle. Une crampe lui tire la cuisse. Elle voit ses chaussures — usées, lourdes. Il pose quelque chose sur le guéridon. Une arme.`,
        choix: [
          {
            texte: 'Attendre. Ne pas bouger.',
            effet: 'jessica_attend',
            detail: 'La crampe empire. Mais il repart.',
            impact: (gs) => {
              gs.jessica_patience = (gs.jessica_patience || 0) + 1;
            }
          },
          {
            texte: 'Sortir son .38. Prête.',
            effet: 'jessica_arme',
            detail: 'Risqué. Le téléphone sonne.',
            impact: (gs) => { gs.jessica_arme_sortie = true; }
          }
        ]
      },
      {
        id: 'jessica_03',
        semaine_min: 2,
        titre: 'Canopi',
        texte: `Le téléphone sonne. L'homme répond. <em>"Canopi."</em> Jessica retient son souffle. Il parle de Lucious. De John Wang. Il raccroche. Bruit d'un manteau, de clés. La porte claque. Jessica reste figée. John est mort. Ce flic enquête. Le monde vient de basculer sous le lit de quelqu'un d'autre.`,
        choix: [
          {
            texte: 'Prendre la boîte et partir immédiatement.',
            effet: 'jessica_part',
            detail: 'Exposition +5. La boîte dans le sac.',
            impact: (gs) => {
              gs.jessica_boite_recuperee = true;
              gs.exposition = Math.min(100, (gs.exposition || 0) + 5);
            }
          },
          {
            texte: 'Attendre encore. Être sûre.',
            effet: 'jessica_prudente',
            detail: 'Légalité -2. Plus sûre.',
            impact: (gs) => {
              gs.legalite = Math.max(0, (gs.legalite || 0) - 2);
              gs.jessica_prudente = true;
            }
          }
        ]
      },
      {
        id: 'jessica_04',
        semaine_min: 3,
        titre: 'La Rousse',
        texte: `Jessica sort de l'appartement. Dans le couloir — une femme. Grande, rousse, cheveux comme une lame. <em>Yeux verts qui scrutent tout.</em> "John ?" demande-t-elle. Jessica improvise. "Il m'a demandé de rapporter ses films." La rousse regarde les cassettes dans ses mains. Puis Jessica. Elle sait. Jessica aussi.`,
        choix: [
          {
            texte: '"On est du même côté je crois."',
            effet: 'jessica_alliance',
            detail: 'Alliance possible. Info sur John.',
            impact: (gs) => {
              gs.jessica_alliance_rousse = true;
              gs.credibilite = Math.min(100, (gs.credibilite || 0) + 3);
            }
          },
          {
            texte: 'Partir sans rien ajouter.',
            effet: 'jessica_esquive',
            detail: 'Discret. Mais une piste perdue.',
            impact: (gs) => { gs.jessica_esquive_rousse = true; }
          }
        ]
      }
    ];

    // ===================================================
    // SCÈNES LUCIOUS
    // ===================================================

    const SCENES_LUCIOUS = [
      {
        id: 'lucious_01',
        semaine_min: 1,
        titre: 'L\'Appartement de John Wang',
        texte: `Lucious crochète la serrure en quelques secondes. L'appartement sent le renfermé, la naphtaline, l'encens éteint. Vingt mètres carrés. Costumes synthétiques, manuels de chimie, matelas au sol. Une tour de VHS. <em>La cassette dans le magnéto : Les Aventuriers de l'Arche Perdue.</em> Il allume. Il sourit malgré lui.`,
        choix: [
          {
            texte: 'Fouiller méthodiquement.',
            effet: 'lucious_fouille',
            detail: 'Trouve les cassettes de location.',
            impact: (gs) => {
              gs.lucious_cassettes_trouvees = true;
              gs.info_john_wang = true;
            }
          },
          {
            texte: 'Regarder le film d\'abord.',
            effet: 'lucious_film',
            detail: 'Indiana Jones meurt. Micro-métrage.',
            impact: (gs) => {
              gs.lucious_vu_micro = true;
              gs.credibilite = Math.min(100, (gs.credibilite || 0) + 2);
            }
          }
        ]
      },
      {
        id: 'lucious_02',
        semaine_min: 2,
        titre: 'L\'Autel',
        texte: `Près de la fenêtre — un autel bricolé. Statuette de Bouddha. Bâtons d'encens consumés. Des rouleaux de papier ligaturés de fil rouge. Lucious en déplie un. <em>"Que j'arrive à partir de mon boulot."</em> Un autre. <em>"Qu'elle ne me quitte jamais."</em> Prières de survie griffonnées à l'encre pâle.`,
        choix: [
          {
            texte: 'Prendre les rouleaux comme preuve.',
            effet: 'lucious_rouleaux',
            detail: 'Info sur John. Piste vers la pépinière.',
            impact: (gs) => {
              gs.lucious_rouleaux = true;
              gs.info_pepiniere  = true;
            }
          },
          {
            texte: 'Les laisser. Ce sont des prières.',
            effet: 'lucious_respect',
            detail: 'Rien de concret. Mais quelque chose d\'autre.',
            impact: (gs) => { gs.lucious_respect = true; }
          }
        ]
      },
      {
        id: 'lucious_03',
        semaine_min: 2,
        titre: 'Blasphème',
        texte: `À l'écran — la boule de pierre dévale. Lucious regarde malgré lui. Elle se rapproche. Indiana Jones court. <em>Écran noir brutal. KRUNCH. Froissement de chair.</em> Il reste bouche bée. Quelqu'un a osé modifier Les Aventuriers de l'Arche Perdue. Indiana Jones est mort. C'est une cassette noire. Un micro-métrage.`,
        choix: [
          {
            texte: 'Emporter la cassette.',
            effet: 'lucious_cassette_noire',
            detail: 'Piste vers le Rewind Paradise.',
            impact: (gs) => {
              gs.lucious_cassette_noire = true;
              gs.exposition = Math.min(100, (gs.exposition || 0) + 8);
            }
          },
          {
            texte: 'La laisser. Trop compromettant.',
            effet: 'lucious_laisse',
            detail: 'Légalité -3. Prudent.',
            impact: (gs) => {
              gs.legalite = Math.max(0, (gs.legalite || 0) - 3);
            }
          }
        ]
      },
      {
        id: 'lucious_04',
        semaine_min: 3,
        titre: 'Le Vidéoclub',
        texte: `Lucious entre dans le Rewind Paradise. L'odeur — plastique chauffé, dépoussiérant, marijuana mal dissimulée. Il dépose deux cassettes sur le comptoir. L'employé derrière est avachi sur un tabouret. <em>Une doudoune bleue. Une coupe au bol indisciplinée.</em> Lucious attend. L'homme lève les yeux. "Ah !"`,
        choix: [
          {
            texte: '"Ces cassettes viennent de l\'appartement de John Wang."',
            effet: 'lucious_confronte',
            detail: 'Confrontation directe. Exposition +10.',
            impact: (gs) => {
              gs.lucious_confronte_rewind = true;
              gs.exposition = Math.min(100, (gs.exposition || 0) + 10);
            }
          },
          {
            texte: 'Observer d\'abord. Ne rien dire.',
            effet: 'lucious_observe',
            detail: 'Info sur le vidéoclub. Discret.',
            impact: (gs) => {
              gs.lucious_observe_rewind = true;
              gs.info_dimaggio = (gs.info_dimaggio || 0) + 1;
            }
          }
        ]
      }
    ];

    // ===================================================
    // INIT
    // ===================================================

    window.onload = function() {
      const save = localStorage.getItem('rewindParadise_save');
      if (!save) { window.location.href = 'index.html'; return; }
      gameState = JSON.parse(save);

      initMusic();
      updateNightInfo();
      afficherBilan();
      afficherCollecte();
      afficherFanzine();
      afficherScenes();
      setTimeout(afficherMessages, 600);
    };

    // ===================================================
    // BILAN
    // ===================================================

    function afficherBilan() {
      const gs   = gameState;
      const note = gs.currentNote || 0;
      const susp = gs.suspicion   || 0;

      const lignes = [
        {
          nom: 'CAISSE',
          val: gs.argent + '$',
          classe: gs.argent >= 200 ? 'positif'
                : gs.argent >= 80  ? 'neutre'
                : 'negatif'
        },
        {
          nom: 'NOTE CUTTER',
          val: note > 0 ? note + '/10' : '—',
          classe: note >= 7 ? 'positif'
                : note >= 4 ? 'neutre'
                : note > 0  ? 'negatif'
                : 'neutre'
        },
        {
          nom: 'LÉGALITÉ',
          val: gs.legalite + '%',
          classe: gs.legalite < 30 ? 'positif'
                : gs.legalite < 60 ? 'neutre'
                : 'negatif'
        },
        {
          nom: 'EXPOSITION',
          val: gs.exposition + '%',
          classe: gs.exposition < 30 ? 'positif'
                : gs.exposition < 60 ? 'neutre'
                : 'negatif'
        },
        {
          nom: 'SUSPICION',
          val: susp + '%',
          classe: susp < 40 ? 'positif'
                : susp < 70 ? 'warning'
                : 'negatif'
        },
        {
          nom: 'RÉPUTATION',
          val: gs.reputation > 0
            ? '★'.repeat(Math.round(gs.reputation))
            : '—',
          classe: gs.reputation >= 3 ? 'positif'
                : gs.reputation >= 2 ? 'neutre'
                : 'negatif'
        }
      ];

      document.getElementById('bilan-contenu').innerHTML =
        lignes.map(l => `
          <div class="bilan-ligne">
            <span class="bilan-nom">${l.nom}</span>
            <span class="bilan-val ${l.classe}">${l.val}</span>
          </div>
        `).join('');
    }

    // ===================================================
    // COLLECTE JACKSON
    // ===================================================

    function getCollecteMontant(gs) {
      const base  = 80;
      const bonus = Math.floor((gs.credibilite || 0) / 20) * 10;
      return base + bonus;
    }

    function afficherCollecte() {
      const gs          = gameState;
      const estMercredi = ((gs.jour - 1) % 7) === 2;
      if (!estMercredi) return;

      const montant = getCollecteMontant(gs);
      const zone    = document.getElementById('collecte-zone');
      const btn     = document.getElementById('collecte-btn');

      document.getElementById('collecte-montant').textContent =
        montant + '$';

      if (gs.argent >= montant) {
        document.getElementById('collecte-detail').textContent =
          'Jackson passe ce soir. La somme est prête. Il repart sans un mot.';
        btn.className   = 'collecte-btn';
        btn.textContent = 'REMETTRE LA COLLECTE';
      } else {
        const manque = montant - gs.argent;
        document.getElementById('collecte-detail').textContent =
          `Il manque ${manque}$. Jackson va pas apprécier. C'est un euphémisme.`;
        btn.className   = 'collecte-btn manque';
        btn.textContent = 'REMETTRE CE QU\'ON A';
      }

      zone.classList.add('visible');
    }

    function payerJackson() {
      const gs      = gameState;
      const montant = getCollecteMontant(gs);

      if (gs.argent >= montant) {
        gs.argent -= montant;
        gs.jacksonHumeur = 'cool';
        showNotif('Collecte remise. Jackson repart.');
      } else {
        const paye  = gs.argent;
        const manque = montant - paye;
        gs.argent   = 0;
        gs.jacksonHumeur = 'tendu';
        gs.legalite = Math.min(100, gs.legalite + 5);
        showNotif(`${paye}$ remis. Il manquait ${manque}$.`);
      }

      document.getElementById('collecte-zone')
              .classList.remove('visible');
      saveGame();
    }

    // ===================================================
    // FANZINE CUTTER
    // ===================================================

    function afficherFanzine() {
      const gs      = gameState;
      const semaine = gs.semaine || 1;
      const note    = gs.currentNote || 0;

      if (semaine < 2) return;
      if (Math.random() > 0.5) return;

      const citations = [
        "Un micro-métrage c'est pas résumer un film. C'est trouver le moment où le film n'a plus besoin de continuer.",
        "La bascule c'est pas un moment. C'est une décision.",
        "Couper trop tôt c'est de la lâcheté déguisée en minimalisme.",
        "Couper trop tard c'est vouloir expliquer. Le cinéma n'explique pas.",
        "Le meilleur micro-métrage que j'ai vu cette année. Je donne pas le nom. Pas encore.",
        "Quelqu'un dans ce quartier fait du cinéma sans le savoir. Ou en le sachant très bien.",
        "Un bon micro-métrage ne change pas la fin. Il révèle que le début était déjà foutu.",
        "Je ne comprends pas encore pourquoi cette coupe fonctionne. Mais elle fonctionne. Je déteste ça.",
        "Ce film est sur le regard. Couper sur le regard c'est soit de la lâcheté soit du génie.",
        "Votre coupe révèle si vous faites confiance au spectateur.",
        "Il y a des gens dans ce quartier qui comprennent le cinéma. Et qui font autre chose.",
        "La prochaine coupe que je vois comme celle-là — je publie le nom."
      ];

      // Citation liée à la note si dispo
      let citation;
      if (note >= 9) {
        citation = "Je ne comprends pas encore pourquoi cette coupe fonctionne. Mais elle fonctionne. Je déteste ça.";
      } else if (note >= 7) {
        citation = "Quelqu'un dans ce quartier fait du cinéma sans le savoir. Ou en le sachant très bien.";
      } else if (note <= 3 && note > 0) {
        citation = "Couper trop tôt c'est de la lâcheté déguisée en minimalisme.";
      } else {
        citation = citations[Math.floor(Math.random() * citations.length)];
      }

      const nums = ['#17', '#18', '#19', '#20', '#21', '#22'];
      const num  = nums[Math.floor(Math.random() * nums.length)];

      document.getElementById('fanzine-num').textContent =
        'CELLULOÏD SCALPEL ' + num + ' — THE GLITCH';
      document.getElementById('fanzine-citation').textContent =
        '"' + citation + '"';

      document.getElementById('fanzine-card').classList.add('visible');
    }

    // ===================================================
    // MESSAGES
    // ===================================================

    function afficherMessages() {
      const gs      = gameState;
      const section = document.getElementById('messages-section');
      const note    = gs.currentNote    || 5;
      const humeur  = gs.jacksonHumeur  || 'cool';
      const susp    = gs.suspicion      || 0;

      const messages = [];
      const estMercredi = ((gs.jour - 1) % 7) === 2;

      // JACKSON
      if (!estMercredi) {
        let jacksonMsg   = '';
        let jacksonClasse = 'msg-jackson';

        if (humeur === 'furieux' || susp >= 70) {
          jacksonMsg    = getJacksonFurieux();
          jacksonClasse = 'msg-jackson furieux';
        } else if (humeur === 'tendu' || susp >= 50) {
          jacksonMsg    = getJacksonTendu(gs);
          jacksonClasse = 'msg-jackson tendu';
        } else {
          jacksonMsg = getJacksonCool(gs);
        }

        messages.push({
          expediteur: 'JACKSON',
          heure:      heure(),
          texte:      jacksonMsg,
          classe:     jacksonClasse,
          avatar:     'posters/jackson.png',
          important:  humeur !== 'cool'
        });
      }

      // COREY
      messages.push({
        expediteur: 'COREY',
        heure:      heure(true),
        texte:      getCoreyMsg(note),
        classe:     'msg-corey',
        avatar:     getCoreyAvatar(note),
        important:  false
      });

      // Message anonyme si suspicion haute
      if (susp >= 50) {
        messages.push({
          expediteur: '— ANONYME —',
          heure:      heureNuit(),
          texte:      'Faites attention. Quelqu\'un pose des questions sur le vidéoclub.',
          classe:     'msg-anonyme',
          avatar:     null,
          important:  true
        });
      }

      // DiMaggio S3+
      if (gs.semaine >= 3 && gs.ultimatum_dimaggio) {
        messages.push({
          expediteur: 'NUMÉRO INCONNU',
          heure:      '02:13',
          texte:      'M. DiMaggio vous attend. C\'est pas une suggestion. C\'est un rendez-vous.',
          classe:     'msg-anonyme',
          avatar:     null,
          important:  true
        });
      }

      // Cutter message si note remarquable
      if (note >= 9 || (note <= 2 && note > 0)) {
        messages.push({
          expediteur: 'THE GLITCH',
          heure:      heureNuit(),
          texte:      note >= 9
            ? 'Je sais pas encore qui vous êtes. Mais je cherche.'
            : 'Ce soir c\'était pas ça. Recommencez.',
          classe:     'msg-cutter',
          avatar:     'posters/cuter.png',
          important:  note >= 9
        });
      }

      // Afficher avec délai
      section.innerHTML = '';
      messages.forEach((msg, i) => {
        setTimeout(() => {
          const card = document.createElement('div');
          card.className = `message-card ${msg.classe}`;

          const couleur =
            msg.classe.includes('furieux') ? '#664422' :
            msg.classe.includes('tendu')   ? '#553322' :
            msg.classe.includes('jackson') ? '#2a2a50' :
            msg.classe.includes('corey')   ? '#ff885540' :
            msg.classe.includes('cutter')  ? '#4444aa' :
                                             '#111133';

          const avatarHtml = msg.avatar
            ? `<img class="msg-avatar"
                    src="${msg.avatar}" alt=""
                    onerror="this.style.display='none'">`
            : `<div style="width:42px;height:42px;border-radius:50%;
                    background:#060610;flex-shrink:0;
                    border:1px solid #111122;
                    display:flex;align-items:center;
                    justify-content:center;font-size:16px;">?</div>`;

          const classeTexte =
            msg.important ? 'important' :
            msg.classe.includes('furieux') ? 'urgent' : '';

          card.innerHTML = `
            <div class="msg-header-row">
              ${avatarHtml}
              <div class="msg-header-info">
                <span class="msg-expediteur"
                      style="color:${couleur}">
                  ${msg.expediteur}
                </span>
                <span class="msg-heure">${msg.heure}</span>
              </div>
            </div>
            <div class="msg-texte ${classeTexte}">
              "${msg.texte}"
            </div>
          `;

          section.appendChild(card);
        }, i * 500);
      });
    }

    // ===================================================
    // CONTENU MESSAGES
    // ===================================================

    function getJacksonCool(gs) {
      const pool = [
        "Les affaires continuent. C'est bien.",
        "T'as fait quoi ce soir ? Je veux pas savoir. Continue comme ça.",
        "Certaines personnes posent des questions. Réponds pas.",
        "Le vidéoclub tourne. Garde ça comme ça.",
        "Je t'ai dit de rien faire d'inhabituel. T'as écouté. Bien.",
        "Bonne semaine. Reste discret."
      ];
      let msg = pool[Math.floor(Math.random() * pool.length)];

      if (gs.semaine >= 3 && Math.random() > 0.5) {
        const dimaggio = [
          "DiMaggio a demandé si le Rewind Paradise était fiable. J'ai dit oui.",
          "DiMaggio sait que t'existes. C'est pas encore un problème.",
          "M. DiMaggio voudrait te rencontrer. Pas encore une invitation officielle."
        ];
        msg += ' ' + dimaggio[Math.floor(Math.random() * dimaggio.length)];
      }

      return msg;
    }

    function getJacksonTendu(gs) {
      const pool = [
        "Fais profil bas cette semaine. Je dis pas pourquoi.",
        "DiMaggio a entendu des choses. Je te dis ça pour que tu saches.",
        "J'ai eu des questions sur le Rewind Paradise. J'ai rien dit. Toi non plus.",
        "Reste tranquille. Pour l'instant.",
        "Le type en costume qui vient — laisse-le faire ce qu'il fait."
      ];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function getJacksonFurieux() {
      const pool = [
        "T'as un problème Fred. Et c'est mon problème aussi maintenant.",
        "Le Rewind Paradise peut fermer aussi vite qu'il a ouvert.",
        "DiMaggio est pas content. Moi non plus. C'est pas bon pour toi.",
        "Dernière chance. Je dis ça rarement.",
        "J'attends une explication. Courte. Claire. Ce soir."
      ];
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function getCoreyMsg(note) {
      if (note >= 9) return "Je savais que t'avais ça en toi. Dors bien.";
      if (note >= 7) return "Bonne coupe ce soir. Cutter va remarquer si c'est pas déjà fait.";
      if (note >= 5) return "Correct. La prochaine fois vas plus loin. T'as hésité.";
      if (note >= 3) return "C'était pas ça. On recommence demain. On a le temps.";
      if (note > 0)  return "Non. Juste... non. Dors.";
      return "Bonne nuit Fred.";
    }

    function getCoreyAvatar(note) {
      if (note >= 7) return 'posters/joie.png';
      if (note <= 3 && note > 0) return 'posters/colere.png';
      return 'posters/peur.png';
    }

    // ===================================================
    // HEURES
    // ===================================================

    function heure(tard) {
      const h = tard ? '00' : '23';
      const m = String(Math.floor(Math.random() * 59)).padStart(2,'0');
      return `${h}:${m}`;
    }

    function heureNuit() {
      const h = String(Math.floor(Math.random() * 3) + 1).padStart(2,'0');
      const m = String(Math.floor(Math.random() * 59)).padStart(2,'0');
      return `0${h}:${m}`;
    }

    // ===================================================
    // SCÈNES
    // ===================================================

    function afficherScenes() {
      const gs = gameState;

      const scJ = SCENES_JESSICA.find(s =>
        s.semaine_min <= gs.semaine &&
        !gs['scene_' + s.id + '_vue']
      );

      if (scJ && Math.random() > 0.3) {
        afficherScene('jessica', scJ);
      }

      const scL = SCENES_LUCIOUS.find(s =>
        s.semaine_min <= gs.semaine &&
        !gs['scene_' + s.id + '_vue']
      );

      if (scL && Math.random() > 0.3) {
        setTimeout(() => afficherScene('lucious', scL), 200);
      }
    }

    function afficherScene(perso, scene) {
      const card = document.getElementById('scene-' + perso);
      document.getElementById('scene-' + perso + '-num').textContent =
        scene.titre;
      document.getElementById('scene-' + perso + '-texte').innerHTML =
        scene.texte;

      const choixEl = document.getElementById('scene-' + perso + '-choix');
      choixEl.innerHTML = scene.choix.map((c, i) => `
        <div class="scene-choix-btn"
             onclick="resoudreScene('${perso}', ${i})">
          <div class="scene-choix-texte">▶ ${c.texte}</div>
          <div class="scene-choix-effet">${c.detail}</div>
        </div>
      `).join('');

      card.classList.add('visible');
      window['scene_' + perso + '_courante'] = scene;
    }

    function resoudreScene(perso, index) {
      const scene = window['scene_' + perso + '_courante'];
      if (!scene) return;

      scene.choix[index].impact(gameState);
      gameState['scene_' + scene.id + '_vue'] = true;

      document.getElementById('scene-' + perso)
              .classList.remove('visible');
      showNotif(scene.choix[index].effet);
      saveGame();
    }

    // ===================================================
    // DORMIR
    // ===================================================

    function dormirJusquAuMatin() {
      const gs = gameState;

      // Suspicion -5 chaque nuit
      gs.suspicion = Math.max(0, (gs.suspicion || 0) - 5);

      gs.jour++;
      if (gs.jour > 1 && (gs.jour - 1) % 7 === 0) gs.semaine++;

      // Récupération énergie
      const bonus = gs.energieBonusTomorrow || 0;
      gs.energie  = Math.min(
        gs.energieMax || 15,
        Math.round((gs.energieMax || 15) * 0.7) + bonus
      );
      gs.energieBonusTomorrow = 0;

      // Reset phase
      gs.phase_journee = 'matin';

      // Légalité monte si trop de distribution
      if ((gs.noires_distribuees || 0) > 3)
        gs.legalite = Math.min(100, gs.legalite + 2);

      // Fin du jeu ?
      if (gs.semaine > 4) {
        saveGame();
        fadeOutMusic(() => {
          document.body.classList.add('fade-out');
          setTimeout(() => {
            window.location.href = 'ending.html';
          }, 800);
        });
        return;
      }

      saveGame();
      fadeOutMusic(() => {
        document.body.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = 'game.html';
        }, 800);
      });
    }

    // ===================================================
    // UTILITAIRES
    // ===================================================

    function updateNightInfo() {
      document.getElementById('night-info').textContent =
        `Nuit — Jour ${gameState.jour}`;

      // Heure aléatoire entre 23h et 02h
      const options = ['23:', '00:', '01:', '02:'];
      const h = options[Math.floor(Math.random() * options.length)];
      const m = String(Math.floor(Math.random() * 59)).padStart(2,'0');
      document.getElementById('time-val').textContent = h + m;
    }

    function showNotif(message) {
      const notif = document.getElementById('notif');
      notif.textContent = message;
      notif.classList.add('visible');
      setTimeout(() => notif.classList.remove('visible'), 2500);
    }

    function saveGame() {
      localStorage.setItem(
        'rewindParadise_save',
        JSON.stringify(gameState)
      );
    }

  </script>

</body>
